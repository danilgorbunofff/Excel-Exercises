  - prompt: In D3, repair the line value so a quantity that is not a number gives 0 instead of an error.
    rows:
      - [Item, Qty, Price, Value]
      - [bolt, 4, 2.5, null]
      - [nut, n/a, 1.5, null]
      - [washer, 10, 0.4, null]
      - [screw, 6, 0.8, null]
    answerCell: D3
    expected: 0
    variants:
      - set: { B3: 5 }
        expected: 7.5
    answer: =IF(ISNUMBER(B3),B3*C3,0)
    hints:
      nudge: Check that the quantity is a number before multiplying.
      rule: ISNUMBER returns TRUE for a number and FALSE for text. Inside IF, it lets the multiplication run only when the quantity is a number.
    misses:
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
      value: B3 holds the text n/a, so the line is worth 0.
      syntax: "Check the brackets, commas and quote marks. IF follows the pattern `=IF(logical_test, value_if_true, [value_if_false])`."
      reference: The quantity is in B3.
    accept:
      - =IF(ISNUMBER(B3),B3*C3,0)
      - =if(isnumber(b3),b3*c3,0)
      - =IF(ISNUMBER($B$3),$B$3*$C$3,0)
      - =IF(ISNUMBER(B$3),B$3*C$3,0)
      - =IF( ISNUMBER( B3 ) , B3 * C3 , 0 )
      - =IF(ISNUMBER(B3),B3*C3,0)+0
    reject:
      - formula: =B3*C3
        rule: value
      - formula: =0
        rule: reference
      - formula: =IF(ISNUMBER(B3),B3*C3,"")
        rule: value
      - formula: =IF(ISNUMBER(B3),B3*C3,1)
        rule: value
      - formula: =IF(ISNUMBER(C3),B3*C3,0)
        rule: value
      - formula: =IF(ISNUMBER(B2),B2*C2,0)
        rule: value
      - formula: =IF(ISNUMBER(B3),B3*C3,0)/0
        rule: value
      - formula: =IF ISNUMBER(B3),B3*C3,0
        rule: syntax
  - prompt: In C2, repair the North total so its ranges cover every row of the table.
    rows:
      - [Region, Amount, Answer]
      - [North, 100, null]
      - [South, 200, null]
      - [North, 150, null]
      - [East, 90, null]
    answerCell: C2
    expected: 250
    variants:
      - { set: { B2: 137 }, expected: 287 }
      - { set: { A2: South }, expected: 150 }
      - { set: { A5: North }, expected: 340 }
    answer: =SUMIF(A2:A5,"North",B2:B5)
    hints:
      nudge: Both ranges must run from the first row of data to the last.
      rule: SUMIF takes the range to test, the condition, then the range to add. The two ranges should cover the same rows.
    misses:
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
      value: The two North rows hold 100 and 150, which total 250.
      syntax: "Check the brackets, commas and quote marks. SUMIF follows the pattern `=SUMIF(range, criteria, [sum_range])`."
      reference: The amount column is B2:B5.
    accept:
      - =SUMIF(A2:A5,"North",B2:B5)
      - =sumif(a2:a5,"north",b2:b5)
      - =SUMIF($A$2:$A$5,"North",$B$2:$B$5)
      - =SUMIF(A$2:A$5,"North",B$2:B$5)
      - =SUMIF( A2:A5 , "North" , B2:B5 )
      - =SUMIF(A2:A5,"North",B2:B5)+0
    reject:
      - formula: =SUM(B2:B5)
        rule: value
      - formula: =SUMIF(A2:A3,"North",B2:B3)
        rule: value
      - formula: =SUMIF(A2:A5,"South",B2:B5)
        rule: value
      - formula: =SUMIF(A3:A5,"North",B3:B5)
        rule: value
      - formula: =SUMIF(A2:A5,"North",B2:B5)/0
        rule: value
      - formula: =SUMIF A2:A5,"North",B2:B5
        rule: syntax
  - prompt: In C2, repair the average of the score column, which shows a `#NAME?` error.
    rows:
      - [Name, Score, Answer]
      - [Ana, 82, null]
      - [Bo, 91, null]
      - [Cy, 78, null]
      - [Di, 88, null]
    answerCell: C2
    expected: 84.75
    variants:
      - set: { B2: 112 }
        expected: 92.25
    answer: =AVERAGE(B2:B5)
    hints:
      nudge: A name error usually means Excel does not recognise the function name, so check the spelling.
      rule: Excel shows `#NAME?` when a function name is misspelt. AVERAGE adds the numbers in a range and divides by how many there are.
    misses:
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
      value: The four scores total 339, so the average is 84.75.
      syntax: "Check the brackets, commas and quote marks. AVERAGE follows the pattern `=AVERAGE(number1, [number2], ...)`."
      reference: The score column is B2:B5.
    accept:
      - =AVERAGE(B2:B5)
      - =average(b2:b5)
      - =AVERAGE($B$2:$B$5)
      - =AVERAGE(B$2:B$5)
      - =AVERAGE( B2:B5 )
      - =AVERAGE(B2:B5)+0
    reject:
      - formula: =AVRAGE(B2:B5)
        rule: syntax
      - formula: =SUM(B2:B5)
        rule: value
      - formula: =AVERAGE(B2:B4)
        rule: value
      - formula: =AVERAGE(B3:B5)
        rule: value
      - formula: =AVERAGE(B2:B5)/0
        rule: value
      - formula: =AVERAGE B2:B5
        rule: syntax
notes:
  summary: Each error code names one kind of break, such as a zero divisor, a missing lookup key, text in arithmetic or a misspelt function name. Most repairs test for that cause before the failing step runs.
  syntax: "each error code names one break: a zero divisor, a missing key, text in arithmetic, a wrong range, a misspelling"
  example: '`=IF(B1=0,"n/a",A1/B1)` with 6 in A1 and 0 in B1 gives n/a instead of `#DIV/0!`.'
  commonErrors:
    - A zero denominator gives `#DIV/0!`. Test it with IF before dividing.
    - A lookup key that is not in the table gives `#N/A`. Count it with COUNTIF first.
    - Text in arithmetic gives `#VALUE!`. Test the cell with ISNUMBER first.
