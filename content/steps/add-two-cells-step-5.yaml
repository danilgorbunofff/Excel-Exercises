screens:
  - prompt: In B5, what does the customer pay in total? Delivery in B3 is free when the price in B2 is 50 or more.
    rows:
      - [Item, Cost]
      - [Price, 42]
      - [Delivery, 4.99]
      - [Free delivery from, 50]
      - [To pay, null]
    answerCell: B5
    expected: 46.99
    variants:
      - set: { B2: 60 }
        expected: 60
      - set: { B2: 50 }
        expected: 50
      - set: { B3: 6.5 }
        expected: 48.5
    answer: =B2+IF(B2>=B4,0,B3)
    requiredFunctions: []
    hints:
      nudge: Add the delivery only when the price is under the limit in B4.
      rule: IF(B2>=B4,0,B3) gives 0 for delivery at the limit or above, and the charge below it. Add that to the price.
    misses:
      value: The customer pays 46.99 here. Delivery counts only below the limit.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =B2+IF(B2>=B4,0,B3)
      - =IF(B2>=B4,B2,B2+B3)
      - =B2+(B2<B4)*B3
    reject:
      - formula: =B2+B3
        rule: fragile
      - formula: =B2+IF(B2>B4,0,B3)
        rule: fragile
      - formula: =46.99
        rule: reference
      - formula: =B2+IF(B2>=B4,0,B3
        rule: syntax
