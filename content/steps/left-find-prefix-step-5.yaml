title: Company name in an email address
updated: 2026-11-25
checkedInExcel: 2026-11-25
parent: left-find-prefix
step: 5
screens:
  - prompt: "In B2, what is the company name in the email address in A2: the part between the @ and the next dot?"
    rows:
      - [Email, Company]
      - [ada.lovelace@engines.co.uk, null]
    answerCell: B2
    expected: engines
    variants:
      - set: { A2: grace@navy.mil }
        expected: navy
      - set: { A2: alan.m.turing@bletchley.org }
        expected: bletchley
      - set: { A2: k.j@nasa.gov }
        expected: nasa
    answer: =MID(A2,FIND("@",A2)+1,FIND(".",A2,FIND("@",A2))-FIND("@",A2)-1)
    requiredFunctions: []
    hints:
      nudge: The user name can hold dots too, so look for the first dot after the @.
      rule: FIND takes a third part, the position to start from. Start the search for the dot at the @, then take the characters between them with MID.
    misses:
      value: The company name is engines.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =MID(A2,FIND("@",A2)+1,FIND(".",A2,FIND("@",A2))-FIND("@",A2)-1)
      - =LEFT(MID(A2,FIND("@",A2)+1,LEN(A2)),FIND(".",MID(A2,FIND("@",A2)+1,LEN(A2)))-1)
      - =TEXTBEFORE(TEXTAFTER(A2,"@"),".")
      - =MID(A2,SEARCH("@",A2)+1,SEARCH(".",A2,SEARCH("@",A2))-SEARCH("@",A2)-1)
    reject:
      - formula: =MID(A2,FIND("@",A2)+1,FIND(".",A2)-FIND("@",A2)-1)
        rule: value
      - formula: =MID(A2,FIND("@",A2),FIND(".",A2,FIND("@",A2))-FIND("@",A2))
        rule: value
      - formula: =LEFT(A2,FIND("@",A2)-1)
        rule: value
      - formula: ="engines"
        rule: reference
      - formula: =MID(A2,FIND("@",A2)+1,FIND(".",A2,FIND("@",A2))-FIND("@",A2)-1
        rule: syntax
