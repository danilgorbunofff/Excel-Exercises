id: proper-drill-3
slug: proper-drill-3
level: 2
title: Hyphens and apostrophes
updated: 2026-11-17
checkedInExcel: 2026-11-17
function: PROPER
screens:
  - prompt: In B2, use PROPER to capitalise the name in A2, which has a hyphen and an apostrophe.
    rows:
      - [Name, Result]
      - [mary-jane o'neil, null]
    answerCell: B2
    expected: Mary-Jane O'Neil
    variants:
      - set: { A2: jean-luc d'arc }
        expected: Jean-Luc D'Arc
    answer: =PROPER(A2)
    requiredFunctions:
      - PROPER
    hints:
      nudge: PROPER starts a new word after any character that is not a letter.
      rule: PROPER capitalises the letter after a hyphen or an apostrophe too.
    misses:
      value: Capitalised, the name reads Mary-Jane O'Neil.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for PROPER.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =PROPER(A2)
      - =LET(v,A2,PROPER(v))
    reject:
      - formula: =UPPER(A2)
        rule: required-function
      - formula: ="Mary-Jane O'Neil"
        rule: required-function
      - formula: =PROPER(A2
        rule: syntax
