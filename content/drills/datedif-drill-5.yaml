id: datedif-drill-5
slug: datedif-drill-5
level: 2
title: Years and months as text
updated: 2026-11-17
checkedInExcel: 2026-11-17
function: DATEDIF
screens:
  - prompt: In D2, use DATEDIF twice to write the age of someone born on B2, on C2, as text such as "36 years, 2 months".
    rows:
      - [Name, Born, On, Age]
      - [Ann, 33109, 46343, null]
    answerCell: D2
    expected: 36 years, 2 months
    variants:
      - set: { C2: 46419 }
        expected: 36 years, 5 months
    answer: =DATEDIF(B2,C2,"y")&" years, "&DATEDIF(B2,C2,"ym")&" months"
    requiredFunctions:
      - DATEDIF
    hints:
      nudge: Join the years, the text " years, ", the months and " months" with &.
      rule: '"y" gives whole years and "ym" the months left over.'
    misses:
      value: The cell should read 36 years, 2 months.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for DATEDIF.
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
    accept:
      - =DATEDIF(B2,C2,"y")&" years, "&DATEDIF(B2,C2,"ym")&" months"
    reject:
      - formula: =DATEDIF(B2,C2,"y")&" years, "&DATEDIF(B2,C2,"m")&" months"
        rule: value
      - formula: =DATEDIF(B2,C2,"y")&" years"
        rule: value
      - formula: ="36 years, 2 months"
        rule: required-function
      - formula: =DATEDIF(B2,C2,"y")&" years, "&DATEDIF(B2,C2,"ym")&" months",
        rule: syntax
