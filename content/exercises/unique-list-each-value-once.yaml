notes:
  summary: UNIQUE returns each distinct value of a range once, in the order it first appears. Text compares without case.
  syntax: "UNIQUE(array, [by_col], [exactly_once])"
  example: "`=COUNTA(UNIQUE(C2:C19))` counts the different reps in C2:C19."
  commonErrors:
    - COUNT counts numbers only, so it gives 0 for a list of names. Use COUNTA or ROWS.
    - TRUE as the third argument keeps only values that appear exactly once, which is a different list.
    - Spaces at the end of a value make it look different to UNIQUE.
