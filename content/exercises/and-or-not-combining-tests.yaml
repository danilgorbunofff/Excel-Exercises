    answer: =OR(MIN(B2:B7)<20,B8>200)
    hints:
      nudge: Either test is enough, and the smallest item tells you whether any item is under 20.
      rule: OR returns TRUE when at least one test inside it is TRUE. MIN gives the smallest value, so a test on MIN checks whether any item falls below a limit.
    misses:
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
      value: Bolt has 18 units, under 20, so the first test already makes the answer TRUE.
      syntax: "Check the brackets and commas. OR follows the pattern `=OR(logical1, [logical2], ...)`."
      reference: Look through the units column for the smallest item and read the total from B8.
