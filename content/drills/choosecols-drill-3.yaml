id: choosecols-drill-3
slug: choosecols-drill-3
level: 2
title: The column from a cell
updated: 2026-11-19
checkedInExcel: 2026-11-19
function: CHOOSECOLS
screens:
  - prompt: In E2, use CHOOSECOLS to return the column of A2:C7 whose number is in I1.
    rows:
      - [Rep, Region, Sales, null, Result, null, null, null, 3]
      - [Ann, East, 400, null, null, null, null, null, null]
      - [Bo, West, 250, null, null, null, null, null, null]
      - [Cy, East, 310, null, null, null, null, null, null]
      - [Di, North, 520, null, null, null, null, null, null]
      - [Ed, East, 190, null, null, null, null, null, null]
      - [Flo, West, 330, null, null, null, null, null, null]
      - [null, null, null, null, null, null, null, null, null]
    answerCell: E2
    expected:
      - [400]
      - [250]
      - [310]
      - [520]
      - [190]
      - [330]
    variants:
      - set: { I1: 2 }
        expected:
          - - East
          - - West
          - - East
          - - North
          - - East
          - - West
      - set: { I1: 1 }
        expected:
          - - Ann
          - - Bo
          - - Cy
          - - Di
          - - Ed
          - - Flo
    answer: =CHOOSECOLS(A2:C7,I1)
    requiredFunctions:
      - CHOOSECOLS
    hints:
      nudge: The column number can come from a cell.
      rule: Put the cell I1 where the column number goes. CHOOSECOLS then follows whatever number I1 holds.
    misses:
      value: Column 3 holds the sales 400, 250, 310, 520, 190, 330.
      syntax: Check the brackets, commas and quotes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =CHOOSECOLS(A2:C7,I1)
    reject:
      - formula: =CHOOSECOLS(A2:C7,3)
        rule: fragile
      - formula: =CHOOSECOLS(A2:C7,I1
        rule: syntax
