      - [Bolts, 120, 200, null, null, null]
    answerCell: D2
    expected: 7
    variants:
      - set: { B2: 230 }
        expected: 0
      - set: { F1: 25 }
        expected: 4
    answer: =ROUNDUP(MAX(0,C2-B2)/F1,0)
    requiredFunctions:
      - ROUNDUP
      - MAX
    hints:
      nudge: Work out the shortfall, never below 0, then cases rounded up.
      rule: MAX(0,C2-B2) stops a negative order; dividing by the case size and ROUNDUP gives whole cases.
    misses:
      value: Order 7 cases.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for ROUNDUP and MAX.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =ROUNDUP(MAX(0,C2-B2)/F1,0)
      - =ROUNDUP(MAX(C2-B2,0)/$F$1,0)
    reject:
