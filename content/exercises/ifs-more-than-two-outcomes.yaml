id: ifs-more-than-two-outcomes
slug: ifs-more-than-two-outcomes
level: 3
title: "IFS: more than two outcomes"
topic: logic
updated: 2026-11-11
checkedInExcel: null
screens:
  - prompt: "In B6, band Ben's score: 90 and above is A, 80 and above B, 70 and above C, otherwise D."
    rows:
      - [Name, Score]
      - [Ada, 92]
      - [Ben, 78]
      - [Cleo, 85]
      - [Dev, 64]
      - [Bands, null]
    answerCell: B6
    expected: C
    answer: =IFS(B3>=90,"A",B3>=80,"B",B3>=70,"C",TRUE,"D")
    requiredFunctions: [IFS]
    hints:
      nudge: Test the highest band first and work down, with a catch-all at the end.
      rule: IFS reads pairs of test and result and returns the result of the first test that is TRUE. A final TRUE test catches every score the earlier tests missed.
    misses:
      value: 78 is under 80 and at least 70, so the third pair answers C.
      syntax: "=IFS(test 1, result 1, test 2, result 2, ..., TRUE, fallback): the pairs are read top to bottom."
      required-function: Nested IFs would work, but this exercise wants the function built for several outcomes.
      reference: Band the score in B3 rather than typing 78.
    accept:
      - =IFS(B3>=90,"A",B3>=80,"B",B3>=70,"C",TRUE,"D")
      - =ifs(b3>=90,"A",b3>=80,"B",b3>=70,"C",true,"D")
      - =IFS($B$3>=90,"A",$B$3>=80,"B",$B$3>=70,"C",TRUE,"D")
      - =IFS(B$3>=90,"A",B$3>=80,"B",B$3>=70,"C",TRUE,"D")
      - =IFS($B3>=90,"A",$B3>=80,"B",$B3>=70,"C",TRUE,"D")
      - =IFS(B3>89,"A",B3>79,"B",B3>69,"C",TRUE,"D")
    reject:
      - { formula: '=IFS(B3>=90,"A",B3>=80,"B",TRUE,"D")', rule: value }
      - { formula: '=IFS(B3>=90,"B",B3>=80,"C",B3>=70,"D",TRUE,"A")', rule: value }
      - { formula: '=IF(B3>=90,"A","D")', rule: required-function }
      - { formula: '=IFS(B4>=90,"A",B4>=80,"B",B4>=70,"C",TRUE,"D")', rule: value }
      - { formula: '=IFS(B3>=90,"A",B3>=80,"B",B3>=70,"C",TRUE,"D")/0', rule: value }
      - { formula: '=IFS(B3>=90 "A",B3>=80,"B")', rule: syntax }
  - prompt: "In B6, label Cleo: 90 and above is Merit, 80 and above Pass, anything lower is Resit."
    rows:
      - [Name, Score]
      - [Ada, 92]
      - [Ben, 78]
      - [Cleo, 85]
      - [Dev, 64]
      - [Labels, null]
    answerCell: B6
    expected: Pass
    answer: =IFS(B4>=90,"Merit",B4>=80,"Pass",TRUE,"Resit")
    requiredFunctions: [IFS]
    hints:
      nudge: Three labels need two tests and a catch-all, highest band first.
      rule: IFS stops at the first TRUE test, so the highest threshold goes first. A last pair whose test is TRUE gives the result for everything lower.
    misses:
      value: 85 is under 90 but at least 80, so the second pair returns Pass.
      syntax: "=IFS(test 1, result 1, test 2, result 2, TRUE, fallback): three outcomes need two tests."
      required-function: Merit and Pass are two tests, and Resit is the fallback that catches everything lower.
      reference: Label Cleo's score from B4.
    accept:
      - =IFS(B4>=90,"Merit",B4>=80,"Pass",TRUE,"Resit")
      - =ifs(b4>=90,"Merit",b4>=80,"Pass",true,"Resit")
      - =IFS($B$4>=90,"Merit",$B$4>=80,"Pass",TRUE,"Resit")
      - =IFS(B$4>=90,"Merit",B$4>=80,"Pass",TRUE,"Resit")
      - =IFS($B4>=90,"Merit",$B4>=80,"Pass",TRUE,"Resit")
      - =IFS(B4>89,"Merit",B4>79,"Pass",TRUE,"Resit")
    reject:
      - { formula: '=IFS(B4>=80,"Resit",B4>=90,"Merit",TRUE,"Pass")', rule: value }
      - { formula: '=IFS(B4>=90,"Merit",B4>=86,"Pass",TRUE,"Resit")', rule: value }
      - { formula: '=IF(B4>=90,"Merit","Resit")', rule: required-function }
      - { formula: '=IFS(B2>=90,"Merit",B2>=80,"Pass",TRUE,"Resit")', rule: value }
      - { formula: '=IFS(B4>=90,"Merit",B4>=80,"Pass",TRUE,"Resit")/0', rule: value }
      - { formula: '=IFS(B4>=90,"Merit" B4>=80,"Pass")', rule: syntax }
notes:
  summary: IFS takes pairs of test and result and returns the result of the first test that is TRUE. A final pair whose test is TRUE acts as the fallback.
  syntax: IFS(test1, result1, test2, result2, ..., TRUE, fallback)
  example: '`=IFS(A1>=90,"A",A1>=80,"B",TRUE,"C")` with 85 in A1 gives B.'
  commonErrors:
    - No test was TRUE and there was no TRUE fallback pair, so a score under the last band has nothing to return.
    - The pairs are uneven and a test has no result of its own.
    - The version of Excel in use has no IFS, or the name is mistyped.
