title: Left lookup with INDEX and MATCH
updated: 2026-11-25
checkedInExcel: 2026-11-25
parent: lookup-functions-summary
step: 4
screens:
  - prompt: In B7, return the product name for the SKU in B6 with INDEX and MATCH instead of XLOOKUP.
    rows:
      - [Product, SKU, On hand]
      - [Bracket, BX-210, 240]
      - [Clamp, CX-330, 96]
      - [Dowel, DX-410, 60]
      - [Extrusion, EX-500, 18]
      - [Which SKU?, BX-210, null]
      - [Product, null, null]
    answerCell: B7
    expected: Bracket
    variants:
      - { set: { B6: DX-410 }, expected: Dowel }
      - { set: { B6: EX-500, B2: Extrusion }, expected: Extrusion }
    answer: =INDEX(A2:A5,MATCH(B6,B2:B5,0))
    requiredFunctions:
      - INDEX
      - MATCH
    hints:
      nudge: MATCH finds the row in the SKU column; INDEX reads the name on it.
      rule: MATCH with 0 finds the SKU's row, and INDEX reads the name column at that row. It works left or right, in any Excel version.
    misses:
      value: BX-210 is the Bracket.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for INDEX and MATCH.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =INDEX(A2:A5,MATCH(B6,B2:B5,0))
      - =INDEX($A$2:$A$5,MATCH($B$6,$B$2:$B$5,0))
    reject:
      - formula: =INDEX(C2:C5,MATCH(B6,B2:B5,0))
        rule: value
      - formula: =XLOOKUP(B6,B2:B5,A2:A5)
        rule: required-function
      - formula: ="Bracket"
        rule: required-function
      - formula: =INDEX(A2:A5,MATCH(B6,B2:B5,0)
        rule: syntax
