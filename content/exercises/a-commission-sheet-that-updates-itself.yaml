screens:
  - prompt: In C2, pay the first seller their sales times the tier rate those sales reach.
    rows:
      - [Seller, Sales, Commission]
      - [Ana, 4200, null]
      - [Bo, 1800, null]
      - [Cy, 9000, null]
      - [null, null, null]
      - [Tier, Rate, null]
      - [0, 0.02, null]
      - [2000, 0.03, null]
      - [4000, 0.05, null]
    answerCell: C2
    expected: 210
    variants:
      - set: { B2: 5754 }
        expected: 287.7
      - set: { A9: 5480 }
        expected: 126
    answer: =ROUND(B2*VLOOKUP(B2,$A$7:$B$9,2,TRUE),2)
    hints:
      nudge: Look up the rate the sales figure reaches in the tier table, then multiply the sales by it.
      rule: VLOOKUP with TRUE as its last argument finds the largest tier floor that is not above the value and returns the rate beside it. The floors must be sorted from smallest to largest.
    misses:
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
      value: 4200 sits in the five per cent band, and five per cent of 4200 is 210.
      syntax: "Check the brackets, commas and quote marks. ROUND follows the pattern `=ROUND(number, num_digits)`."
      reference: Start from the sales figure in B2.
    accept:
      - =ROUND(B2*VLOOKUP(B2,$A$7:$B$9,2,TRUE),2)
      - =round(b2*vlookup(b2,$a$7:$b$9,2,true),2)
      - =VLOOKUP(B2,$A$7:$B$9,2,TRUE)*B2
      - =VLOOKUP(B2,$A$7:$B$9,2,1)*B2
      - =B2*VLOOKUP($B$2,$A$7:$B$9,2,1)
      - =ROUND( B2 * VLOOKUP( B2 , $A$7:$B$9 , 2 , TRUE ) , 2 )
    reject:
