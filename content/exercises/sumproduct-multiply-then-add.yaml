id: sumproduct-multiply-then-add
slug: sumproduct-multiply-then-add
level: 3
title: "SUMPRODUCT: multiply the pairs, then add them up"
topic: subtotals
updated: 2026-11-16
checkedInExcel: 2026-11-16
screens:
  - prompt: "In D5, total the value of the stock: price times quantity on every row, added up."
    rows:
      - [Item, Price, Qty, Value]
      - [pen, 10, 2, null]
      - [pad, 5, 4, null]
      - [ink, 20, 3, null]
      - [Total stock, null, null, null]
    answerCell: D5
    expected: 100
    variants:
      - set: { B2: 14 }
        expected: 108
      - set: { C2: 5 }
        expected: 130
    answer: =SUMPRODUCT(B2:B4,C2:C4)
    hints:
      nudge: One function multiplies two columns row by row and adds up the results.
      rule: SUMPRODUCT takes ranges of the same size, multiplies the matching cells and returns the sum of those products.
    misses:
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
      value: 10 times 2 is 20, 5 times 4 is 20 and 20 times 3 is 60, which total 100.
      syntax: "Check the brackets, commas and quote marks. SUMPRODUCT follows the pattern `=SUMPRODUCT(array1, [array2], ...)`."
      reference: Point at the price and quantity cells, not at numbers typed into the formula.
    accept:
      - =SUMPRODUCT(B2:B4,C2:C4)
      - =sumproduct(b2:b4,c2:c4)
      - =SUMPRODUCT($B$2:$B$4,$C$2:$C$4)
      - =SUMPRODUCT(B$2:B$4,C$2:C$4)
      - =SUMPRODUCT( B2:B4 , C2:C4 )
      - =SUMPRODUCT(B2:B4,C2:C4)+0
    reject:
      - formula: =SUM(B2:B4)
        rule: value
      - formula: =SUMPRODUCT(B2:B4)
        rule: value
      - formula: =SUMPRODUCT(B2:B4,B2:B4)
        rule: value
      - formula: =SUMPRODUCT(B3:B4,C3:C4)
        rule: value
      - formula: =SUMPRODUCT(B2:B4,C2:C4)/0
        rule: value
      - formula: =SUMPRODUCT B2:B4,C2:C4
        rule: syntax
  - prompt: In D5, work out the average price paid per item, counting each row once per unit it holds, rounded to one decimal place.
    rows:
      - [Item, Price, Qty, Answer]
      - [pen, 10, 2, null]
      - [pad, 5, 4, null]
      - [ink, 20, 3, null]
      - [Average price, null, null, null]
    answerCell: D5
    expected: 11.1
    variants:
      - { set: { B2: 14 }, expected: 12 }
      - { set: { C2: 5 }, expected: 10.8 }
      - { set: { B2: 0 }, expected: 8.9 }
    answer: =ROUND(SUMPRODUCT(B2:B4,C2:C4)/SUM(C2:C4),1)
    hints:
      nudge: An average that counts every unit is the total value divided by the total number of units.
      rule: A weighted average divides the sum of value times weight by the sum of the weights. ROUND with 1 as its second argument keeps one decimal place.
    misses:
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
      value: 100 divided by 9 units is about 11.11, which rounds to 11.1.
      syntax: "Check the brackets, commas and quote marks. ROUND follows the pattern `=ROUND(number, num_digits)`."
      reference: Point at the price and quantity cells for both totals, not at typed numbers.
    accept:
      - =ROUND(SUMPRODUCT(B2:B4,C2:C4)/SUM(C2:C4),1)
      - =round(sumproduct(b2:b4,c2:c4)/sum(c2:c4),1)
      - =ROUND(SUMPRODUCT($B$2:$B$4,$C$2:$C$4)/SUM($C$2:$C$4),1)
      - =ROUND(SUMPRODUCT(B$2:B$4,C$2:C$4)/SUM(C$2:C$4),1)
      - =ROUND( SUMPRODUCT(B2:B4, C2:C4) / SUM(C2:C4) , 1 )
      - =ROUND(SUMPRODUCT(B2:B4,C2:C4)/(C2+C3+C4),1)
    reject:
      - formula: =AVERAGE(B2:B4)
        rule: value
      - formula: =SUMPRODUCT(B2:B4,C2:C4)/SUM(C2:C4)
        rule: value
      - formula: =ROUND(SUMPRODUCT(B2:B4,C2:C4)/SUM(B2:B4),1)
        rule: value
      - formula: =ROUND(SUMPRODUCT(B3:B4,C3:C4)/SUM(C2:C4),1)
        rule: value
      - formula: =ROUND(SUMPRODUCT(B2:B4,C2:C4)/SUM(C2:C4),0)
        rule: value
      - formula: =ROUND(SUMPRODUCT(B2:B4,C2:C4)/SUM(C2:C4),1)/0
        rule: value
      - formula: =ROUND SUMPRODUCT(B2:B4,C2:C4)/SUM(C2:C4),1
        rule: syntax
notes:
  summary: SUMPRODUCT pairs two ranges cell by cell, multiplies each pair, then adds the products. Both ranges must be the same size.
  syntax: SUMPRODUCT(prices, quantities) multiplies the two ranges row by row and adds the products
  example: "`=SUMPRODUCT(A1:A2,B1:B2)` with 3 and 4 in A1:A2 and 5 and 6 in B1:B2 gives 39."
  commonErrors:
    - Ranges of different heights make SUMPRODUCT return #VALUE!.
    - A misspelt function name returns #NAME?.
    - A range that starts one row below the other pairs each price with the next quantity, and the total is wrong without any error.
