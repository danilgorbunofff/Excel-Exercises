screens:
  - prompt: In E2, how many lines have a stored Line value that differs from price times quantity?
    rows:
      - [Item, Price, Qty, Line, Total difference]
      - [Pens, 1.2, 40, 48, null]
      - [Pads, 3.5, 15, 52.5, null]
      - [Clips, 0.05, 500, 25, null]
      - [Tape, 2.1, 12, 21.2, null]
      - [Files, 4.75, 20, 95, null]
      - [Ink, 18.9, 6, 113.4, null]
      - [Glue, 1.85, 30, 55.5, null]
      - [Rulers, 0.9, 25, 22.5, null]
      - [Folders, 0.6, 100, 60, null]
      - [Labels, 5.4, 8, 43.2, null]
      - [Staples, 1.1, 18, 22.8, null]
      - [Markers, 7.25, 10, 72.5, null]
      - [Erasers, 0.35, 60, 21, null]
      - [Binders, 3.9, 14, 54.6, null]
      - [Notes, 2.6, 22, 57.2, null]
    answerCell: E2
    expected: 2
    variants:
      - set: { D3: 50.5 }
        expected: 3
      - set: { D12: 19.8 }
        expected: 1
    answer: =SUMPRODUCT(--(ROUND(D2:D16-B2:B16*C2:C16,2)<>0))
    requiredFunctions: []
    hints:
      nudge: Work out every line's difference at once and count the ones that are not 0.
      rule: Rounding each difference to the cent stops tiny decimal noise from counting as a mismatch. Then count the differences that are not 0.
    misses:
      value: 2 lines do not match price times quantity.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =SUMPRODUCT(--(ROUND(D2:D16-B2:B16*C2:C16,2)<>0))
      - =SUM(--(ROUND(D2:D16-B2:B16*C2:C16,2)<>0))
      - =SUMPRODUCT(--(ROUND(D2:D16,2)<>ROUND(B2:B16*C2:C16,2)))
      - =SUMPRODUCT((ROUND(D2:D16-B2:B16*C2:C16,2)<>0)*1)
    reject:
      - formula: =SUMPRODUCT(--(D2:D16>B2:B16*C2:C16))
        rule: value
      - formula: =SUMPRODUCT(D2:D16-B2:B16*C2:C16)
        rule: value
      - formula: =COUNTIF(D2:D16,"<>0")
        rule: value
      - formula: =2
        rule: reference
      - formula: =SUMPRODUCT(--(ROUND(D2:D16-B2:B16*C2:C16,2)<>0)
        rule: syntax
