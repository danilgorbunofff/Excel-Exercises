id: datedif-drill-2
slug: datedif-drill-2
level: 1
title: Months of service
updated: 2026-11-17
checkedInExcel: 2026-11-17
function: DATEDIF
screens:
  - prompt: In D2, use DATEDIF with "m" to count the full months from the start date in B2 to the date in C2.
    rows:
      - [Name, Started, On, Months]
      - [Bo, 45366, 46343, null]
    answerCell: D2
    expected: 32
    variants:
      - set: { C2: 46340 }
        expected: 31
    answer: =DATEDIF(B2,C2,"m")
    requiredFunctions:
      - DATEDIF
    hints:
      nudge: '"m" counts complete months.'
      rule: DATEDIF(start,end,"m") ignores a month that is not finished.
    misses:
      value: From 15 March 2024 to 17 November 2026 is 32 full months.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for DATEDIF.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =DATEDIF(B2,C2,"m")
      - =LET(v,B2,DATEDIF(v,C2,"m"))
    reject:
      - formula: =DATEDIF(B2,C2,"y")
        rule: value
      - formula: =32
        rule: required-function
      - formula: =DATEDIF(B2,C2,"m"
        rule: syntax
