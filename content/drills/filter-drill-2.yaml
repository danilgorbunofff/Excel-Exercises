            - North
            - 520
          - - Flo
            - West
            - 330
    answer: =FILTER(A2:C7,C2:C7>300)
    requiredFunctions:
      - FILTER
    hints:
      nudge: Return the whole table range to get every column.
      rule: FILTER(A2:C7,C2:C7>300) spills the matching rows, all three columns.
    misses:
      value: The rows over 300 are Ann East 400, Cy East 310, Di North 520, Flo West 330.
      syntax: Check the brackets, commas and quotes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =FILTER(A2:C7,C2:C7>300)
    reject:
