screens:
  - prompt: In F2, add up the expenses in the Travel category.
    rows:
      - [Date, Category, Amount, null, null, null]
      - ["1 Mar", Travel, 120, null, Travel, null]
      - ["2 Mar", Meals, 35, null, null, null]
      - ["4 Mar", Travel, 86, null, null, null]
      - ["5 Mar", Office, 42, null, null, null]
      - ["8 Mar", Meals, 28, null, null, null]
      - ["9 Mar", Travel, 240, null, null, null]
      - ["11 Mar", Office, 19, null, null, null]
      - ["12 Mar", Travel, 64, null, null, null]
    answerCell: F2
    expected: 510
    variants:
      - set: { B2: Meals }
        expected: 390
      - set: { C2: 164 }
        expected: 554
    answer: "=SUMIF(B2:B9,E2,C2:C9)"
    hints:
      nudge: Add the Amount only on rows where the category is Travel.
      rule: SUMIF(range to test, criteria, range to add). The two ranges must line up row by row.
    misses:
      value: The four Travel rows add up to 510.
      syntax: Check the brackets, commas and quotes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
      reference: Point at the cells, so the result follows the data when it changes.
    accept:
      - "=SUMIF(B2:B9,E2,C2:C9)"
      - "=sumif(b2:b9,e2,c2:c9)"
      - '=SUMIF(B2:B9,"Travel",C2:C9)'
      - "=SUMIF($B$2:$B$9,E2,$C$2:$C$9)"
    reject:
      - formula: =SUM(C2:C9)
        rule: value
      - formula: =SUMIF(B2:B9,E2,B2:B9)
        rule: value
      - formula: =SUMIF(B2:B9,E2,C2:C9
        rule: syntax
      - formula: =510
        rule: reference
