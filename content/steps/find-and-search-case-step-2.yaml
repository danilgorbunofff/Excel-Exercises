id: find-and-search-case-step-2
slug: find-and-search-case-step-2
level: 1
title: Find a letter in any case
updated: 2026-11-25
checkedInExcel: 2026-11-25
parent: find-and-search-case
step: 2
screens:
  - prompt: In B2, give the position of the first letter x in A2, upper or lower case. Use SEARCH.
    rows:
      - [Code, x at]
      - [MAX-Box-12, null]
    answerCell: B2
    expected: 3
    answer: =SEARCH("x",A2)
    requiredFunctions:
      - SEARCH
    hints:
      nudge: SEARCH ignores case; FIND does not.
      rule: SEARCH("x",A2) finds X or x, whichever comes first.
    misses:
      value: The first x is character 3.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for SEARCH.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =SEARCH("x",A2)
      - =SEARCH("X",A2)
    reject:
      - formula: =FIND("x",A2)
        rule: required-function
      - formula: =3
        rule: required-function
      - formula: =SEARCH("x",A2
        rule: syntax
