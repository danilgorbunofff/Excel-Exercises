id: abs-drill-3
slug: abs-drill-3
level: 1
title: Within a tolerance
updated: 2026-11-17
checkedInExcel: 2026-11-17
function: ABS
screens:
  - prompt: In E2, use ABS to test whether the measured size in C2 is within the tolerance in D2 of the target in B2.
    rows:
      - [Part, Target, Measured, Tolerance, OK]
      - [P1, 50, 49.6, 0.5, null]
    answerCell: E2
    expected: true
    variants:
      - set: { C2: 50.6 }
        expected: false
      - set: { C2: 49.5 }
        expected: true
      - set: { C2: 49.4 }
        expected: false
    answer: =ABS(C2-B2)<=D2
    requiredFunctions:
      - ABS
    hints:
      nudge: Take the gap with ABS, then compare it with the tolerance.
      rule: ABS(measured-target)<=tolerance is TRUE when the part is close enough either way.
    misses:
      value: 49.6 is 0.4 away from 50, inside the 0.5 tolerance, so the result is TRUE.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for ABS.
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
    accept:
      - =ABS(C2-B2)<=D2
      - =ABS(B2-C2)<=D2
    reject:
      - formula: =C2-B2<=D2
        rule: required-function
      - formula: =ABS(C2-B2)<D2
        rule: fragile
      - formula: =ABS(C2-B2)<=D2,
        rule: syntax
