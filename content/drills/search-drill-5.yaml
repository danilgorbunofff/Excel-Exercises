id: search-drill-5
slug: search-drill-5
level: 2
title: Flag urgent notes
updated: 2026-11-17
checkedInExcel: 2026-11-17
function: SEARCH
screens:
  - prompt: In B2, use IF, ISNUMBER and SEARCH to show "Yes" when the note in A2 contains "urgent" in any case, and "No" otherwise.
    rows:
      - [Note, Result]
      - ["Call back, URGENT please", null]
    answerCell: B2
    expected: Yes
    variants:
      - set: { A2: Call back later }
        expected: No
    answer: =IF(ISNUMBER(SEARCH("urgent",A2)),"Yes","No")
    requiredFunctions:
      - SEARCH
      - ISNUMBER
      - IF
    hints:
      nudge: SEARCH finds the word in any case; ISNUMBER says whether it did.
      rule: SEARCH returns a number when it finds the word and an error when it does not. ISNUMBER turns that into TRUE or FALSE, and IF turns that into Yes or No.
    misses:
      value: The note contains URGENT, so the result is Yes.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for SEARCH, ISNUMBER and IF.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =IF(ISNUMBER(SEARCH("urgent",A2)),"Yes","No")
      - =LET(v,A2,IF(ISNUMBER(SEARCH("urgent",v)),"Yes","No"))
    reject:
      - formula: =IF(ISNUMBER(FIND("urgent",A2)),"Yes","No")
        rule: required-function
      - formula: =IF(ISNUMBER(SEARCH("urgent",A2)),"No","Yes")
        rule: value
      - formula: ="Yes"
        rule: required-function
      - formula: =IF(ISNUMBER(SEARCH("urgent",A2)),"Yes","No"
        rule: syntax
