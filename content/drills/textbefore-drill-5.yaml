id: textbefore-drill-5
slug: textbefore-drill-5
level: 2
title: First name in capitals
updated: 2026-11-17
checkedInExcel: 2026-11-17
function: TEXTBEFORE
screens:
  - prompt: In B2, use UPPER and TEXTBEFORE to take the first name from A2, before the space, in capitals.
    rows:
      - [Name, Result]
      - [Rosa Diaz, null]
    answerCell: B2
    expected: ROSA
    variants:
      - set: { A2: al brook }
        expected: AL
    answer: =UPPER(TEXTBEFORE(A2," "))
    requiredFunctions:
      - TEXTBEFORE
      - UPPER
    hints:
      nudge: Take the first name, then wrap it in UPPER.
      rule: UPPER(TEXTBEFORE(A2," ")) gives the first name in capitals.
    misses:
      value: The first name in capitals is ROSA.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for TEXTBEFORE and UPPER.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =UPPER(TEXTBEFORE(A2," "))
    reject:
      - formula: =TEXTBEFORE(A2," ")
        rule: required-function
      - formula: =UPPER(TEXTAFTER(A2," "))
        rule: required-function
      - formula: =UPPER(TEXTBEFORE(A2,"a"))
        rule: value
      - formula: ="ROSA"
        rule: required-function
      - formula: =UPPER(TEXTBEFORE(A2," ")
        rule: syntax
