      - formula: =FILTER(A2:A19,(B2:B19="North")*(D2:D19>=800)
        rule: syntax
notes:
  summary: FILTER returns every row of a range that passes a test. The result spills down from the formula's cell and resizes when the data changes.
  syntax: "FILTER(array, include, [if_empty])"
  example: '`=FILTER(C2:C19,B2:B19="North")` lists the reps of every North order.'
  commonErrors:
    - '`#CALC!` means nothing passed the test. Give FILTER a third argument, such as "none", to show instead.'
    - "`#SPILL!` means a cell in the way holds data. Clear the cells below and to the right."
    - A test with a different number of rows from the array gives `#VALUE!`.
