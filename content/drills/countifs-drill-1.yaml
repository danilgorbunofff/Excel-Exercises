id: countifs-drill-1
slug: countifs-drill-1
level: 1
title: Count East orders that are paid
updated: 2026-11-17
checkedInExcel: 2026-11-17
function: COUNTIFS
screens:
  - prompt: In B9, use COUNTIFS to count the rows where the region in A2:A8 is "East" and the status in B2:B8 is "Paid".
    rows:
      - [Region, Status]
      - [East, Paid]
      - [West, Paid]
      - [East, Open]
      - [East, Paid]
      - [North, Paid]
      - [East, Late]
      - [West, Open]
      - [East paid, null]
    answerCell: B9
    expected: 2
    variants:
      - set: { B4: Paid }
        expected: 3
    answer: =COUNTIFS(A2:A8,"East",B2:B8,"Paid")
    requiredFunctions:
      - COUNTIFS
    hints:
      nudge: "COUNTIFS takes pairs: a range, then what it must match."
      rule: COUNTIFS(range1,criteria1,range2,criteria2) counts rows that meet every pair.
    misses:
      value: 2 rows are both East and Paid.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for COUNTIFS.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =COUNTIFS(A2:A8,"East",B2:B8,"Paid")
      - =COUNTIFS(B2:B8,"Paid",A2:A8,"East")
    reject:
      - formula: =COUNTIFS(A2:A8,"East")
        rule: value
      - formula: =COUNTIF(B2:B8,"Paid")
        rule: required-function
      - formula: =2
        rule: required-function
      - formula: =COUNTIFS(A2:A8,"East",B2:B8,"Paid"
        rule: syntax
