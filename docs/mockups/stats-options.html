<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stat tile options</title>
<style>
  @font-face { font-family: Inter; font-weight: 400; src: url(../../public/fonts/inter-latin-400-normal.woff2); }
  @font-face { font-family: Inter; font-weight: 600; src: url(../../public/fonts/inter-latin-600-normal.woff2); }
  @font-face { font-family: Inter; font-weight: 700; src: url(../../public/fonts/inter-latin-700-normal.woff2); }
  /* Light values from src/styles/tokens.css, inline because the preview pane cannot load linked files. */
  :root { --bg: #f9fafb; --surface: #fff; --header: #f3f4f6; --text: #101828; --heading: #1e1e1e; --muted: #4a5565; --faint: #6a7282; --rule: #e5e7eb; --green: #18804f; --tint: #e9f9ef;
    --warm: #894b00; --warm-bg: #fef9c2; --warm-fill: #e0a800; --due: #0063b1; --due-bg: #e3f0fd; --miss: #b42318; --chip: #126a41; --chip-bg: #ecfdf3; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--text); font: 1rem/1.5 Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  h1, main { max-width: 74rem; margin: 0 auto; }
  h1 { margin-bottom: 2rem; font-size: 1.125rem; }
  section + section { margin-top: 3rem; }
  .tag { margin: 0 0 0.75rem; font-size: 0.875rem; font-weight: 600; color: var(--green); }
  /* The Home overview card: heat map left, the option right, one height. */
  .overview { display: grid; grid-template-columns: minmax(0, 1fr) 20rem; overflow: hidden; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); box-shadow: 0 1px 3px rgb(16 24 40 / 0.08); }
  .heat { display: flex; flex-direction: column; justify-content: center; gap: 1rem; min-width: 0; padding: 1.5rem; }
  .heat div:first-child { display: flex; justify-content: space-between; font-size: 0.875rem; color: var(--faint); }
  .heat b { font-size: 1.125rem; color: var(--heading); }
  .cells { display: grid; grid-template: repeat(7, 1fr) / repeat(26, 1fr); grid-auto-flow: column; gap: 3px; }
  .cells i { aspect-ratio: 1; border-radius: 2px; background: var(--header); }
  .cells i.on { background: var(--green); }
  .opt { min-width: 0; border-left: 1px solid var(--rule); display: flex; flex-direction: column; }

  .chip { display: grid; place-items: center; flex: none; width: 2.25rem; height: 2.25rem; border-radius: 50%; }
  .chip svg { width: 1.125rem; height: 1.125rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .solved { --c: var(--green); --cb: var(--tint); --fill: var(--green); }
  .streak { --c: var(--warm); --cb: var(--warm-bg); --fill: var(--warm-fill); }
  .due { --c: var(--due); --cb: var(--due-bg); --fill: var(--due); }
  .own { --c: var(--chip); --cb: var(--chip-bg); --fill: var(--green); }
  .chip { background: var(--cb); color: var(--c); }
  /* Shared type scale; labels never wrap in the 20rem column. */
  .n { font-size: 2rem; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; color: var(--heading); white-space: nowrap; }
  .u { margin-left: 0.25rem; font-size: 0.8125rem; font-weight: 400; letter-spacing: 0; color: var(--faint); }
  .name { font-size: 0.8125rem; font-weight: 600; line-height: 1.4; white-space: nowrap; }
  .note { font-size: 0.75rem; line-height: 1.4; color: var(--faint); white-space: nowrap; }
  .track { display: block; width: 100%; max-width: 6.5rem; height: 0.375rem; margin-top: 0.5rem; border-radius: 999px; background: var(--header); overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: inherit; background: var(--fill); }
  /* One centred stack, used by the tiles of A, C and D. */
  .stack { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; text-align: center; }

  /* A: four equal tiles */
  .a { flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 1fr; }
  .a > div { padding: 1rem; }
  .a > div:nth-child(odd) { border-right: 1px solid var(--rule); }
  .a > div:nth-child(n + 3) { border-top: 1px solid var(--rule); }
  .a .chip { margin-bottom: 0.5rem; }

  /* B: rows with equal side margins; every number ends on one line */
  .b { flex: 1; display: grid; grid-auto-rows: 1fr; padding: 0.25rem 1.25rem; }
  .b > div { display: grid; grid-template-columns: 2.25rem minmax(0, 1fr) auto; align-items: center; gap: 0.875rem; min-height: 4.25rem; }
  .b > div + div { border-top: 1px solid var(--rule); }
  .b .name, .b .note { display: block; }
  .b .name { font-size: 0.875rem; }
  .b .n { font-size: 1.75rem; text-align: right; }

  /* C: solved leads, three equal tiles under it */
  .lead { flex: 1; justify-content: center; gap: 1.5rem; display: flex; align-items: center; padding: 1.25rem; background: var(--tint); }
  .lead > div { display: flex; flex-direction: column; }
  .lead .n { font-size: 2.25rem; }
  .ring { display: grid; place-items: center; flex: none; width: 5.5rem; aspect-ratio: 1; border-radius: 50%; background: conic-gradient(var(--fill) calc(var(--p) * 1%), var(--ring, var(--header)) 0); }
  .ring > span { display: grid; place-items: center; width: calc(100% - 1.125rem); aspect-ratio: 1; border-radius: 50%; background: var(--hole, var(--surface)); font-weight: 700; }
  .lead .ring { --ring: #fff; --hole: var(--tint); font-size: 1.125rem; }
  .three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--rule); }
  .three > div { padding: 1.125rem 0; }
  .three > div + div { border-left: 1px solid var(--rule); }
  .three .chip { margin-bottom: 0.5rem; }

  /* D: four equal tinted tiles, a ring around each number */
  .d { flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 0.75rem; padding: 0.75rem; }
  .d > div { padding: 0.875rem 0.5rem; border-radius: 8px; background: var(--cb); }
  .d .ring { width: 4.5rem; margin-bottom: 0.5rem; --ring: #fff; --hole: var(--cb); font-size: 1.375rem; color: var(--heading); }
  .d .note { color: var(--muted); }

  @media (max-width: 48rem) { .overview { grid-template-columns: minmax(0, 1fr); } .opt { border-left: 0; border-top: 1px solid var(--rule); } }
  @media (max-width: 30rem) { .cells { gap: 1px; } }
</style>

<h1>Your numbers: 4 options, each beside "Days you practised"</h1>
<main></main>

<script>
  const icons = {
    solved: "M5 12l4 4 10-10",
    streak: "M13 3L5 14h6l-1 7 8-11h-6z",
    due: "M4 4v6h6M20 12a8 8 0 0 1-14.9 4M4.1 10A8 8 0 0 1 20 12",
    own: "M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 4-6 8-6s8 2 8 6",
  };
  // key, name, number, unit, note, share shown by the bar or ring (%)
  const stats = [
    ["solved", "Solved", 24, "of 128", "21 this week", 19],
    ["streak", "Day streak", 11, "days", "Best: 11 days", 100],
    ["due", "Due for review", 29, "", "4 never solved", 14],
    ["own", "On your own", 22, "", "2 with help", 92],
  ].map(([key, name, n, unit, note, p]) => ({ key, name, n, unit, note, p }));

  const chip = (s) => `<span class="chip" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="${icons[s.key]}"/></svg></span>`;
  const num = (s) => `<span class="n">${s.n}${s.unit ? `<span class="u">${s.unit}</span>` : ""}</span>`;
  const bar = (s) => `<span class="track" aria-hidden="true"><i style="width:${s.p}%"></i></span>`;
  const ring = (s, inside) => `<span class="ring" style="--p:${s.p}"><span>${inside}</span></span>`;

  const label = (s) => `<span class="name">${s.name}</span><span class="note">${s.note}</span>`;
  // Where the number stands alone, "of 128" moves into the name.
  const full = (s) => (s.key === "solved" ? { ...s, name: "Solved of 128" } : s);

  const options = {
    "A. Icon tiles with bars": () => `<div class="a">${stats.map((s) => `<div class="stack ${s.key}">${chip(s)}${num(s)}${label(s)}${bar(s)}</div>`).join("")}</div>`,
    "B. Rows, like the scoreboard": () => `<div class="b">${stats.map((s) => `<div class="${s.key}">${chip(s)}<span>${label(full(s))}</span>${num({ ...s, unit: "" })}</div>`).join("")}</div>`,
    "C. Solved first": () => {
      const [first, ...rest] = stats;
      return `<div class="lead ${first.key}">${ring(first, `${first.p}%`)}<div><span class="name">${first.name}</span>${num(first)}<span class="note">${first.note}</span></div></div>
        <div class="three">${rest.map((s) => `<div class="stack ${s.key}">${chip(s)}${num({ ...s, unit: "" })}${label(s)}</div>`).join("")}</div>`;
    },
    "D. Rings": () => `<div class="d">${stats.map((s) => `<div class="stack ${s.key}">${ring(s, s.n)}${label(full(s))}</div>`).join("")}</div>`,
  };

  const cells = Array.from({ length: 182 }, (_, i) => `<i class="${i > 166 && i < 178 ? "on" : ""}"></i>`).join("");
  const heat = `<div class="heat"><div><b>Days you practised</b><span>Last 6 months</span></div><span class="cells" aria-hidden="true">${cells}</span></div>`;
  document.querySelector("main").innerHTML = Object.entries(options)
    .map(([title, draw]) => `<section><p class="tag">${title}</p><div class="overview">${heat}<div class="opt">${draw()}</div></div></section>`).join("");
</script>
</html>
