title: Rows where the margin cannot be worked out
updated: 2026-11-25
checkedInExcel: 2026-11-25
parent: error-handling-summary
step: 5
screens:
  - prompt: In E2, on how many rows can the margin, (price minus cost) divided by price, not be worked out because the price is missing, 0 or not a number?
    rows:
      - [Item, Price, Cost, null, No margin]
      - [Pens, 2.5, 1.2, null, null]
      - [Pads, 0, 1.8, null, null]
      - [Clips, 0.4, 0.1, null, null]
      - [Tape, tbc, 1.1, null, null]
      - [Glue, 3.2, 1.9, null, null]
      - [Files, null, 2.2, null, null]
      - [Ink, 18, 9.5, null, null]
      - [Rulers, 1.5, 0.6, null, null]
      - [Labels, 0, 2, null, null]
      - [Staples, 2.2, 0.9, null, null]
      - [Markers, 4.5, 2.1, null, null]
      - [Erasers, free, 0.2, null, null]
      - [Binders, 6, 3.3, null, null]
      - [Folders, 1.1, 0.4, null, null]
      - [Notes, 3, 1.4, null, null]
    answerCell: E2
    expected: 5
    variants:
      - set: { B3: 2 }
        expected: 4
      - set: { B9: n/a }
        expected: 6
    answer: =SUMPRODUCT(--ISERROR((B2:B16-C2:C16)/B2:B16))
    requiredFunctions: []
    hints:
      nudge: Try the margin on every row at once and count the errors.
      rule: "Dividing by a price of 0 or a blank gives `#DIV/0!`, and by text gives `#VALUE!`; ISERROR catches both and SUMPRODUCT counts them."
    misses:
      value: The margin cannot be worked out on 5 rows.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =SUMPRODUCT(--ISERROR((B2:B16-C2:C16)/B2:B16))
      - =SUM(--ISERROR((B2:B16-C2:C16)/B2:B16))
    reject:
      - formula: =COUNTIF(B2:B16,0)
        rule: value
      - formula: =COUNTBLANK(B2:B16)+COUNTIF(B2:B16,0)
        rule: value
      - formula: =5
        rule: reference
      - formula: =SUMPRODUCT(--ISERROR((B2:B16-C2:C16)/B2:B16)
        rule: syntax
