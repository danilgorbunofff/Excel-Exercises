notes:
  summary: SORT orders the rows of a range by one of its columns; SORTBY orders them by a separate range. TAKE keeps the first or last rows, and CHOOSECOLS keeps chosen columns.
  syntax: "SORT(array, [sort_index], [sort_order], [by_col])"
  example: "`=TAKE(SORT(A2:D19,4,-1),3)` returns the three rows with the largest amounts."
  commonErrors:
    - The sort column counts from the left of the array given to SORT, not from column A.
    - 1 sorts smallest first and -1 largest first.
    - Sorting only one column of a table breaks the link with the other columns.
