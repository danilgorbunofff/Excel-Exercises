step: 1
screens:
  - prompt: In E2, return the first price logged for the SKU in E1, searching from the top. Use XLOOKUP.
    rows:
      - [SKU, Price, null, SKU, TX-101]
      - [TX-101, 19.99, null, First price, null]
      - [TX-102, 14, null, null, null]
      - [TX-101, 21.5, null, null, null]
      - [TX-103, 9.5, null, null, null]
      - [TX-102, 16.25, null, null, null]
    answerCell: E2
    expected: 19.99
    variants:
      - set: { E1: TX-102 }
        expected: 14
    answer: =XLOOKUP(E1,A2:A6,B2:B6)
    requiredFunctions:
      - XLOOKUP
    hints:
      nudge: By default XLOOKUP searches from the top and stops at the first match.
      rule: XLOOKUP(E1,A2:A6,B2:B6) returns the price on the first row with that SKU.
    misses:
      value: The first price logged for TX-101 is 19.99.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for XLOOKUP.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =XLOOKUP(E1,A2:A6,B2:B6)
      - =XLOOKUP(E1,A2:A6,B2:B6,,0,1)
    reject:
      - formula: =XLOOKUP(E1,A2:A6,B2:B6,,0,-1)
        rule: value
      - formula: =19.99
        rule: required-function
      - formula: =XLOOKUP(E1,A2:A6,B2:B6
        rule: syntax
