screens:
  - prompt: In B9, show PASS when the total in B8 is over 100 and no item is under 15 units. Otherwise show FAIL.
    rows:
      - [Item, Units]
      - [Bolt, 18]
      - [Nut, 22]
      - [Washer, 25]
      - [Screw, 30]
      - [Clip, 24]
      - [Pin, 31]
      - [Total, 150]
      - [Verdict, null]
    answerCell: B9
    expected: PASS
    variants:
      - { set: { B2: 13 }, expected: FAIL }
      - { set: { B8: 100 }, expected: FAIL }
      - { set: { B7: 14 }, expected: FAIL }
      - { set: { B8: 101, B2: 15 }, expected: PASS }
    answer: =IF(AND(B8>100,MIN(B2:B7)>=15),"PASS","FAIL")
    hints:
      nudge: Combine the two tests first, then let an IF turn the answer into a word.
      rule: AND returns TRUE only when every test holds. IF then shows one text result for TRUE and another for FALSE, with text in double quotes.
    misses:
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
      value: The total of 150 is over 100 and the lowest count, 18, is at least 15, so B9 shows PASS.
      syntax: 'Both tests go inside AND, and AND goes inside IF: `=IF(AND(test1,test2),"PASS","FAIL")`.'
      reference: Read the total from B8 and the units from B2:B7.
    accept:
      - =IF(AND(B8>100,MIN(B2:B7)>=15),"PASS","FAIL")
      - =if(and(b8>100,min(b2:b7)>=15),"PASS","FAIL")
      - =IF(AND($B$8>100,MIN($B$2:$B$7)>=15),"PASS","FAIL")
      - =IF(AND(B$8>100,MIN(B$2:B$7)>=15),"PASS","FAIL")
      - =IF(AND($B8>100,MIN($B2:$B$7)>=15),"PASS","FAIL")
      - =IF(AND(B8>100,MIN(B2:B7)>14),"PASS","FAIL")
    reject:
      - formula: =AND(B8>100,MIN(B2:B7)>=15)
        rule: value
      - formula: =IF(B8>100,"FAIL","PASS")
        rule: value
      - formula: =IF(AND(B8>100,MIN(B2:B7)>=20),"PASS","FAIL")
        rule: value
      - formula: =IF(AND(B8>100,MIN(B2:B7)>=15),"PASS","FAIL")/0
        rule: value
      - formula: =IF(AND(B8>100 MIN(B2:B7)>=15),"PASS","FAIL")
        rule: syntax
  - prompt: In D9, average the prices in C2:C7 and round to 1 decimal place. Show none when there is nothing to average.
    rows:
      - [Item, Units, Price, Answer]
      - [Bolt, 18, 4.5, null]
      - [Nut, 22, 3.9, null]
      - [Washer, 25, 4.2, null]
      - [Screw, 30, 5.1, null]
      - [Clip, 24, 3.4, null]
      - [Pin, 31, 4.8, null]
      - [Total, 150, null, null]
      - [Average price, null, null, null]
    answerCell: D9
    expected: 4.3
    variants:
      - set: { C2: 6.17 }
        expected: 4.6
    answer: =IF(ISNUMBER(AVERAGE(C2:C7)),ROUND(AVERAGE(C2:C7),1),"none")
    hints:
      nudge: Check that the average is a number before you round it, and show none otherwise.
      rule: ISNUMBER returns TRUE for a number and FALSE for an error, so it can guard an IF. ROUND takes a number and the count of decimals to keep.
    misses:
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
      value: The six prices total 25.9, an average of 4.3167, which rounds to 4.3.
      syntax: "Check the brackets, commas and quote marks. IF follows the pattern `=IF(logical_test, value_if_true, [value_if_false])`."
      reference: Average C2:C7, the price column.
    accept:
      - =IF(ISNUMBER(AVERAGE(C2:C7)),ROUND(AVERAGE(C2:C7),1),"none")
      - =if(isnumber(average(c2:c7)),round(average(c2:c7),1),"none")
      - =IF(ISNUMBER(AVERAGE($C$2:$C$7)),ROUND(AVERAGE($C$2:$C$7),1),"none")
      - =IF(ISNUMBER(AVERAGE(C$2:C$7)),ROUND(AVERAGE(C$2:C$7),1),"none")
      - =IF(ISNUMBER(AVERAGE(C2:C7)),ROUND(AVERAGE(C2:C7),1),"none")+0
      - =IF(ISNUMBER(AVERAGE(C2:C7)),ROUND(AVERAGE(C2:C7),1),"none")*1
    reject:
      - formula: =ROUND(AVERAGE(C2:C7),2)
        rule: value
      - formula: =IF(ROUND(AVERAGE(C2:C7),1)>10,ROUND(AVERAGE(C2:C7),1),"none")
        rule: value
      - formula: =IF(ISNUMBER(AVERAGE(C2:C7)),AVERAGE(C2:C7),"none")
        rule: value
      - formula: =IF(ISNUMBER(AVERAGE(C2:C7)),ROUND(AVERAGE(C2:C7),2),"none")
        rule: value
      - formula: =IF(ISNUMBER(AVERAGE(C2:C7)),ROUND(AVERAGE(C2:C7),1),"none")/0
        rule: value
      - formula: =IF(ISNUMBER(AVERAGE(C2:C7)) ROUND(AVERAGE(C2:C7),1),"none")
        rule: syntax
notes:
  summary: IF turns a logical test into a result you choose, and the test can be built from AND, OR or an IS function. Nesting them lets one cell check several things and answer in words.
  syntax: IF(AND(test 1, test 2),"PASS","FAIL"); =IF(ISNUMBER(AVERAGE(range)),ROUND(...,1),"none")
  example: '`=IF(AND(A1>0,A2>0),"Yes","No")` with 4 and 0 gives No.'
  commonErrors:
    - "Arithmetic on the text result, such as PASS divided by zero, returns `#VALUE!`."
    - "When C2:C7 holds no numbers, AVERAGE returns `#DIV/0!`."
    - "A mistyped function name anywhere in the formula returns `#NAME?`."
