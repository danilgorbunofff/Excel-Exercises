    answer: '=LET(north,SUMIF(B2:B19,"North",D2:D19),total,SUM(D2:D19),ROUND(north/total*100,1))'
    hints:
      nudge: Work out two totals and give each a name, then use the names to make the percentage.
      rule: LET(name1, value1, name2, value2, result) works out each value once and lets the last argument use the names. SUMIF ignores case, so north rows count.
    misses:
      value: North sales are 4,540 of 14,120 in all, which is 32.2 per cent.
      syntax: "LET takes pairs of name and value, then the result: `=LET(a,1,b,2,a+b)`."
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
    accept:
