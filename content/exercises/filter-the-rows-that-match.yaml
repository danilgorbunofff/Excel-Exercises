    answer: '=FILTER(C2:C19,B2:B19="North")'
    hints:
      nudge: Keep the Rep cells whose Region is North. The list should grow and shrink with the data.
      rule: FILTER takes the cells to return and a test with one result per row. Rows where the test is TRUE spill down from the formula's cell. Text compares without case, so north counts as North.
