step: 1
screens:
  - prompt: In B2, remove the stray spaces from the imported code in A2. Use TRIM.
    rows:
      - [Imported code, Clean]
      - ["  PX-104 ", null]
    answerCell: B2
    expected: PX-104
    variants:
      - set: { A2: " PX-210" }
        expected: PX-210
    answer: =TRIM(A2)
    requiredFunctions:
      - TRIM
    hints:
      nudge: TRIM removes the spaces at both ends.
      rule: TRIM removes the spaces at both ends of the text.
    misses:
      value: The clean code is PX-104.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for TRIM.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =TRIM(A2)
      - =trim(a2)
      - "=TRIM(TRIM(A2))"
      - '=TRIM(A2)&""'
    reject:
      - formula: =UPPER(A2)
        rule: required-function
      - formula: ="PX-104"
        rule: required-function
      - formula: =TRIM(A2
        rule: syntax
