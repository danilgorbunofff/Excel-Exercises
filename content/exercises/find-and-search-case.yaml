      - =SEARCH("N",$A$2)
      - =SEARCH("N",A$2)
      - =SEARCH( "N" , A2 )
      - =SEARCH("n",A2)
      - =SEARCH("N",A2)+0
    reject:
      - { formula: '=FIND("N",A2)', rule: required-function }
      - { formula: =LEN(A2), rule: required-function }
      - { formula: '=SEARCH("a",A2)', rule: value }
      - { formula: '=SEARCH("N",$A$2,4)', rule: value }
      - { formula: '=SEARCH("n",A4)', rule: value }
      - { formula: '=SEARCH("N",A2,4)', rule: value }
      - { formula: '=SEARCH("z",A2)', rule: value }
      - { formula: '=SEARCH("N","banana grove")', rule: reference }
      - { formula: '=SEARCH "N",A2', rule: syntax }
    variants:
      - { set: { A2: lemon crate }, expected: 5 }
notes:
  summary: FIND and SEARCH return the position where one piece of text starts inside another, counting from 1. FIND matches case exactly and SEARCH ignores case.
  syntax: FIND(needle,text) matches case; =SEARCH(needle,text) ignores it; both answer a position
  example: '`=SEARCH("D","data")` gives 1, while `=FIND("D","data")` gives `#VALUE!` because FIND matches case.'
  commonErrors:
    - "The text you are looking for is not in the cell, and FIND returns `#VALUE!` instead of returning 0."
    - SEARCH returns 3 for the hyphen as well, but this screen is graded on FIND, so the answer does not pass.
