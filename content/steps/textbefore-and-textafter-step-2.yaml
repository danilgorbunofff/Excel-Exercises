    answerCell: B2
    expected: engines.co.uk
    variants:
      - set: { A2: grace@navy.mil }
        expected: navy.mil
    answer: =TEXTAFTER(A2,"@")
    requiredFunctions:
      - TEXTAFTER
    hints:
      nudge: TEXTAFTER returns what comes after the delimiter.
      rule: TEXTAFTER takes the text and a delimiter, and returns everything after it.
    misses:
      value: The domain is engines.co.uk.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for TEXTAFTER.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =TEXTAFTER(A2,"@")
      - =TEXTAFTER(A2,"@",1)
    reject:
      - formula: =TEXTBEFORE(A2,"@")
        rule: required-function
      - formula: ="engines.co.uk"
        rule: required-function
