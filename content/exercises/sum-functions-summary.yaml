id: sum-functions-summary
slug: sum-functions-summary
level: 2
title: Sum functions summary
topic: conditions
updated: 2026-11-17
checkedInExcel: 2026-11-17
screens:
  - prompt: In B7, total everything sold. Use SUM.
    rows:
      - [Region, Amount]
      - [North, 320]
      - [South, 250]
      - [North, 180]
      - [West, 300]
      - [North, 400]
      - [Everything, null]
    answerCell: B7
    expected: 1450
    variants:
      - set: { B2: 438 }
        expected: 1568
    answer: =SUM(B2:B6)
    requiredFunctions: [SUM]
    hints:
      nudge: One function adds the whole amount column.
      rule: SUM adds every number in a range and skips text and empty cells. Point it at the column rather than typing the numbers.
    misses:
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
      value: 320 + 250 + 180 + 300 + 400 is 1450.
      syntax: "Check the brackets, commas and quote marks. SUM follows the pattern `=SUM(number1, [number2], ...)`."
      required-function: Add the column with one SUM rather than a chain of + signs.
      reference: Point at the amount column rather than typing the five numbers.
    accept:
      - =SUM(B2:B6)
      - =sum(b2:b6)
      - =SUM($B$2:$B$6)
      - =SUM(B2:B6)+0
      - =SUM(B2:B6)*1
      - =SUM(B$2:B$6)
    reject:
      - { formula: =SUM(B2:B5), rule: value }
      - { formula: =B2+B3+B4+B5+B6, rule: required-function }
      - { formula: =SUM(B3:B6), rule: value }
      - { formula: =SUM(B2:B6)/0, rule: value }
      - { formula: =SUM(B2:B6, rule: syntax }
      - { formula: =SUM(C2:C6), rule: value }
  - prompt: In C7, total every row that is not North. Subtract a SUMIF from a SUM.
    rows:
      - [Region, Rep, Amount]
      - [North, Ada, 320]
      - [South, Ben, 250]
      - [North, Cleo, 180]
      - [West, Dev, 300]
      - [North, Ada, 400]
      - [Outside North, null, null]
    answerCell: C7
    expected: 550
    variants:
      - set: { C3: 343 }
        expected: 643
      - set: { A2: "South" }
        expected: 870
    answer: =SUM(C2:C6)-SUMIF(A2:A6,"North",C2:C6)
    requiredFunctions: [SUM, SUMIF]
    hints:
      nudge: Take the total of every row, then subtract the total of the North rows.
      rule: SUM gives the whole column and SUMIF gives the rows that meet one condition. Subtracting one from the other leaves the rows that do not match.
    misses:
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
      value: 1450 in total minus 900 of North sales leaves 550.
      syntax: "Check the brackets, commas and quote marks. SUM follows the pattern `=SUM(number1, [number2], ...)`."
      required-function: "Use both functions: SUM for the whole column, minus SUMIF for the North rows."
      reference: Read both the regions and the amounts from the grid.
    accept:
      - =SUM(C2:C6)-SUMIF(A2:A6,"North",C2:C6)
      - =sum(c2:c6)-sumif(a2:a6,"north",c2:c6)
      - =SUM($C$2:$C$6)-SUMIF($A$2:$A$6,"North",$C$2:$C$6)
      - =SUM(C2:C6)-SUMIF(A2:A6,"North",C2:C6)+0
      - =SUM(C2:C6)-SUMIF(A2:A6,"North",C2:C6)*1
      - =SUM(C$2:C$6)-SUMIF(A$2:A$6,"North",C$2:C$6)
    reject:
      - { formula: '=SUMIF(A2:A6,"North",C2:C6)', rule: required-function }
      - { formula: =SUM(C2:C6), rule: required-function }
      - { formula: '=SUM(C2:C6)-SUMIF(A2:A6,"South",C2:C6)', rule: value }
      - { formula: '=SUM(C2:C6)+SUMIF(A2:A6,"North",C2:C6)', rule: value }
      - { formula: '=SUM(C2:C6)-SUMIF(A2:A6,"North",C2:C6)/0', rule: value }
      - { formula: '=SUM(C2:C6)-SUMIF(A2:A6 "North",C2:C6)', rule: syntax }
notes:
  summary: SUM adds a whole range, SUMIF adds the rows that meet one condition, and SUMIFS adds the rows that meet several. Subtracting a SUMIF from a SUM gives what is left over.
  syntax: SUM(range) and =SUMIF(criteria_range, condition, sum_range), combined by subtraction
  example: '`=SUM(B1:B3)-SUMIF(A1:A3,"North",B1:B3)` with North 10, South 20 and North 5 gives 20.'
  commonErrors:
    - Text criteria need quotes. North without them returns #NAME?.
    - SUMIFS takes the sum range first and SUMIF takes it last, so SUMIF's argument order does not work in SUMIFS.
    - If the sum range starts one row below the criteria range, SUMIF adds the amount from the row under each match.
