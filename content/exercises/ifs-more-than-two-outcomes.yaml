notes:
  summary: IFS takes pairs of test and result and returns the result of the first test that is TRUE. A final pair whose test is TRUE acts as the fallback.
  syntax: IFS(test1, result1, test2, result2, ..., TRUE, fallback)
  example: '`=IFS(A1>=90,"A",A1>=80,"B",TRUE,"C")` with 85 in A1 gives B.'
  commonErrors:
    - No test is TRUE and there is no TRUE fallback pair, so IFS returns `#N/A`.
    - A test has no result of its own, and Excel refuses the formula for having too few arguments.
    - The version of Excel in use has no IFS, or the name is mistyped, so the cell shows `#NAME?`.
