      - [DE-4471, North, 60, null]
    answerCell: D2
    expected: 3
    answer: =COUNTIF(B2:B5,"Nor*")
    requiredFunctions: [COUNTIF]
    hints:
      nudge: A star in the criterion matches any run of characters after the letters you type.
      rule: COUNTIF takes a range and a criterion in quotes. In the criterion, * stands for any run of characters and ? for exactly one.
    misses:
      value: "Three regions start with Nor: rows 2, 4 and 5."
      syntax: "Check the brackets, commas and quote marks. COUNTIF follows the pattern `=COUNTIF(range, criteria)`."
