screens:
  - prompt: In D3, repair the ratio for the rep with no visits so it reads n/a instead of an error.
    rows:
      - [Rep, Visits, Orders, Ratio]
      - [Ana, 10, 4, null]
      - [Bo, 0, 0, null]
      - [Cy, 8, 6, null]
      - [Di, 5, 0, null]
    answerCell: D3
    expected: n/a
    variants:
      - { set: { B3: 3 }, expected: 0 }
      - { set: { B3: 5, C3: 4 }, expected: 0.8 }
    answer: =IF(B3=0,"n/a",C3/B3)
    hints:
      nudge: Test the visits before dividing, since dividing by zero gives an error.
      rule: IF can check the denominator first and return a word when it is zero. The division then runs only when there is something to divide by.
    misses:
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
      value: With no visits the answer is the word n/a, not a number.
      syntax: "Check the brackets, commas and quote marks. IF follows the pattern `=IF(logical_test, value_if_true, [value_if_false])`."
      reference: The visits figure for that rep is in B3.
    accept:
      - =IF(B3=0,"n/a",C3/B3)
      - =if(b3=0,"n/a",c3/b3)
      - =IF($B$3=0,"n/a",$C$3/$B$3)
      - =IF(B$3=0,"n/a",C$3/B$3)
      - =IF( B3 = 0 , "n/a" , C3 / B3 )
      - =IF(B3<>0,C3/B3,"n/a")
      - =IFERROR(C3/B3,"n/a")
    reject:
      - formula: =C3/B3
        rule: value
      - formula: =IF(B3=0,"none",C3/B3)
        rule: value
      - formula: =IF(B3=0,"n/a",C3/B3)&" "
        rule: value
      - formula: =IF(B2=0,"n/a",C2/B2)
        rule: value
      - formula: =IF(B3="x","n/a",C3/B3)
        rule: value
      - formula: =IF B3=0,"n/a",C3/B3
        rule: syntax
