screens:
  - prompt: In B7, work out the North gross margin as a percentage, rounded to 1 decimal. If the region has no sales, show a blank instead of an error.
    rows:
      - [Region, Revenue, Cost]
      - [North, 1500, 800]
      - [South, 1200, 900]
      - [North, 1000, 580]
      - [West, 900, 700]
      - [null, null, null]
      - [North gross margin %, null, null]
    answerCell: B7
    expected: 44.8
    variants:
      - { set: { B2: 2055 }, expected: 54.8 }
      - { set: { C2: 1096 }, expected: 33 }
      - { set: { A2: South, A4: South }, expected: "" }
      - { set: { A5: North }, expected: 38.8 }
    answer: =IFERROR(ROUND((SUMIF(A2:A5,"North",B2:B5)-SUMIF(A2:A5,"North",C2:C5))/SUMIF(A2:A5,"North",B2:B5)*100,1),"")
    hints:
      nudge: Total the North revenue and the North cost first, then work out the margin from those two totals.
      rule: SUMIF adds the values on rows that match one condition. Margin is revenue minus cost, divided by revenue, and IFERROR swaps any error for the value you give it.
    misses:
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
      value: "Work in stages: North revenue, minus North cost, over North revenue, times 100. That is (2500 - 1380) / 2500 * 100 = 44.8."
      syntax: Check the brackets, commas and quote marks. IFERROR follows the pattern `=IFERROR(value, value_if_error)`.
      reference: Match on the region column and add the revenue column, so the answer follows the table.
    accept:
      - =IFERROR(ROUND((SUMIF(A2:A5,"North",B2:B5)-SUMIF(A2:A5,"North",C2:C5))/SUMIF(A2:A5,"North",B2:B5)*100,1),"")
      - =iferror(round((sumif(a2:a5,"north",b2:b5)-sumif(a2:a5,"north",c2:c5))/sumif(a2:a5,"north",b2:b5)*100,1),"")
      - =IFERROR(ROUND((SUMIF($A$2:$A$5,"North",$B$2:$B$5)-SUMIF($A$2:$A$5,"North",$C$2:$C$5))/SUMIF($A$2:$A$5,"North",$B$2:$B$5)*100,1),"")
