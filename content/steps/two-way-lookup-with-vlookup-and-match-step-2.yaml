step: 2
screens:
  - prompt: In B7, find which column of the table A1:D1 holds the quarter typed in B6, counting Product as 1. Use MATCH.
    rows:
      - [Product, Q1, Q2, Q3]
      - [Gizmo, 120, 140, 130]
      - [Widget, 90, 110, 125]
      - [Sprocket, 60, 75, 80]
      - [Flange, 150, 165, 170]
      - [Quarter, Q3, null, null]
      - [Column, null, null, null]
    answerCell: B7
    expected: 4
    variants:
      - set: { B6: Q1 }
        expected: 2
    answer: =MATCH(B6,A1:D1,0)
    requiredFunctions:
      - MATCH
    hints:
      nudge: Search the header row, starting from Product.
      rule: MATCH with 0 gives the position of the quarter in the header row, which is the column number VLOOKUP needs.
    misses:
      value: Q3 is column 4 of the table.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for MATCH.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =MATCH(B6,A1:D1,0)
      - =MATCH($B$6,$A$1:$D$1,0)
    reject:
      - formula: =MATCH(B6,B1:D1,0)
        rule: value
      - formula: =4
        rule: required-function
      - formula: =MATCH(B6,A1:D1,0
        rule: syntax
