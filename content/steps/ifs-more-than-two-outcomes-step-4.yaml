step: 4
screens:
  - prompt: Postage is 3.50 up to 1 kg, 6 up to 5 kg, 12 up to 20 kg and 25 above that. In C2, work out the postage for the weight in B2. Use IFS.
    rows:
      - [Parcel, Weight, Postage]
      - [P-4, 4.2, null]
    answerCell: C2
    expected: 6
    variants:
      - set: { B2: 0.8 }
        expected: 3.5
      - set: { B2: 20 }
        expected: 12
      - set: { B2: 30 }
        expected: 25
      - set: { B2: 1 }
        expected: 3.5
      - set: { B2: 6 }
        expected: 12
      - set: { B2: 20.5 }
        expected: 25
      - set: { B2: 5 }
        expected: 6
      - set: { B2: 1.5 }
        expected: 6
    answer: =IFS(B2<=1,3.5,B2<=5,6,B2<=20,12,TRUE,25)
    requiredFunctions:
      - IFS
    hints:
      nudge: Start from the lightest band and work up.
      rule: With tests that use <=, the smallest limit comes first; IFS stops at the first one that is TRUE.
    misses:
      value: A 4.2 kg parcel costs 6.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for IFS.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =IFS(B2<=1,3.5,B2<=5,6,B2<=20,12,TRUE,25)
      - =IFS(B2>20,25,B2>5,12,B2>1,6,TRUE,3.5)
    reject:
      - formula: =IFS(B2<=20,12,B2<=5,6,B2<=1,3.5,TRUE,25)
        rule: value
      - formula: =IFS(B2<1,3.5,B2<5,6,B2<20,12,TRUE,25)
        rule: fragile
      - formula: =6
        rule: required-function
      - formula: =IFS(B2<=1,3.5,B2<=5,6,B2<=20,12,TRUE,25
        rule: syntax
