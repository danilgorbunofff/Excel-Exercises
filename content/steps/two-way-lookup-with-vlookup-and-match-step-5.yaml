step: 5
screens:
  - prompt: In C8, return the units for the product in A8 and the quarter in B8. If either is not in the table, show Not found.
    rows:
      - [Product, Q1, Q2, Q3, Q4]
      - [Gizmo, 120, 140, 130, 155]
      - [Widget, 90, 110, 125, 135]
      - [Sprocket, 60, 75, 80, 70]
      - [Flange, 150, 165, 170, 180]
      - [Bracket, 40, 55, 65, 60]
      - [null, null, null, null, null]
      - [Widget, Q4, null, null, null]
    answerCell: C8
    expected: 135
    variants:
      - set: { A8: Hinge }
        expected: Not found
      - set: { B8: Q5 }
        expected: Not found
      - set: { A8: Bracket, B8: Q2 }
        expected: 55
    answer: =IFERROR(VLOOKUP(A8,A1:E6,MATCH(B8,A1:E1,0),FALSE),"Not found")
    requiredFunctions: []
    hints:
      nudge: MATCH gives the column for VLOOKUP; IFERROR catches a product or quarter that is missing.
      rule: VLOOKUP with MATCH as its column does the two-way lookup; IFERROR(..., "Not found") replaces any error.
    misses:
      value: Widget's Q4 units are 135.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =IFERROR(VLOOKUP(A8,A1:E6,MATCH(B8,A1:E1,0),FALSE),"Not found")
      - =IFERROR(INDEX(B2:E6,MATCH(A8,A2:A6,0),MATCH(B8,B1:E1,0)),"Not found")
    reject:
      - formula: =VLOOKUP(A8,A1:E6,MATCH(B8,A1:E1,0),FALSE)
        rule: fragile
      - formula: =IFERROR(VLOOKUP(A8,A1:E6,MATCH(B8,B1:E1,0),FALSE),"Not found")
        rule: value
      - formula: =135
        rule: reference
      - formula: =IFERROR(VLOOKUP(A8,A1:E6,MATCH(B8,A1:E1,0),FALSE),"Not found"
        rule: syntax
