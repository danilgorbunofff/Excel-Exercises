    variants:
      - { set: { E1: 45420 }, expected: 12 }
      - { set: { B16: 45340 }, expected: 9 }
    answer: =COUNTIF(B2:B16,"<"&E1-30)
    requiredFunctions: []
    hints:
      nudge: An invoice is too old when its date is before E1 minus 30.
      rule: COUNTIF(B2:B16,"<"&E1-30) counts the dates more than 30 days before E1; exactly 30 days does not count.
    misses:
      value: 8 invoices are more than 30 days old.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =COUNTIF(B2:B16,"<"&E1-30)
      - =SUMPRODUCT(--(E1-B2:B16>30))
    reject:
      - formula: =COUNTIF(B2:B16,"<="&E1-30)
        rule: fragile
      - formula: =COUNTIF(B2:B16,"<45370")
        rule: fragile
