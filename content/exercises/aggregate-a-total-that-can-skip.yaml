id: aggregate-a-total-that-can-skip
slug: aggregate-a-total-that-can-skip
level: 3
title: "AGGREGATE: a total that says what to ignore"
topic: subtotals
updated: 2026-11-11
checkedInExcel: null
screens:
  - prompt: In D5, add the prices up so that a broken cell in the range would not stop the total.
    rows:
      - [Item, Price, Qty, Answer]
      - [pen, 10, 2, null]
      - [pad, 5, 4, null]
      - [ink, 20, 3, null]
      - [Price total, null, null, null]
    answerCell: D5
    expected: 35
    answer: =AGGREGATE(9,6,B2:B4)
    requiredFunctions: [AGGREGATE]
    hints:
      nudge: One function takes a function number and an options number that can skip cells holding errors.
      rule: AGGREGATE takes a function number, an options number, then the range. Function 9 adds, and option 6 skips cells that hold errors.
    misses:
      value: Ten plus five plus twenty is 35.
      syntax: "Check the brackets, commas and quote marks. AGGREGATE follows the pattern `=AGGREGATE(function_num, options, ref1, [ref2], ...)`."
      required-function: Three arguments, and only AGGREGATE carries the options number that skips a broken cell.
      reference: The range is the price column of the table.
    accept:
      - =AGGREGATE(9,6,B2:B4)
      - =aggregate(9,6,b2:b4)
      - =AGGREGATE(9,6,$B$2:$B$4)
      - =AGGREGATE(9,6,B$2:B$4)
      - =AGGREGATE( 9 , 6 , B2:B4 )
      - =AGGREGATE(9,6,B2:B4)+0
    reject:
      - { formula: =SUM(B2:B4), rule: required-function }
      - { formula: "=AGGREGATE(9,6,B2:B3)", rule: value }
      - { formula: "=AGGREGATE(1,6,B2:B4)", rule: value }
      - { formula: "=AGGREGATE(9,6,B3:B4)", rule: value }
      - { formula: "=AGGREGATE(9,6,B2:B4)/0", rule: value }
      - { formula: "=AGGREGATE 9,6,B2:B4", rule: syntax }
  - prompt: In D5, average the prices with AGGREGATE and round the answer to one decimal place.
    rows:
      - [Item, Price, Qty, Answer]
      - [pen, 10, 2, null]
      - [pad, 5, 4, null]
      - [ink, 20, 3, null]
      - [Average price, null, null, null]
    answerCell: D5
    expected: 11.7
    answer: =ROUND(AGGREGATE(1,6,B2:B4),1)
    requiredFunctions: [AGGREGATE]
    hints:
      nudge: Change the function number to the one that averages, then round the result.
      rule: AGGREGATE uses the same function numbers as SUBTOTAL, so 1 averages and 9 adds. ROUND with 1 as its second argument keeps one decimal place.
    misses:
      value: 35 divided by 3 is 11.666..., which rounds to 11.7.
      syntax: "Check the brackets, commas and quote marks. ROUND follows the pattern `=ROUND(number, num_digits)`."
      required-function: An average over a range that may hold a broken cell needs AGGREGATE, with 1 as its function number.
      reference: The prices live in B2:B4.
    accept:
      - =ROUND(AGGREGATE(1,6,B2:B4),1)
      - =round(aggregate(1,6,b2:b4),1)
      - =ROUND(AGGREGATE(1,6,$B$2:$B$4),1)
      - =ROUND(AGGREGATE(1,6,B$2:B$4),1)
      - =ROUND( AGGREGATE(1, 6, B2:B4) , 1 )
      - =ROUND(AGGREGATE(1,6,B2:B4)*1,1)
    reject:
      - { formula: =AVERAGE(B2:B4), rule: required-function }
      - { formula: "=AGGREGATE(1,6,B2:B4)", rule: value }
      - { formula: "=ROUND(AGGREGATE(9,6,B2:B4),1)", rule: value }
      - { formula: "=ROUND(AGGREGATE(1,6,B3:B4),1)", rule: value }
      - { formula: "=ROUND(AGGREGATE(1,6,B2:B4),1)/0", rule: value }
      - { formula: "=ROUND AGGREGATE(1,6,B2:B4),1", rule: syntax }
notes:
  summary: AGGREGATE takes a function number, an options number and a range. The function number works as in SUBTOTAL, and the options number says what to skip, such as 6 for error values.
  syntax: AGGREGATE(function-number, options, range) with 9 for SUM, 1 for AVERAGE and 6 to skip error values
  example: "`=AGGREGATE(9,6,A1:A3)` with 4, `#N/A` and 10 in A1:A3 gives 14."
  commonErrors:
    - The options number is not one AGGREGATE recognises, so it cannot decide what to skip.
    - The function number is outside the range AGGREGATE supports.
    - Option six has left a failed row out of the total, so the sum is one row short.
