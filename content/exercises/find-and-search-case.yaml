      - { formula: '=FIND "-",A2', rule: syntax }
    variants:
      - { set: { A2: ANZ-1042 }, expected: 4 }
  - prompt: In B2, report the position of the first N in the label in A2, whatever its case.
    rows:
      - [Label, Position]
      - [banana grove, null]
      - [mango stall, null]
      - [lemon crate, null]
    answerCell: B2
    expected: 3
    answer: =SEARCH("N",A2)
    requiredFunctions: [SEARCH]
    hints:
      nudge: The label is in lower case, so the search has to ignore case.
      rule: SEARCH works like FIND and returns the position where the text starts, but it treats N and n as the same letter.
    misses:
      value: "b, a, n: the first n is in third place."
      syntax: "Check the brackets, commas and quote marks. SEARCH follows the pattern `=SEARCH(find_text, within_text, [start_num])`."
      required-function: FIND matches case and finds no capital N in this label. SEARCH ignores case.
      reference: The label is in A2.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =SEARCH("N",A2)
