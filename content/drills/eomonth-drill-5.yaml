id: eomonth-drill-5
slug: eomonth-drill-5
level: 2
title: Days in the month
updated: 2026-11-19
checkedInExcel: 2026-11-19
function: EOMONTH
screens:
  - prompt: In C2, use DAY and EOMONTH to find how many days the month of the date in B2 has.
    rows:
      - [Month, Date, Days]
      - [Feb, 46793, null]
    answerCell: C2
    expected: 29
    variants:
      - set: { B2: 46428 }
        expected: 28
      - set: { B2: 46113 }
        expected: 30
    answer: =DAY(EOMONTH(B2,0))
    requiredFunctions:
      - DAY
      - EOMONTH
    hints:
      nudge: The day number of a month's last day is the number of days in that month.
      rule: DAY(EOMONTH(B2,0)) returns 28, 29, 30 or 31.
    misses:
      value: February 2028 has 29 days.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for DAY and EOMONTH.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =DAY(EOMONTH(B2,0))
      - =LET(v,B2,DAY(EOMONTH(v,0)))
    reject:
      - formula: =EOMONTH(B2,0)
        rule: required-function
      - formula: =DAY(EOMONTH(B2,1))
        rule: value
      - formula: =29
        rule: required-function
      - formula: =DAY(EOMONTH(B2,0)
        rule: syntax
