id: price-with-tax
slug: price-with-tax
level: 1
tier: 1
title: Price with tax
updated: 2026-11-16
checkedInExcel: 2026-11-16
screens:
  - prompt: In B4, work out the price including tax, using the tax rate in B3.
    rows:
      - [Item, Desk lamp]
      - [Price, 80]
      - [Tax rate, 0.2]
      - [With tax, null]
    answerCell: B4
    expected: 96
    variants:
      - set: { B2: 110 }
        expected: 132
    answer: "=B2*(1+B3)"
    hints:
      nudge: The price with tax is the price plus the price times the rate.
      rule: Multiply by 1 plus the rate. Brackets make Excel add before it multiplies.
    misses:
      value: 80 plus 20% is 96.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - "=B2*(1+B3)"
      - "=b2*(1+b3)"
      - "=B2+B2*B3"
      - "=(1+B3)*B2"
      - "=B2*B3+B2"
    reject:
      - { formula: "=B2*B3", rule: value }
      - { formula: "=B2+B3", rule: value }
      - { formula: "=B2*(1+B3", rule: syntax }
      - { formula: "=96", rule: reference }
