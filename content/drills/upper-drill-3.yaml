id: upper-drill-3
slug: upper-drill-3
level: 1
title: Join and capitalise
updated: 2026-11-17
checkedInExcel: 2026-11-17
function: UPPER
screens:
  - prompt: In C2, join A2 and B2, and use UPPER to turn the result into capitals.
    rows:
      - [Part 1, Part 2, Result]
      - [ab, cd, null]
    answerCell: C2
    expected: ABCD
    variants:
      - set: { B2: xy }
        expected: ABXY
    answer: =UPPER(A2&B2)
    requiredFunctions:
      - UPPER
    hints:
      nudge: Join first, then capitalise the whole result.
      rule: UPPER(A2&B2) capitalises the joined text.
    misses:
      value: Joined and in capitals, the text is ABCD.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for UPPER.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =UPPER(A2&B2)
      - =UPPER(A2)&UPPER(B2)
      - =UPPER(CONCAT(A2,B2))
    reject:
      - formula: =UPPER(A2)&B2
        rule: value
      - formula: ="ABCD"
        rule: required-function
      - formula: =UPPER(A2&B2
        rule: syntax
