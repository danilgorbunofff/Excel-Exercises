screens:
  - prompt: In F2, count the bookings made for Monday (Mon in column A). Use COUNTIF.
    rows:
      - [Date, Room, Booked by, null, null, null, null]
      - [Mon, Oak, Ali, null, null, null, null]
      - [Mon, Elm, Bea, null, null, null, null]
      - [Tue, Oak, Cid, null, null, null, null]
      - [Tue, Elm, Dee, null, null, null, null]
      - [Wed, Ash, Eli, null, null, null, null]
      - [Wed, Elm, Fay, null, null, null, null]
      - [Thu, Oak, Gus, null, null, null, null]
      - [Thu, Elm, Hal, null, null, null, null]
      - [Fri, Ash, Ivy, null, null, null, null]
      - [Fri, Elm, Jon, null, null, null, null]
    answerCell: F2
    expected: 2
    variants:
      - { set: { A4: Mon }, expected: 3 }
      - { set: { A11: Mon }, expected: 3 }
    answer: =COUNTIF(A2:A11,"Mon")
    requiredFunctions:
      - COUNTIF
    hints:
      nudge: Count in the column that holds the days.
      rule: COUNTIF counts the cells in the day column that say Mon, written in quotes.
    misses:
      value: 2 bookings are on Monday.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for COUNTIF.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =COUNTIF(A2:A11,"Mon")
      - =COUNTIF($A$2:$A$11,"Mon")
    reject:
      - formula: =COUNTIF(B2:B11,"Mon")
        rule: value
      - formula: =2
        rule: required-function
      - formula: =COUNTIF(A2:A11,"Mon"
        rule: syntax
