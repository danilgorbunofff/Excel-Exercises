notes:
  summary: INDEX reads a value at a position in a range, and MATCH supplies that position by finding a key in another range. Together they look up a value without counting columns.
  syntax: INDEX(answer,MATCH(name,names,0)) looks up anything; nest the inner INDEX for three tables
  example: '`=INDEX(B1:B3,MATCH("Cy",A1:A3,0))` with Ana, Bo and Cy in A1:A3 and 10, 20 and 30 in B1:B3 gives 30.'
  commonErrors:
    - The typed name is not in the column MATCH reads, which leaves it no position to return.
    - INDEX is given a position past the end of its range, which is what happens after a column is deleted.
    - The outer INDEX reads the target column at the rep's row instead of the region's row, and returns a nearby figure.
