screens:
  - prompt: "In D2, work out the due date: the invoice date in B2 plus the payment terms in days in C2."
    rows:
      - [Invoice, Date, Terms, Due]
      - [INV-7, 45352, 30, null]
    answerCell: D2
    expected: 45382
    variants:
      - set: { C2: 14 }
        expected: 45366
    answer: =B2+C2
    requiredFunctions: []
    hints:
      nudge: Adding a number of days to a date gives a later date.
      rule: Adding a number to a date moves it on by that many days.
    misses:
      value: The invoice is due on serial 45382.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =B2+C2
      - =C2+B2
    reject:
      - formula: =B2+30
        rule: reference
      - formula: =45382
        rule: reference
      - formula: =B2+C2,
        rule: syntax
