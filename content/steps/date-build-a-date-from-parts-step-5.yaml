id: date-build-a-date-from-parts-step-5
slug: date-build-a-date-from-parts-step-5
level: 3
title: Due at the end of next month
updated: 2026-11-25
checkedInExcel: 2026-11-25
parent: date-build-a-date-from-parts
step: 5
screens:
  - prompt: In E2, when is the invoice due? Payment falls on the last day of the month after the invoice month.
    rows:
      - [Invoice, Year, Month, Day, Due]
      - [INV-2001, 2024, 3, 15, null]
    answerCell: E2
    expected: 45412
    variants:
      - set: { C2: 11 }
        expected: 45657
      - set: { B2: 2023, C2: 12 }
        expected: 45322
      - set: { C2: 1 }
        expected: 45351
    answer: =DATE(B2,C2+2,0)
    requiredFunctions: []
    hints:
      nudge: The due date is the last day of the month after the invoice month.
      rule: Day 0 of a month is the last day of the month before it. DATE rolls a month past 12 into the next year by itself.
    misses:
      value: The invoice is due on serial 45412.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =DATE(B2,C2+2,0)
      - =DATE(B2,C2+2,1)-1
      - =EOMONTH(DATE(B2,C2,1),1)
    reject:
      - formula: =DATE(B2,C2+1,0)
        rule: value
      - formula: =DATE(B2,C2+1,D2)
        rule: value
      - formula: =DATE(B2,C2+2,D2)
        rule: value
      - formula: =45412
        rule: reference
      - formula: =DATE(B2,C2+2,0
        rule: syntax
