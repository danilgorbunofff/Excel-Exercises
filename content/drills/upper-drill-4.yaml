function: UPPER
screens:
  - prompt: In B2, use UPPER to turn the note in A2 into capitals.
    rows:
      - [Note, Result]
      - ["order #12b, due 3pm", null]
    answerCell: B2
    expected: "ORDER #12B, DUE 3PM"
    variants:
      - set: { A2: box 7-a }
        expected: BOX 7-A
    answer: =UPPER(A2)
    requiredFunctions:
      - UPPER
    hints:
      nudge: Digits, spaces and symbols do not change.
      rule: UPPER changes letters only.
    misses:
      value: "In capitals, the note reads ORDER #12B, DUE 3PM."
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for UPPER.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =UPPER(A2)
    reject:
      - formula: =PROPER(A2)
        rule: required-function
      - formula: '="ORDER #12B, DUE 3PM"'
        rule: required-function
      - formula: =UPPER(A2
