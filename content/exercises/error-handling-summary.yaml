id: error-handling-summary
slug: error-handling-summary
level: 3
title: "Error handling: which net catches what"
topic: errors
updated: 2026-11-11
checkedInExcel: null
screens:
  - prompt: In B9, price the code in A8 and say no match when any part of the lookup fails.
    rows:
      - [Code, Price]
      - [A-1, 10]
      - [B-2, 20]
      - [C-3, 30]
      - [A-1, 12]
      - [B-2, 22]
      - [C-3, 32]
      - [Q-9, null]
      - [Any failure, null]
    answerCell: B9
    expected: no match
    answer: =IFERROR(VLOOKUP(A8,A2:B7,2,FALSE),"no match")
    requiredFunctions: [IFERROR, VLOOKUP]
    hints:
      nudge: The prompt wants any failure caught, not only a missing match.
      rule: "IFERROR replaces every kind of error with its second argument. IFNA replaces only `#N/A`."
    misses:
      value: Q-9 is not on the list, so the lookup fails and the net prints no match.
      syntax: "=IFERROR(value, value_if_error): the second argument is the net."
      required-function: The prompt wants any failure to become no match, and that takes the wider net.
      reference: Read the code from A8 so the answer follows the cell.
    accept:
      - =IFERROR(VLOOKUP(A8,A2:B7,2,FALSE),"no match")
      - =iferror(vlookup(a8,a2:b7,2,false),"no match")
      - =IFERROR(VLOOKUP($A$8,$A$2:$B$7,2,FALSE),"no match")
      - =IFERROR(VLOOKUP($A8,$A$2:$B$7,2,FALSE),"no match")
      - =IFERROR(VLOOKUP(A$8,A2:B7,2,FALSE),"no match")
      - =IFERROR(VLOOKUP($A$8,A2:B7,2,FALSE),"no match")
    reject:
      - { formula: '=IFERROR(VLOOKUP(A8,A2:B7,1,FALSE),"other")', rule: value }
      - { formula: '=IFNA(VLOOKUP(A8,A2:B7,3,FALSE),"no match")', rule: required-function }
      - { formula: '=IFERROR(1/0,"no match")', rule: required-function }
      - { formula: '=IFERROR(VLOOKUP(A8,A2:B7,2,FALSE),"no match")/0', rule: value }
      - { formula: '=IFERROR(VLOOKUP(A8 A2:B7,2,FALSE),"no match")', rule: syntax }
  - prompt: In D8, divide the price on row 4 by its units and say no units when the division fails.
    rows:
      - [Code, Price, Units, Answer]
      - [A-1, 10, 5, null]
      - [B-2, 20, 4, null]
      - [C-3, 30, null, null]
      - [A-1, 12, 3, null]
      - [B-2, 22, 2, null]
      - [C-3, 32, 6, null]
      - [Note, null, null, null]
    answerCell: D8
    expected: no units
    answer: =IFERROR(B4/C4,"no units")
    requiredFunctions: [IFERROR]
    hints:
      nudge: Dividing by an empty cell gives an error that IFNA does not catch.
      rule: "Dividing by zero or by an empty cell gives `#DIV/0!`. IFERROR catches it and shows the fallback, while IFNA lets it through."
    misses:
      value: Row 4 is C-3 at 30 with no units recorded, so the division fails and the answer is no units.
      syntax: "Check the brackets, commas and quote marks. IFERROR follows the pattern `=IFERROR(value, value_if_error)`."
      required-function: "C4 is empty, so the division raises `#DIV/0!`, and the net is what turns that into words."
      reference: Divide the price in B4 by the units in C4, both read from the grid.
    accept:
      - =IFERROR(B4/C4,"no units")
      - =iferror(b4/c4,"no units")
      - =IFERROR($B$4/$C$4,"no units")
      - =IFERROR(B$4/C$4,"no units")
      - =IFERROR( B4 / C4 , "no units" )
      - =IFERROR(($B4)/($C4),"no units")
    reject:
      - { formula: '=IFNA(B4/C4,"no units")', rule: required-function }
      - { formula: '=IFERROR(B4/C5,"no units")', rule: value }
      - { formula: '=IFERROR(B3/C3,"no units")', rule: value }
      - { formula: '=IFERROR(B4/C4,"none")', rule: value }
      - { formula: '=IFERROR(B4/C4,"no units")/0', rule: value }
      - { formula: '=IFERROR B4/C4,"no units"', rule: syntax }
notes:
  summary: "IFERROR returns its second argument whenever the first one fails, whatever the reason. IFNA returns the second argument only for `#N/A`."
  syntax: "IFERROR(value, fallback) catches everything; =IFNA(value, fallback) catches only #N/A"
  example: '`=IFERROR(1/0,"none")` gives none, while `=IFNA(1/0,"none")` still shows `#DIV/0!`.'
  commonErrors:
    - C4 is blank, so the division has no divisor; only the wide net answers it with words.
    - The lookup found no Q-9, the error IFNA is built to replace.
    - The wide net reports a broken reference as no match, so a real formula fault passes for absent data.
