function: COUNTA
screens:
  - prompt: In B8, use COUNTA to find how many tasks have an owner in B2:B7.
    rows:
      - [Task, Owner]
      - [Plan, Ann]
      - [Build, null]
      - [Test, Raj]
      - [Docs, null]
      - [Ship, Lea]
      - [Review, Tom]
      - [Owned, null]
