    answer: =COUNTIFS(B2:B16,"",C2:C16,"<>Done")
    requiredFunctions: []
    hints:
      nudge: "Two tests on each row: the owner is empty and the status is not Done."
      rule: COUNTIFS(B2:B16,"",C2:C16,"<>Done") counts the rows where both tests pass. "" matches an empty cell and "<>Done" anything but Done.
    misses:
      value: 5 tasks are unowned and not Done, Waiting ones included.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =COUNTIFS(B2:B16,"",C2:C16,"<>Done")
      - =SUMPRODUCT((B2:B16="")*(C2:C16<>"Done"))
    reject:
      - formula: =COUNTBLANK(B2:B16)
        rule: value
      - formula: =COUNTIFS(B2:B16,"",C2:C16,"Open")
        rule: value
      - formula: =5
        rule: reference
      - formula: =COUNTIFS(B2:B16,"",C2:C16,"<>Done"
