      - [1007]
      - [1017]
    variants:
      - { set: { D11: 900 }, expected: [[1001], [1007], [1010], [1017]] }
      - { set: { B12: North }, expected: [[1001], [1007], [1011], [1017]] }
      - { set: { D5: 800 }, expected: [[1001], [1004], [1007], [1017]] }
      - { set: { D2: 799 }, expected: [[1007], [1017]] }
    answer: '=FILTER(A2:A19,(B2:B19="North")*(D2:D19>=800))'
    hints:
      nudge: "Both tests must hold on the same row: the region, and the amount."
      rule: "Multiply two tests to mean AND: TRUE*TRUE is 1 and anything with FALSE is 0. Add them to mean OR. Put each test in brackets."
    misses:
      value: "Three North orders reach 800: 1001, 1007 and 1017."
      syntax: "Put each test in its own brackets and multiply them: `(test1)*(test2)`."
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
