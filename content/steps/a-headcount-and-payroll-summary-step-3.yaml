      - [Team, Heads, Salary, null, null, Sales share]
      - [Sales, 12, 48000, null, null, null]
      - [Finance, 5, 56000, null, null, null]
      - [IT, 8, 61000, null, null, null]
      - [Admin, 4, 34000, null, null, null]
    answerCell: F2
    expected: 0.413793103448
    variants:
      - set: { B2: 15 }
        expected: 0.46875
    answer: =XLOOKUP("Sales",A2:A5,B2:B5)/SUM(B2:B5)
    requiredFunctions:
      - XLOOKUP
      - SUM
    hints:
      nudge: Sales' heads divided by all heads.
      rule: Looking the team up by name keeps the formula right even if the rows are re-sorted.
    misses:
      value: Sales holds 0.41 of all heads.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for XLOOKUP and SUM.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
