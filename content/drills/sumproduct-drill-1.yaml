id: sumproduct-drill-1
slug: sumproduct-drill-1
level: 1
title: Total value of an order
updated: 2026-11-17
checkedInExcel: 2026-11-17
function: SUMPRODUCT
screens:
  - prompt: "In C7, use SUMPRODUCT to total the order: each quantity in B2:B6 times its price in C2:C6."
    rows:
      - [Item, Qty, Price]
      - [Pens, 10, 1.5]
      - [Pads, 4, 3]
      - [Clips, 20, 0.25]
      - [Tape, 3, 2]
      - [Files, 5, 4]
      - [Order total, null, null]
    answerCell: C7
    expected: 58
    variants:
      - set: { B3: 8 }
        expected: 70
    answer: =SUMPRODUCT(B2:B6,C2:C6)
    requiredFunctions:
      - SUMPRODUCT
    hints:
      nudge: Multiply each quantity by its price, then add up the results, in one function.
      rule: SUMPRODUCT(range1,range2) multiplies the ranges row by row and adds the products. Both ranges must be the same size.
    misses:
      value: The 5 lines come to 15 + 12 + 5 + 6 + 20, which is 58.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for SUMPRODUCT.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =SUMPRODUCT(B2:B6,C2:C6)
    reject:
      - formula: =SUMPRODUCT(B2:B6)*SUMPRODUCT(C2:C6)
        rule: value
      - formula: =B2*C2+B3*C3+B4*C4+B5*C5+B6*C6
        rule: required-function
      - formula: =58
        rule: required-function
      - formula: =SUMPRODUCT(B2:B6,C2:C6
        rule: syntax
