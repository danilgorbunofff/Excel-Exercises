  - prompt: In D2, add the amounts of every code that fits the two-letter pattern with a wildcard. Use SUMIF.
    rows:
      - [Code, Region, Amount, Answer]
      - [AN-1042, North, 120, null]
      - [BO-2299, South, 80, null]
      - [CY-3140, North, 200, null]
      - [DE-4471, North, 60, null]
    answerCell: D2
    expected: 460
    answer: =SUMIF(A2:A5,"??-*",C2:C5)
    requiredFunctions: [SUMIF]
    hints:
      nudge: Each question mark stands for one character, and a star covers the rest of the code.
      rule: SUMIF takes the range to test, the criterion, then the range to add. Wildcards in the criterion work as they do in COUNTIF.
    misses:
      value: All four codes are two letters, a hyphen and four digits, so all four amounts count.
      syntax: "Check the brackets, commas and quote marks. SUMIF follows the pattern `=SUMIF(range, criteria, [sum_range])`."
      required-function: A total that depends on a pattern is SUMIF's job.
      reference: The codes are in A2:A5.
    accept:
      - =SUMIF(A2:A5,"??-*",C2:C5)
      - =sumif(a2:a5,"??-*",c2:c5)
      - =SUMIF($A$2:$A$5,"??-*",$C$2:$C$5)
      - =SUMIF(A$2:A$5,"??-*",C$2:C$5)
      - =SUMIF( A2:A5 , "??-*" , C2:C5 )
      - =SUMIF(A2:A5,"*-*",C2:C5)
      - =SUMIF(A2:A5,"*",C2:C5)
      - =SUMIF(A2:A5,"??-*",C2:C5)+0
    reject:
      - { formula: =SUM(C2:C5), rule: required-function }
      - { formula: '=COUNTIF(A2:A5,"??-*")', rule: required-function }
      - { formula: '=SUMIF(A2:A5,"*-1*",C2:C5)', rule: value }
      - { formula: '=SUMIF(A2:A4,"??-*",C2:C4)', rule: value }
      - { formula: '=SUMIF(A2:A5,"??-*",B2:B5)', rule: value }
      - { formula: '=SUMIF(C2:C5,">100",C2:C5)', rule: value }
      - { formula: '=SUMIF(A2:A5,"??-*",C2:C5)/0', rule: value }
      - { formula: '=SUMIF A2:A5,"??-*",C2:C5', rule: syntax }
notes:
  summary: A criterion is the text that tells COUNTIF or SUMIF which rows count, and two marks inside it act as wildcards. A question mark stands for exactly one character, a star for any run of them including none.
  syntax: In a criterion, ? matches one character and * matches any run of them
  example: '`=COUNTIF(A1:A3,"Re*")` with Red, Reed and Blue gives 2.'
  commonErrors:
    - The criterion cannot be read as text or as a comparison, usually because its quotes are unbalanced.
    - A range points at rows that no longer exist after a column was deleted.
    - COUNTIF(B2:B5,"N") matches nothing and returns 0.
