id: isblank-drill-5
slug: isblank-drill-5
level: 2
title: Missing or OK
updated: 2026-11-17
checkedInExcel: 2026-11-17
function: ISBLANK
screens:
  - prompt: In C2, use IF and ISBLANK to show "Missing" when B2 is empty, and "OK" otherwise.
    rows:
      - [Store, Report, Status]
      - [S1, null, null]
    answerCell: C2
    expected: Missing
    variants:
      - set: { B2: done }
        expected: OK
    answer: =IF(ISBLANK(B2),"Missing","OK")
    requiredFunctions:
      - ISBLANK
      - IF
    hints:
      nudge: Use ISBLANK as the test inside IF.
      rule: IF takes the test, then the result when it is TRUE, then the result when it is FALSE.
    misses:
      value: B2 is empty, so the status is Missing.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for ISBLANK and IF.
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
    accept:
      - =IF(ISBLANK(B2),"Missing","OK")
    reject:
      - formula: =IF(B2="","Missing","OK")
        rule: required-function
      - formula: =IF(ISBLANK(B2),"OK","Missing")
        rule: value
      - formula: ="Missing"
        rule: required-function
      - formula: =IF(ISBLANK(B2),"Missing","OK"
        rule: syntax
