      - { set: { A7: Q-9 }, expected: 32 }
    answer: =IFNA(VLOOKUP(A8,A2:B7,2,FALSE),"not on the list")
    hints:
      nudge: Wrap the lookup in a guard that replaces only the error for a missing match.
      rule: "VLOOKUP with FALSE returns `#N/A` when the code is missing. IFNA shows its second argument for `#N/A` and lets every other error through."
    misses:
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
      value: Q-9 is not in A2:A7, so the answer is not on the list.
      syntax: "Check the brackets, commas and quote marks. IFNA follows the pattern `=IFNA(value, value_if_na)`."
      reference: Read the code from A8 instead of typing Q-9 into the formula.
