id: xlookup-search-from-the-bottom
slug: xlookup-search-from-the-bottom
level: 2
title: "XLOOKUP: search from the bottom"
topic: lookups
updated: 2026-11-16
checkedInExcel: 2026-11-16
screens:
  - prompt: In B7, return the most recent price logged for the SKU in A7, which the log records twice.
    rows:
      - [SKU, Price]
      - [TX-101, 19.99]
      - [TX-102, 14]
      - [TX-101, 21.5]
      - [TX-103, 9.5]
      - [TX-102, 16.25]
      - [TX-101, null]
      - [TX-102, null]
    answerCell: B7
    expected: 21.5
    answer: =XLOOKUP(A7,A2:A6,B2:B6,,0,-1)
    requiredFunctions: [XLOOKUP]
    hints:
      nudge: "XLOOKUP can start its search at the last row instead of the first."
      rule: "The sixth argument of XLOOKUP sets the search mode. 1 searches from the first row and -1 from the last, so -1 finds the newest entry in a log."
    misses:
      value: The first TX-101 entry is 19.99, and the newest is 21.5. Set the sixth argument to -1 so the search starts at the bottom.
      syntax: "Check the brackets, commas and quote marks. XLOOKUP follows the pattern `=XLOOKUP(lookup_value, lookup_array, return_array, [if_not_found])`."
      required-function: Use XLOOKUP. VLOOKUP and MATCH return the first match, and XLOOKUP can search from the last row.
      reference: Point at A7 rather than typing the SKU, so the same formula works for A8.
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
    accept:
      - =XLOOKUP(A7,A2:A6,B2:B6,,0,-1)
      - =xlookup(a7,a2:a6,b2:b6,,0,-1)
      - =XLOOKUP(A7,$A$2:$A$6,$B$2:$B$6,,0,-1)
      - =XLOOKUP(A7,A2:A6,B2:B6,"none",0,-1)
      - =XLOOKUP(A7,A2:A6,B2:B6,0,0,-1)
      - =XLOOKUP( A7 , A2:A6 , B2:B6 , , 0 , -1 )
      - =XLOOKUP(A7,A1:A6,B1:B6,,0,-1)
    reject:
      - { formula: "=XLOOKUP(A7,A2:A6,B2:B6,,0,-1", rule: syntax }
      - { formula: "=VLOOKUP(A7,A2:B6,2,FALSE)", rule: required-function }
      - { formula: "=INDEX(B2:B6,MATCH(A7,A2:A6,0))", rule: required-function }
      - { formula: "=XLOOKUP(A7,A2:A6,B2:B6)", rule: value }
      - { formula: "=XLOOKUP(A7,A2:A6,B2:B6,,0,1)", rule: value }
      - { formula: "=XLOOKUP(A7,C2:C6,B2:B6,,0,-1)", rule: value }
      - { formula: "=XLOOKUP(A7,A2:A6,B2:B5,,0,-1)", rule: value }
      - { formula: "=XLOOKUP(A7,A2:A5,B2:B5,,0,-1)", rule: fragile }
    variants:
      - { set: { A7: TX-102 }, expected: 16.25 }
  - prompt: In B8, do the same for the SKU in A8, whose two entries are the second and the last in the log.
    rows:
      - [SKU, Price]
      - [TX-101, 19.99]
      - [TX-102, 14]
      - [TX-101, 21.5]
      - [TX-103, 9.5]
      - [TX-102, 16.25]
      - [TX-101, null]
      - [TX-102, null]
    answerCell: B8
    expected: 16.25
    answer: =XLOOKUP(A8,A2:A6,B2:B6,,0,-1)
    requiredFunctions: [XLOOKUP]
    hints:
      nudge: "Use the same search from the bottom, now for the SKU in the row below."
      rule: "Search mode -1 returns the last match in the list. Leave the fourth argument empty and set the match mode to 0 for an exact match."
    misses:
      value: The first TX-102 is 14, in row 3. Working from the bottom, the last one is 16.25.
      syntax: "Check the brackets, commas and quote marks. XLOOKUP follows the pattern `=XLOOKUP(lookup_value, lookup_array, return_array, [if_not_found])`."
      required-function: Use XLOOKUP, as for A7. VLOOKUP and MATCH return the first match, not the last.
      reference: Point at A8, which holds TX-102. That SKU appears in rows 3 and 6.
    accept:
      - =XLOOKUP(A8,A2:A6,B2:B6,,0,-1)
      - =xlookup(a8,a2:a6,b2:b6,,0,-1)
      - =XLOOKUP(A8,$A$2:$A$6,$B$2:$B$6,,0,-1)
      - =XLOOKUP(A8,A2:A6,B2:B6,"none",0,-1)
      - =XLOOKUP(A8,A2:A6,B2:B6,0,0,-1)
      - =XLOOKUP( A8 , A2:A6 , B2:B6 , , 0 , -1 )
      - =XLOOKUP(A8,A1:A6,B1:B6,,0,-1)
    reject:
      - { formula: "=XLOOKUP(A8,A2:A6,B2:B6,,0,-1", rule: syntax }
      - { formula: "=VLOOKUP(A8,A2:B6,2,FALSE)", rule: required-function }
      - { formula: "=INDEX(B2:B6,MATCH(A8,A2:A6,0))", rule: required-function }
      - { formula: "=XLOOKUP(A8,A2:A6,B2:B6)", rule: value }
      - { formula: "=XLOOKUP(A8,A2:A6,B2:B6,,0,1)", rule: value }
      - { formula: "=XLOOKUP(A8,C2:C6,B2:B6,,0,-1)", rule: value }
      - { formula: "=XLOOKUP(A8,A2:A6,B2:B5,,0,-1)", rule: value }
notes:
  summary: "XLOOKUP with search mode -1 starts at the last row and works up. In a log that adds new rows at the bottom, that returns the most recent entry."
  syntax: XLOOKUP(lookup_value, lookup_array, return_array, [if_not_found], [match_mode], [search_mode])
  example: '`=XLOOKUP("A",A1:A3,B1:B3,,0,-1)` with A, B and A in column A and 5, 6 and 7 in column B gives 7.'
  commonErrors:
    - A searched range that points at the wrong column returns #N/A. One that stops before the last row can miss the newest entry.
    - Search and return ranges of different sizes make XLOOKUP return #VALUE!.
