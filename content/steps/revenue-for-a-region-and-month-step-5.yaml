      - [North, Jan, 12400, null, North, null, null]
      - [South, Jan, 9800, null, South, null, null]
      - [South, Feb, 11250, null, West, null, null]
      - [North, Feb, 13100, null, null, null, null]
      - [West, Feb, 7600, null, null, null, null]
      - [South, Feb, 4300, null, null, null, null]
      - [North, Mar, 14800, null, null, null, null]
      - [South, Mar, 10900, null, null, null, null]
      - [West, Jan, 6900, null, null, null, null]
      - [South, Feb, 2750, null, null, null, null]
    answerCell: F2
    expected: South
    variants:
      - set: { F1: Jan }
        expected: North
      - set: { C6: 20000 }
        expected: West
    answer: =INDEX(E2:E4,MATCH(MAX(SUMIFS(C2:C11,A2:A11,E2:E4,B2:B11,F1)),SUMIFS(C2:C11,A2:A11,E2:E4,B2:B11,F1),0))
    requiredFunctions: []
    hints:
      nudge: Work out every region's total for that month at once, then pick the highest.
      rule: SUMIFS with E2:E4 as a criteria gives one total per region for the month.
    misses:
      value: South made the most that month.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =INDEX(E2:E4,MATCH(MAX(SUMIFS(C2:C11,A2:A11,E2:E4,B2:B11,F1)),SUMIFS(C2:C11,A2:A11,E2:E4,B2:B11,F1),0))
