id: region-or-not-listed
slug: region-or-not-listed
level: 2
title: Region or Not listed
updated: 2026-11-16
checkedInExcel: 2026-11-16
screens:
  - prompt: In F2, show the region of the customer in E2, or Not listed when the customer is missing.
    rows:
      - [Customer, Region, null, null, null, null]
      - [Arco, North, null, null, Zeta, null]
      - [Bolt, South, null, null, null, null]
      - [Crux, East, null, null, null, null]
      - [Delt, West, null, null, null, null]
      - [Echo, North, null, null, null, null]
    answerCell: F2
    expected: Not listed
    answer: '=IFERROR(XLOOKUP(E2,A2:A6,B2:B6),"Not listed")'
    hints:
      nudge: Look the customer up, and catch the case where it is not there.
      rule: IFERROR or XLOOKUP's fourth argument can show your own text when there is no match.
    misses:
      value: Zeta is not on the list, so the cell should say Not listed.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - '=IFERROR(XLOOKUP(E2,A2:A6,B2:B6),"Not listed")'
      - '=iferror(xlookup(e2,a2:a6,b2:b6),"Not listed")'
      - '=XLOOKUP(E2,A2:A6,B2:B6,"Not listed")'
      - '=IFERROR(VLOOKUP(E2,A2:B6,2,FALSE),"Not listed")'
      - '=IFNA(XLOOKUP(E2,A2:A6,B2:B6),"Not listed")'
    reject:
      - { formula: "=XLOOKUP(E2,A2:A6,B2:B6)", rule: value }
      - { formula: '=IFERROR(XLOOKUP(E2,A2:A6,B2:B6),"Missing")', rule: value }
      - { formula: '=IFERROR(XLOOKUP(E2,A2:A6,B2:B6),"Not listed"', rule: syntax }
      - { formula: '="Not listed"', rule: reference }
    variants:
      - { set: { E2: Arco }, expected: North }
