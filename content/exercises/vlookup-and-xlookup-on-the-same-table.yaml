id: vlookup-and-xlookup-on-the-same-table
slug: vlookup-and-xlookup-on-the-same-table
level: 2
title: VLOOKUP and XLOOKUP on the same table
topic: lookups
updated: 2026-11-16
checkedInExcel: 2026-11-16
screens:
  - prompt: In B7, return the unit price for the SKU in B6 from the table A1:C5. Use VLOOKUP.
    rows:
      - [SKU, Product, Unit price]
      - [BX-210, Bracket, 2.4]
      - [CX-330, Clamp, 3.8]
      - [DX-410, Dowel, 1.15]
      - [EX-500, Extrusion, 9.6]
      - [Which SKU?, CX-330, null]
      - [Unit price, null, null]
    answerCell: B7
    expected: 3.8
    answer: =VLOOKUP(B6,A2:C5,3,FALSE)
    requiredFunctions: [VLOOKUP]
    hints:
      nudge: "Count the columns from the SKU column across to the price column."
      rule: "VLOOKUP searches the first column of a table and returns the value from the column number you give. FALSE asks for an exact match."
    misses:
      value: "Count from the SKU column: product is 2, price is 3. Column 2 would return Clamp."
      syntax: "Check the brackets, commas and quote marks. VLOOKUP follows the pattern `=VLOOKUP(lookup_value, table_array, col_index_num, [range_lookup])`."
      required-function: Use VLOOKUP on this screen. XLOOKUP comes on the next one.
      reference: Take the SKU from B6, so a new SKU typed there gives its own price.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =VLOOKUP(B6,A2:C5,3,FALSE)
      - =vlookup(b6,a2:c5,3,false)
      - =VLOOKUP($B$6,$A$2:$C$5,3,FALSE)
      - =VLOOKUP(B6,A2:C5,3,0)
      - =VLOOKUP(B6,A1:C5,3,FALSE)
      - =VLOOKUP(B6,A2:C5,3,FALSE)+0
    reject:
      - { formula: "=VLOOKUP(B6,A2:C5,3,FALSE", rule: syntax }
      - { formula: "=VLOOKUP(B6,A2:C5,2,FALSE)", rule: value }
      - { formula: "=XLOOKUP(B6,A2:A5,C2:C5)", rule: required-function }
      - { formula: "=VLOOKUP(B6,A2:B4,3,FALSE)", rule: value }
    variants:
      - { set: { A2: CX-330 }, expected: 2.4 }
      - { set: { B6: EX-500 }, expected: 9.6 }
  - prompt: "In B7, return the same unit price with XLOOKUP instead: the SKU in B6, the SKU column, the price column."
    rows:
      - [SKU, Product, Unit price]
      - [BX-210, Bracket, 2.4]
      - [CX-330, Clamp, 3.8]
      - [DX-410, Dowel, 1.15]
      - [EX-500, Extrusion, 9.6]
      - [Which SKU?, CX-330, null]
      - [Unit price, null, null]
    answerCell: B7
    expected: 3.8
    answer: =XLOOKUP(B6,A2:A5,C2:C5)
    requiredFunctions: [XLOOKUP]
    hints:
      nudge: "XLOOKUP takes the column to search and the column to return, with no column count."
      rule: "XLOOKUP takes what to find, the range to search, then the range to return from. Both ranges need the same number of rows."
    misses:
      value: The price is in column C, so the third argument should be C2:C5.
      syntax: "Check the brackets, commas and quote marks. XLOOKUP follows the pattern `=XLOOKUP(lookup_value, lookup_array, return_array, [if_not_found])`."
      required-function: Use XLOOKUP on this screen, with the SKU column to search and the price column to return.
      reference: Take the SKU from B6, as on the first screen.
    accept:
      - =XLOOKUP(B6,A2:A5,C2:C5)
      - =xlookup(b6,a2:a5,c2:c5)
      - =XLOOKUP($B$6,$A$2:$A$5,$C$2:$C$5)
      - =XLOOKUP(B6,A2:A5,C2:C5)+0
      - =XLOOKUP(B6,A1:A5,C1:C5)
      - =XLOOKUP(B6,A2:A5,C2:C5)*1
    reject:
      - { formula: "=XLOOKUP(B6,A2:A5,C2:C5", rule: syntax }
      - { formula: "=VLOOKUP(B6,A2:C5,3,FALSE)", rule: required-function }
      - { formula: "=INDEX(C2:C5,MATCH(B6,A2:A5,0))", rule: required-function }
      - { formula: "=XLOOKUP(B6,A2:A5,B2:B5)", rule: value }
      - { formula: "=XLOOKUP(B6,A2:A5,D2:D5)", rule: value }
      - { formula: "=XLOOKUP(B6,A2:A5,C2:C5)+1/0", rule: value }
notes:
  summary: "VLOOKUP finds a key in the first column of a table and counts across to the answer column. XLOOKUP takes the search column and the answer column as two ranges."
  syntax: VLOOKUP(value, table, column, FALSE) · =XLOOKUP(value, search, return)
  example: '`=VLOOKUP("B",A1:C3,3,FALSE)` and `=XLOOKUP("B",A1:A3,C1:C3)` return the same column C value from the row that holds B.'
  commonErrors:
    - A SKU missing from the searched column returns #N/A. The formula works, but the product is not in the table.
    - A column number larger than the table's width makes VLOOKUP return #REF!.
