screens:
  - prompt: In B2, show TRUE when the note in A2 contains the word urgent, in any case. Use ISNUMBER and SEARCH.
    rows:
      - [Note, Urgent?]
      - [Please treat as URGENT - client waiting, null]
    answerCell: B2
    expected: true
    variants:
      - set: { A2: Routine reorder }
        expected: false
    answer: =ISNUMBER(SEARCH("urgent",A2))
    requiredFunctions:
      - ISNUMBER
      - SEARCH
    hints:
      nudge: SEARCH gives a number when found and an error when not; ISNUMBER turns that into TRUE or FALSE.
      rule: ISNUMBER(SEARCH("urgent",A2)) is TRUE whatever the case of the word.
    misses:
      value: The note mentions urgent, so B2 should show true.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for ISNUMBER and SEARCH.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =ISNUMBER(SEARCH("urgent",A2))
      - =ISNUMBER(SEARCH("URGENT",A2))
    reject:
      - formula: =ISNUMBER(FIND("urgent",A2))
        rule: required-function
      - formula: =SEARCH("urgent",A2)
        rule: required-function
      - formula: =ISNUMBER(SEARCH("urgent",A2)
        rule: syntax
