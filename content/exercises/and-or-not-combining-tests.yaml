      - [Bolt, 18]
      - [Nut, 22]
      - [Washer, 25]
      - [Screw, 30]
      - [Clip, 24]
      - [Pin, 31]
      - [Total, 150]
      - [Both tests, null]
    answerCell: B9
    expected: true
    variants:
      - { set: { B2: 13 }, expected: false }
      - { set: { B8: 100 }, expected: false }
      - { set: { B7: 14 }, expected: false }
      - { set: { B8: 101, B2: 15 }, expected: true }
    answer: =AND(B8>100,MIN(B2:B7)>=15)
    hints:
      nudge: Both tests must hold, and the smallest item tells you whether every item has at least 15.
      rule: AND returns TRUE only when every test inside it is TRUE. MIN gives the smallest value, so one test on MIN checks every item at once.
    misses:
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
      value: The total is 150 and the smallest item is 18, so both tests hold and the cell should say TRUE.
      syntax: "Check the brackets and commas. AND follows the pattern `=AND(logical1, [logical2], ...)`."
      reference: Read the total from B8 and the units from B2:B7.
