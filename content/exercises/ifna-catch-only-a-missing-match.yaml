notes:
  summary: "IFNA returns its first argument unless that argument is `#N/A`, and then it returns the second. A lookup that finds nothing gives `#N/A`, so IFNA catches a missing match and lets other errors show."
  syntax: "IFNA(value, value_if_na) replaces #N/A and nothing else"
  example: '`=IFNA(MATCH("Z",A1:A3,0),"none")` gives none when Z is not in A1:A3, but `=IFNA(1/0,"none")` still shows `#DIV/0!`.'
  commonErrors:
    - Without IFNA, a code that is not in the table leaves `#N/A` in B9.
    - A misspelt name such as IFNAA gives `#NAME?`.
    - The fourth argument is set to TRUE or left out, so an approximate match answers 32 for Q-9 and the fallback never fires.
