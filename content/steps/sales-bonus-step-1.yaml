    requiredFunctions:
      - IF
    hints:
      nudge: Test whether B2 is over 5000.
      rule: IF(B2>5000,100,0) gives 100 above the target and 0 at or below it.
    misses:
      value: Ana's bonus is 100. Her sales are over 5,000.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for IF.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =IF(B2>5000,100,0)
      - =IF(B2<=5000,0,100)
    reject:
      - formula: =IF(B2<5000,100,0)
        rule: value
      - formula: =100
