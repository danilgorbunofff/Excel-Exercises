level: 3
title: Variance to budget by cost centre
topic: interview-finance-analyst
pro: true
updated: 2026-11-15
checkedInExcel: null
screens:
  - prompt: Spend lines are in A and B, and the budget for each cost centre is in D and E. In F2, show Sales actual spend minus its budget.
    rows:
      - [Cost centre, Spend, null, Centre, Budget, Variance]
      - [Sales, 4200, null, Sales, 9000, null]
      - [IT, 3100, null, IT, 6000, null]
      - [Sales, 5300, null, HR, 2500, null]
      - [HR, 1400, null, null, null, null]
      - [IT, 2600, null, null, null, null]
      - [HR, 900, null, null, null, null]
    answerCell: F2
    expected: 500
    answer: =SUMIFS(B2:B7,A2:A7,D2)-E2
    requiredFunctions: [SUMIFS]
    hints:
      nudge: Add up the Sales spend lines first, then take the Sales budget away.
      rule: SUMIFS adds the spend where the cost centre matches D2. Subtract the budget in E2 after it, so overspends come out positive.
    misses:
      value: Sales spent 4200 and 5300, which is 9500. Against a budget of 9000 that is 500 over.
      syntax: "Check the brackets and commas. SUMIFS follows the pattern `=SUMIFS(sum_range, criteria_range1, criteria1, ...)`."
      required-function: Only the Sales lines count, so the spend needs SUMIFS with a condition.
      reference: Point at the budget in E2 rather than typing it, so a new budget flows through.
    accept:
      - =SUMIFS(B2:B7,A2:A7,D2)-E2
      - =sumifs(b2:b7,a2:a7,d2)-e2
      - =SUMIFS(B2:B7,A2:A7,"Sales")-E2
      - =SUMIFS($B$2:$B$7,$A$2:$A$7,$D2)-$E2
      - =-(E2-SUMIFS(B2:B7,A2:A7,D2))
    reject:
      - { formula: "=E2-SUMIFS(B2:B7,A2:A7,D2)", rule: value }
      - { formula: "=SUMIFS(B2:B7,A2:A7,D2)", rule: value }
      - { formula: "=SUMIFS(B2:B7,A2:A7,D3)-E2", rule: value }
      - { formula: "=SUM(B2:B7)-E2", rule: required-function }
      - { formula: "=SUMIFS(B2:B7,A2:A7,D2)-9000", rule: reference }
      - { formula: "=SUMIFS(B2:B7,A2:A7,D2-E2", rule: syntax }
  - prompt: In F3, show the IT variance as a share of the IT budget, rounded to three decimal places.
    rows:
      - [Cost centre, Spend, null, Centre, Budget, Variance]
      - [Sales, 4200, null, Sales, 9000, null]
      - [IT, 3100, null, IT, 6000, null]
      - [Sales, 5300, null, HR, 2500, null]
      - [HR, 1400, null, null, null, null]
      - [IT, 2600, null, null, null, null]
      - [HR, 900, null, null, null, null]
    answerCell: F3
    expected: -0.05
    answer: =ROUND((SUMIFS(B2:B7,A2:A7,D3)-E3)/E3,3)
    requiredFunctions: [SUMIFS, ROUND]
    hints:
      nudge: Work out the IT variance as before, then divide it by the IT budget and round.
      rule: A variance share is the variance divided by the budget. ROUND with 3 as its second argument keeps three decimal places.
    misses:
      value: IT spent 5700 against 6000, which is 300 under. 300 is 0.05 of the budget, so the share is minus 0.05.
      syntax: "Check the brackets and commas. ROUND follows the pattern `=ROUND(number, num_digits)`."
      required-function: The IT spend needs SUMIFS, and the share is rounded with ROUND for reporting.
      reference: The IT budget is in E3, on the same row as the IT label in D3.
    accept:
      - =ROUND((SUMIFS(B2:B7,A2:A7,D3)-E3)/E3,3)
      - =round((sumifs(b2:b7,a2:a7,d3)-e3)/e3,3)
      - =ROUND((SUMIFS(B2:B7,A2:A7,"IT")-E3)/E3,3)
      - =ROUND(SUMIFS(B2:B7,A2:A7,D3)/E3-1,3)
      - =ROUND((SUMIFS($B$2:$B$7,$A$2:$A$7,$D3)-$E3)/$E3,3)
    reject:
      - { formula: "=ROUND((SUMIFS(B2:B7,A2:A7,D3)-E3)/SUMIFS(B2:B7,A2:A7,D3),3)", rule: value }
      - { formula: "=ROUND(SUMIFS(B2:B7,A2:A7,D3)-E3,3)", rule: value }
      - { formula: "=ROUND((E3-SUMIFS(B2:B7,A2:A7,D3))/E3,3)", rule: value }
      - { formula: "=ROUND((SUMIFS(B2:B7,A2:A7,D2)-E2)/E2,3)", rule: value }
      - { formula: "=(SUMIFS(B2:B7,A2:A7,D3)-E3)/E3", rule: required-function }
      - { formula: "=ROUND((SUMIFS(B2:B7,A2:A7,D3)-E3)/E3,3", rule: syntax }
notes:
  summary: A variance by cost centre adds up the actual lines with SUMIFS, then compares them with the budget. Dividing by the budget turns the amount into a share that can be compared across centres.
  syntax: SUMIFS(spend,centres,centre)-budget, then ROUND(variance/budget,3)
  example: '`=SUMIFS(B1:B4,A1:A4,"IT")-500` with IT spend of 300 and 250 gives 50 over budget.'
  commonErrors:
    - Subtracting the actual from the budget flips the sign, so overspends look like savings.
    - Dividing by the actual instead of the budget gives a different share.
    - A cost centre typed with a trailing space does not match, so its spend drops out of the total.
