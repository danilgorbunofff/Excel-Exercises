screens:
  - prompt: In H2, find the code of the product named in H1. The codes are left of the names. Use INDEX and MATCH.
    rows:
      - [Code, Product, Category, Price, Stock, null, Product, Chair]
      - [P-101, Desk lamp, Lighting, 24, 14, null, Code, null]
      - [P-102, Chair, Seating, 89, 6, null, null, null]
      - [P-103, Shelf, Storage, 45, 9, null, null, null]
      - [P-104, Rug, Decor, 120, 3, null, null, null]
      - [P-105, Mirror, Decor, 60, 11, null, null, null]
      - [P-106, Stool, Seating, 35, 22, null, null, null]
      - [P-107, Floor lamp, Lighting, 75, 5, null, null, null]
      - [P-108, Cabinet, Storage, 210, 2, null, null, null]
    answerCell: H2
    expected: P-102
    variants:
      - set: { H1: Rug }
        expected: P-104
      - set: { H1: Cabinet }
        expected: P-108
    answer: =INDEX(A2:A9,MATCH(H1,B2:B9,0))
    requiredFunctions:
      - INDEX
      - MATCH
    hints:
      nudge: INDEX can return from any column, left or right of where MATCH searches.
      rule: MATCH searches the names, and INDEX can return from any column, the code column included.
    misses:
      value: The Chair's code is P-102.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for INDEX and MATCH.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =INDEX(A2:A9,MATCH(H1,B2:B9,0))
      - =INDEX($A$2:$A$9,MATCH($H$1,$B$2:$B$9,0))
    reject:
      - formula: =INDEX(A2:A9,MATCH(H1,B2:B9,1))
        rule: value
      - formula: =XLOOKUP(H1,B2:B9,A2:A9)
        rule: required-function
      - formula: ="P-102"
        rule: required-function
      - formula: =INDEX(A2:A9,MATCH(H1,B2:B9,0)
        rule: syntax
