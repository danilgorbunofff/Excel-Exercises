id: match-find-a-position
slug: match-find-a-position
level: 2
title: "MATCH: find a value's position"
topic: index-match
updated: 2026-11-16
checkedInExcel: 2026-11-16
screens:
  - prompt: In B7, find the position of the month in B6 within A2:A5, counting the first row as 1.
    rows:
      - [Month, Units]
      - [Jan, 120]
      - [Feb, 180]
      - [Mar, 150]
      - [Apr, 210]
      - [Which month?, Mar]
      - [Position, null]
    answerCell: B7
    expected: 3
    answer: =MATCH(B6,A2:A5,0)
    requiredFunctions: [MATCH]
    hints:
      nudge: "You want the month's place in the list, not the units beside it."
      rule: "MATCH returns the position of a value within a range, counting the first cell as 1. A match type of 0 asks for an exact match."
    misses:
      value: Jan is 1, Feb is 2, Mar is 3. Counting starts at the top of A2:A5, not the top of the sheet.
      syntax: "Check the brackets, commas and quote marks. MATCH follows the pattern `=MATCH(lookup_value, lookup_array, [match_type])`."
      required-function: MATCH returns the month's position in the list. Returning the units beside it is INDEX's job.
      reference: Take the month from B6. With Mar typed into the formula, checking April means editing the formula instead of B6.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =MATCH(B6,A2:A5,0)
      - =match(b6,a2:a5,0)
      - =MATCH($B$6,$A$2:$A$5,0)
      - =MATCH(B6,A2:A5,0)+0
      - =MATCH(B6,A2:A5,0)*1
      - =MATCH(B6,A2:A5,0)/1
    reject:
      - { formula: "=MATCH(B6,A2:A5,0", rule: syntax }
      - { formula: "=MATCH(B6,A2:A5)", rule: value }
      - { formula: "=MATCH(B6,A2:A5,1)", rule: value }
      - { formula: "=MATCH(B6,A2:A5,0)+1", rule: value }
      - { formula: "=MATCH(B6,A2:A3,0)", rule: value }
    variants:
      - { set: { B6: Apr }, expected: 4 }
notes:
  summary: "MATCH returns the position of a value within a range, counting the first cell as 1. With a match type of 0 it looks for an exact match."
  syntax: MATCH(lookup_value, lookup_array, [match_type])
  example: '`=MATCH("Mar",A1:A4,0)` with Jan, Feb, Mar and Apr gives 3.'
  commonErrors:
    - "When no cell in A2:A5 holds the month, MATCH returns `#N/A`."
    - "A searched range of several rows and columns returns `#N/A`, and a text match type returns `#VALUE!`."
    - Leaving out the match type means 1, which expects an ascending list. Months in calendar order are not sorted A to Z, so MATCH can return the wrong position.
