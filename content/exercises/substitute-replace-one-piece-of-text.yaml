notes:
  summary: SUBSTITUTE swaps one piece of text for another inside a string. With no fourth argument it changes every match, and with a number it changes only that occurrence.
  syntax: SUBSTITUTE(text,old,new,[instance]) swaps old for new everywhere, or at one instance
  example: '`=SUBSTITUTE("a.b.c",".","-",2)` gives a.b-c.'
  commonErrors:
    - The fourth argument is below 1 or is not a number, which names no occurrence to replace.
    - "SUBSTITUTE is misspelled, and Excel returns `#NAME?`."
    - An occurrence number past the end of the text returns the reference unchanged, and the grader sees an untouched answer.
