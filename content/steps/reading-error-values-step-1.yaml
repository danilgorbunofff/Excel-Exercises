id: reading-error-values-step-1
slug: reading-error-values-step-1
level: 1
title: Does the division fail
updated: 2026-11-25
checkedInExcel: 2026-11-25
parent: reading-error-values
step: 1
screens:
  - prompt: In D2, answer TRUE when dividing the cost in B2 by the units in C2 gives an error. Use ISERROR.
    rows:
      - [Item, Cost, Units, Fails?]
      - [Pads, 30, 0, null]
    answerCell: D2
    expected: true
    variants:
      - set: { C2: 6 }
        expected: false
      - set: { B2: n/a, C2: 6 }
        expected: true
    answer: =ISERROR(B2/C2)
    requiredFunctions:
      - ISERROR
    hints:
      nudge: ISERROR is TRUE for any error a formula produces.
      rule: ISERROR(B2/C2) is TRUE when the units are 0.
    misses:
      value: Dividing by 0 fails, so D2 should show true.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for ISERROR.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =ISERROR(B2/C2)
      - =ISERROR($B$2/$C$2)
      - =ISERROR(B2*(1/C2))
      - =ISERROR(B2/C2)=TRUE
    reject:
      - formula: =C2=0
        rule: required-function
      - formula: =ISERROR(B2/C2
        rule: syntax
