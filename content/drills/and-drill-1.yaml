id: and-drill-1
slug: and-drill-1
level: 1
title: Old enough and licensed
updated: 2026-11-17
checkedInExcel: 2026-11-17
function: AND
screens:
  - prompt: In D2, use AND to test that the age in B2 is 21 or more and C2 is "Yes".
    rows:
      - [Applicant, Age, Licence, Eligible]
      - [Ann, 24, Yes, null]
    answerCell: D2
    expected: true
    variants:
      - { set: { C2: No }, expected: false }
      - { set: { B2: 19 }, expected: false }
      - { set: { B2: 21 }, expected: true }
      - { set: { B2: 20 }, expected: false }
    answer: =AND(B2>=21,C2="Yes")
    requiredFunctions:
      - AND
    hints:
      nudge: AND takes several tests and is TRUE only when all of them are.
      rule: AND(test1,test2) returns TRUE when every test is true.
    misses:
      value: Ann is 24 and has a licence, so the result is TRUE.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for AND.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =AND(B2>=21,C2="Yes")
      - =AND(C2="Yes",B2>=21)
    reject:
      - formula: =OR(B2>=21,C2="Yes")
        rule: required-function
      - formula: =AND(B2>21,C2="Yes")
        rule: fragile
      - formula: =AND(B2>=21,C2="No")
        rule: value
      - formula: =AND(B2>=21,C2="Yes"
        rule: syntax
