      - [Red, 14, null, 16]
      - [Blue, 11, null, 13]
      - [Green, 9, null, 12]
      - [null, null, null, null]
      - [Total, null, null, null]
    answerCell: B6
    expected: 75
    variants:
      - set: { D3: 20 }
        expected: 82
    answer: =SUM(B2:B4,D2:D4)
    requiredFunctions:
      - SUM
    hints:
      nudge: SUM takes more than one range, separated by commas.
      rule: SUM takes several ranges separated by commas and adds them all in one formula.
    misses:
      value: March and April add up to 75. Include both B2:B4 and D2:D4.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for SUM.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =SUM(B2:B4,D2:D4)
      - =SUM(D2:D4,B2:B4)
      - =SUM(B2:D4)
    reject:
      - formula: =SUM(B2:B4)
        rule: value
      - formula: =B2+B3+B4+D2+D3+D4
