    variants:
      - set: { B2: 111244 }
        expected: 1100976
    answer: "=ROUND(AVERAGE(B2:B4)*12,0)"
    hints:
      nudge: Average the three months, then scale up to 12 months.
      rule: A run rate is the average month times 12.
    misses:
