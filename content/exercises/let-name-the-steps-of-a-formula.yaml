notes:
  summary: LET gives a name to a step of a formula. The step is worked out once, and the formula reads like a list of steps.
  syntax: "LET(name1, value1, [name2, value2, ...], calculation)"
  example: "`=LET(t,SUM(D2:D19),D2/t)` names the total t and divides by it."
  commonErrors:
    - Every name needs a value after it, and the last argument is the result.
    - A name cannot look like a cell address, so tax1 is not allowed.
    - "A name used before it is defined gives `#NAME?`."
