id: count-priced-orders
slug: count-priced-orders
level: 1
tier: 1
title: Count the priced orders
updated: 2026-11-17
checkedInExcel: 2026-11-17
screens:
  - prompt: In B8, count the orders that already have a price. Pending ones have no number yet.
    rows:
      - [Order, Price]
      - [A-101, 25]
      - [A-102, pending]
      - [A-103, 40]
      - [A-104, 15]
      - [A-105, pending]
      - [A-106, 32]
      - [Priced, null]
    answerCell: B8
    expected: 4
    variants:
      - set: { B3: 18 }
        expected: 5
    answer: "=COUNT(B2:B7)"
    hints:
      nudge: Count only the cells that hold a number.
      rule: COUNT counts cells with numbers and skips text such as pending.
    misses:
      value: 4 of the orders have a number in the Price column.
      reference: Point at the cells, so the result follows the data when it changes.
      syntax: Check the brackets, commas and quotes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - "=COUNT(B2:B7)"
      - "=count(b2:b7)"
      - "=COUNT(B7,B2:B6)"
    reject:
      - { formula: "=COUNTA(B2:B7)", rule: value }
      - { formula: "=COUNT(B2:B6)", rule: value }
      - { formula: "=COUNT(B2:B7", rule: syntax }
      - { formula: "=4", rule: reference }
