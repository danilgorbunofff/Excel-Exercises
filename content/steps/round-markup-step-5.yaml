    answer: =SUM(ROUND(B2:B16*C2:C16,2))
    requiredFunctions: []
    hints:
      nudge: Round each line first, then add the rounded lines.
      rule: ROUND can round the whole column of price times quantity to the cent at once; then SUM adds the rounded lines. Rounding only the total can differ by a cent or more.
    misses:
      value: The invoice comes to 81.17 when each line is rounded first.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =SUMPRODUCT(ROUND(B2:B16*C2:C16,2))
      - =SUM(ROUND(B2:B16*C2:C16,2))
    reject:
