    requiredFunctions:
      - COUNTBLANK
    hints:
      nudge: A missing essay is an empty mark.
      rule: COUNTBLANK(B2:B9) counts the students with no mark.
    misses:
      value: 3 essays are missing. Count the empty cells from B2 to B9.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for COUNTBLANK.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =COUNTBLANK(B2:B9)
      - =COUNTBLANK($B$2:$B$9)
    reject:
      - formula: =COUNT(B2:B9)
        rule: required-function
      - formula: =COUNTBLANK(B2:B7)
        rule: value
      - formula: =3
