id: vlookup-and-xlookup-on-the-same-table-step-2
slug: vlookup-and-xlookup-on-the-same-table-step-2
level: 1
title: Product name with XLOOKUP
updated: 2026-11-25
checkedInExcel: 2026-11-25
parent: vlookup-and-xlookup-on-the-same-table
step: 2
screens:
  - prompt: "In B7, return the same product name with XLOOKUP: the SKU in B6, the SKU column, the product column."
    rows:
      - [SKU, Product, Unit price]
      - [BX-210, Bracket, 2.4]
      - [CX-330, Clamp, 3.8]
      - [DX-410, Dowel, 1.15]
      - [EX-500, Extrusion, 9.6]
      - [Which SKU?, DX-410, null]
      - [Product, null, null]
    answerCell: B7
    expected: Dowel
    variants:
      - set: { B6: CX-330 }
        expected: Clamp
    answer: =XLOOKUP(B6,A2:A5,B2:B5)
    requiredFunctions:
      - XLOOKUP
    hints:
      nudge: "XLOOKUP needs no column number: just the column to return."
      rule: XLOOKUP(B6,A2:A5,B2:B5) returns the product from column B.
    misses:
      value: DX-410 is the Dowel.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for XLOOKUP.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =XLOOKUP(B6,A2:A5,B2:B5)
      - =XLOOKUP($B$6,$A$2:$A$5,$B$2:$B$5)
    reject:
      - formula: =XLOOKUP(B6,A2:A5,C2:C5)
        rule: value
      - formula: =VLOOKUP(B6,A2:C5,2,FALSE)
        rule: required-function
      - formula: ="Dowel"
        rule: required-function
      - formula: =XLOOKUP(B6,A2:A5,B2:B5
        rule: syntax
