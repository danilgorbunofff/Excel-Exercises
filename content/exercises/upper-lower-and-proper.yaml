notes:
  summary: UPPER makes every letter a capital, LOWER takes them all down, and PROPER capitalises the first letter of each word and lowers the rest. Each takes one piece of text and returns new text.
  syntax: UPPER(text) · =LOWER(text) · =PROPER(text)
  example: '`=PROPER("mARY ann")` gives Mary Ann, and `=LOWER("OK")` gives ok.'
  commonErrors:
    - Dividing the converted text by a number, as in `=UPPER(A2)/2`, returns #VALUE!.
    - "UPPER was typed with an extra letter, and Excel returns `#NAME?`."
    - PROPER on a code starts a new word after each hyphen, so the label comes out Ab-2291-Xk.
