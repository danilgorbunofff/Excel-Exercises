step: 5
screens:
  - prompt: In E2, what is the average price per unit, cost divided by units, across the rows where that can be worked out? Rows with no units or 0 units are left out.
    rows:
      - [Item, Cost, Units, null, Average per unit]
      - [Pens, 24, 8, null, null]
      - [Pads, 30, 0, null, null]
      - [Clips, 6, 40, null, null]
      - [Tape, 18, 6, null, null]
      - [Glue, 9, null, null, null]
      - [Files, 35, 10, null, null]
      - [Ink, 57, 3, null, null]
      - [Rulers, 20, 25, null, null]
      - [Labels, 15, 0, null, null]
      - [Staples, 11, 4, null, null]
      - [Markers, 29, 10, null, null]
      - [Erasers, 4, null, null, null]
      - [Binders, 42, 12, null, null]
      - [Folders, 13, 20, null, null]
      - [Notes, 22, 8, null, null]
    answerCell: E2
    expected: 3.81818181818
    variants:
      - set: { C3: 5 }
        expected: 4
      - set: { B2: 40 }
        expected: 4
    answer: =AVERAGE(IFERROR(B2:B16/C2:C16,""))
    requiredFunctions: []
    hints:
      nudge: Work out every row's price per unit, drop the ones that fail, then average.
      rule: IFERROR(B2:B16/C2:C16,"") turns each failed row into empty text, which AVERAGE skips. Using 0 instead would drag the average down.
    misses:
      value: The average price per unit is 3.82.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =AVERAGE(IFERROR(B2:B16/C2:C16,""))
      - =SUMPRODUCT(IFERROR(B2:B16/C2:C16,0))/COUNTIF(C2:C16,">0")
    reject:
      - formula: =AVERAGE(IFERROR(B2:B16/C2:C16,0))
        rule: value
      - formula: =SUM(B2:B16)/SUM(C2:C16)
        rule: value
      - formula: =3.81818181818
        rule: reference
      - formula: =AVERAGE(IFERROR(B2:B16/C2:C16,"")
        rule: syntax
