screens:
  - prompt: In B4, split the bill equally between the number of people in B3.
    rows:
      - [Dinner, Total]
      - [Bill, 186]
      - [People, 6]
      - [Each pays, null]
    answerCell: B4
    expected: 31
    variants:
      - set: { B2: 255 }
        expected: 42.5
    answer: "=B2/B3"
    hints:
      nudge: Divide the bill by the number of people.
      rule: Use / to divide. The total comes first, then the number of people.
    misses:
      value: 186 shared by 6 is 31 each.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - "=B2/B3"
      - "=b2/b3"
      - "=B2*(1/B3)"
      - "=(B2)/(B3)"
    reject:
      - { formula: "=B3/B2", rule: value }
      - { formula: "=B2*B3", rule: value }
      - { formula: "=31", rule: reference }
