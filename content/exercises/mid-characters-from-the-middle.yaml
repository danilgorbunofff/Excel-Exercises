notes:
  summary: MID reads a slice of text from the middle of a cell. You give it the text, the start position counted from 1, and how many characters to read.
  syntax: MID(text,start,num_chars) counts positions from 1 and reads num_chars characters
  example: '`=MID("ZX-5501",4,2)` gives 55.'
  commonErrors:
    - "A start below 1, or a start or length that is not a number, returns `#VALUE!`."
    - "The function is spelled MD or MIDD, and Excel returns `#NAME?`."
    - A start of 3 keeps the hyphen and returns -104.
