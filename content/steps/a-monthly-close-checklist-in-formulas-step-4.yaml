id: a-monthly-close-checklist-in-formulas-step-4
slug: a-monthly-close-checklist-in-formulas-step-4
level: 2
title: Ready within a tolerance
updated: 2026-11-25
checkedInExcel: 2026-11-25
parent: a-monthly-close-checklist-in-formulas
step: 4
screens:
  - prompt: In C2, show ready when the variance in B2 is within the tolerance in F1 either way, from minus F1 to F1, and check otherwise. Use IF and AND.
    rows:
      - [Check, Variance, Status, null, Tolerance, 5]
      - [VAT, -3, null, null, null, null]
    answerCell: C2
    expected: ready
    variants:
      - set: { B2: -7 }
        expected: check
      - set: { F1: 2 }
        expected: check
      - set: { B2: 5 }
        expected: ready
      - set: { B2: -5 }
        expected: ready
      - set: { B2: 9 }
        expected: check
    answer: =IF(AND(B2>=-$F$1,B2<=$F$1),"ready","check")
    requiredFunctions:
      - IF
      - AND
    hints:
      nudge: Within the tolerance either way means between minus F1 and F1.
      rule: A variance is within the tolerance either way when it is at least minus F1 and at most F1. Join the two tests with AND inside IF.
    misses:
      value: A variance of -3 is within 5, so C2 should show ready.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for IF and AND.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =IF(AND(B2>=-$F$1,B2<=$F$1),"ready","check")
      - =IF(AND(B2>=-F1,B2<=F1),"ready","check")
      - =IF(AND(-$F$1<=B2,B2<=$F$1),"ready","check")
      - =IF(AND(B2<=F1,B2>=-F1),"ready","check")
    reject:
      - formula: =IF(B2<=$F$1,"ready","check")
        rule: required-function
      - formula: =IF(AND(B2>-$F$1,B2<$F$1),"ready","check")
        rule: fragile
      - formula: =IF(AND(B2>=$F$1,B2<=-$F$1),"ready","check")
        rule: value
      - formula: ="ready"
        rule: required-function
      - formula: =IF(AND(B2>=-$F$1,B2<=$F$1),"ready","check"
        rule: syntax
