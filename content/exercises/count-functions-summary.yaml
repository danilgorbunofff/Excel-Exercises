id: count-functions-summary
slug: count-functions-summary
level: 3
title: Count functions summary
topic: counting
updated: 2026-11-17
checkedInExcel: 2026-11-17
screens:
  - prompt: In B10, count only the rows whose unit value is a number.
    rows:
      - [Item, Units]
      - [Bolt, 12]
      - [Nut, 8]
      - [Washer, null]
      - [Bolt, 5]
      - [Screw, n/a]
      - [Nut, 3]
      - [Bolt, 7]
      - [Washer, 4]
      - [Rows with a number, null]
    answerCell: B10
    expected: 6
    variants:
      - set: { B6: 9 }
        expected: 7
    answer: =COUNT(B2:B9)
    hints:
      nudge: Pick the count function that ignores text and blanks.
      rule: COUNT counts cells that hold numbers and skips text and empty cells. COUNTA counts every cell that is not empty, text included.
    misses:
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
      value: 6 rows hold a number. One cell is blank, one holds n/a, and neither is a number.
      syntax: "Check the brackets, commas and quote marks. COUNT follows the pattern `=COUNT(value1, [value2], ...)`."
      reference: Pass the units column from the grid rather than a typed list of quantities.
    accept:
      - =COUNT(B2:B9)
      - =count(b2:b9)
      - =COUNT($B$2:$B$9)
      - =COUNT(B2:B9)+0
      - =COUNT(B2:B9)*1
      - =COUNT(B$2:B$9)
    reject:
      - formula: =COUNTA(B2:B9)
        rule: value
      - formula: =COUNTA(A2:A9)
        rule: value
      - formula: =COUNT(A2:A9)
        rule: value
      - formula: =COUNT(B3:B9)
        rule: value
      - formula: =COUNT(B2:B9)/0
        rule: value
      - formula: =COUNT B2:B9
        rule: syntax
      - formula: =COUNT(B2:B9)+1
        rule: value
  - prompt: In B10, count the rows that have an item but no numeric unit value.
    rows:
      - [Item, Units]
      - [Bolt, 12]
      - [Nut, 8]
      - [Washer, null]
      - [Bolt, 5]
      - [Screw, n/a]
      - [Nut, 3]
      - [Bolt, 7]
      - [Washer, 4]
      - [Rows without one, null]
    answerCell: B10
    expected: 2
    variants:
      - set: { B6: 9 }
        expected: 1
    answer: =COUNTA(A2:A9)-COUNT(B2:B9)
    hints:
      nudge: Count every row with an item, then take away the rows that have a number.
      rule: COUNTA counts cells that are not empty, so it counts rows by their item name. COUNT counts only numbers, so the difference is the rows without one.
    misses:
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
      value: 8 items and 6 numbers leave 2 rows without a number.
      syntax: "Check the brackets, commas and quote marks. COUNTA follows the pattern `=COUNTA(value1, [value2], ...)`."
      reference: Count the items and the numbers from the grid rather than typing 8 or 6.
    accept:
      - =COUNTA(A2:A9)-COUNT(B2:B9)
      - =counta(a2:a9)-count(b2:b9)
      - =COUNTA($A$2:$A$9)-COUNT($B$2:$B$9)
      - =COUNTA(A2:A9)-COUNT(B2:B9)+0
      - =COUNTA(A2:A9)-COUNT(B2:B9)*1
      - =COUNTA(A$2:A$9)-COUNT(B$2:B$9)
    reject:
      - formula: =COUNT(B2:B9)
        rule: value
      - formula: =COUNTA(A2:A9)
        rule: value
      - formula: =COUNTA(B2:B9)-COUNT(B2:B9)
        rule: value
      - formula: =8-COUNT(B2:B9)
        rule: reference
      - formula: =COUNTA(A2:A9)-COUNT(A2:A9)
        rule: value
      - formula: =COUNTA(A2:A9)-COUNT(B2:B9)/0
        rule: value
      - formula: =COUNTA(A2:A9)-COUNT(B2:B9
        rule: syntax
notes:
  summary: COUNT counts the cells that hold numbers and passes over text and blanks. COUNTA counts every cell that is not empty.
  syntax: COUNT(range) counts numbers; =COUNTA(range) counts anything not empty
  example: "`=COUNTA(A1:A4)` with 5, n/a, 8 and an empty cell gives 3."
  commonErrors:
    - COUNTA over B2:B9 answers 7, because the n/a counts as a value.
    - COUNT over the item column, which holds only text, returns 0.
    - A misspelled name such as COUNTT is not a function, and Excel returns `#NAME?`.
