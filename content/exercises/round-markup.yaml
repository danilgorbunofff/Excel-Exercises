id: round-markup
slug: round-markup
level: 2
title: "ROUND: money to two decimals"
topic: rounding
updated: 2026-11-16
checkedInExcel: 2026-11-16
screens:
  - prompt: In B6, total the three costs, add an 8% markup, and round the result to 2 decimal places. Use SUM.
    rows:
      - [Item, Cost]
      - [Hosting, 1500.24]
      - [Support, 1120.5]
      - [Design, 1500]
      - [null, null]
      - [Total with 8% markup, null]
    answerCell: B6
    expected: 4450.4
    answer: =ROUND(SUM(B2:B4)*1.08,2)
    requiredFunctions: [ROUND, SUM]
    hints:
      nudge: Work out the marked-up total first, then round that whole result once.
      rule: ROUND takes a number and the count of decimals to keep. An 8% markup means multiplying by 1.08.
    misses:
      value: 4120.74 times 1.08 is 4450.3992, which rounds to 4450.4 at 2 decimal places. An 8% markup is 1.08, not 1.8.
      syntax: "Check the brackets, commas and quote marks. ROUND follows the pattern `=ROUND(number, num_digits)`."
      required-function: This task needs SUM for the costs and ROUND for the 2 decimal places.
      reference: Point at B2:B4, so a changed cost changes the total.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =ROUND(SUM(B2:B4)*1.08,2)
      - =round(sum($B$2:$B$4)*1.08,2)
      - =ROUND(SUM(B2,B3,B4)*1.08,2)
      - =ROUND(SUM(B2:B4)*108/100,2)
      - =ROUND(SUM(B2:B4)*1.08,2)+0
    reject:
      - { formula: =SUM(B2:B4)*1.08, rule: required-function }
      - { formula: =(1500.24+1120.5+1500)*1.08, rule: required-function }
      - { formula: "=ROUND(B2*1.08,2)", rule: required-function }
      - { formula: "=ROUND((1500.24+1120.5+1500)*1.08,2)", rule: required-function }
      - { formula: "=ROUND(SUM(1500.24,1120.5,1500)*1.08,2)", rule: reference }
      - { formula: "=ROUND(SUM(B2:B4),2)", rule: value }
      - { formula: "=ROUND(SUM(B2:B4)*1.8,2)", rule: value }
      - { formula: "=ROUND(SUM(B2:B4)*1.08,0)", rule: value }
      - { formula: "=ROUND(SUM(B2:B4)/1.08,2)", rule: value }
      - { formula: "=ROUND(SUM(B2:B4)*1.08,2)/0", rule: value }
      - { formula: "=ROUND(SUM(B2:B4)*1.08,2", rule: syntax }
    variants:
      - { set: { B2: 1120.5 }, expected: 4040.28 }
notes:
  summary: ROUND takes a number and the count of decimals to keep. Round the finished result once rather than each step along the way.
  syntax: ROUND(number, num_digits)
  example: "`=ROUND(10.456,2)` gives 10.46."
  commonErrors:
    - 'A second argument of text that is not a number, such as "two", returns `#VALUE!`.'
    - "A misspelt name such as ROUNDOF or ROUND_UP returns `#NAME?`."
    - Rounding each cost after the markup and then adding can give a different sum from rounding the total once.
