screens:
  - prompt: In F2, add up the spend of the department named in E2.
    rows:
      - [Order, Dept, Spend, null, null, null]
      - [P1, Sales, 320, null, Ops, null]
      - [P2, Ops, 145, null, null, null]
      - [P3, HR, 90, null, null, null]
      - [P4, Ops, 410, null, null, null]
      - [P5, Sales, 230, null, null, null]
      - [P6, Ops, 75, null, null, null]
      - [P7, HR, 160, null, null, null]
      - [P8, Ops, 205, null, null, null]
    answerCell: F2
    expected: 835
    variants:
      - set: { B2: Ops }
        expected: 1155
      - set: { C3: 199 }
        expected: 889
    answer: "=SUMIF(B2:B9,E2,C2:C9)"
    hints:
      nudge: Add the spend only on the rows for that department.
      rule: SUMIF(range to test, criteria, range to add).
    misses:
      value: The four Ops orders add up to 835.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
    accept:
      - "=SUMIF(B2:B9,E2,C2:C9)"
      - "=sumif(b2:b9,e2,c2:c9)"
      - "=SUMIFS(C2:C9,B2:B9,E2)"
      - '=SUMIF(B2:B9,"Ops",C2:C9)'
    reject:
      - { formula: "=SUM(C2:C9)", rule: value }
      - { formula: "=SUMIF(B2:B9,E2,A2:A9)", rule: value }
      - { formula: "=SUMIF(B2:B9,E2,C2:C9", rule: syntax }
      - { formula: "=835", rule: reference }
