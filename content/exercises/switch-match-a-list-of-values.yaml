id: switch-match-a-list-of-values
slug: switch-match-a-list-of-values
level: 2
title: "SWITCH: match a list of values"
topic: logic
updated: 2026-11-16
checkedInExcel: 2026-11-16
screens:
  - prompt: In D2, translate the code in A2 into the item it names, with Unknown as the fallback.
    rows:
      - [Code, Tier, Item, Answer]
      - [W-01, 2, Widget, null]
      - [G-02, 3, Gadget, null]
      - [S-03, 1, Screw, null]
      - [Lookup, null, null, null]
    answerCell: D2
    expected: Widget
    answer: =SWITCH(A2,"W-01","Widget","G-02","Gadget","S-03","Screw","Unknown")
    requiredFunctions: [SWITCH]
    hints:
      nudge: Match the code against each code in the list and give back the item paired with it.
      rule: SWITCH takes one value, then pairs of a match and a result, then an optional fallback. It returns the result beside the first exact match, and text goes in double quotes.
    misses:
      value: A2 is the first code in the list and its pair names Widget, so check every label and the spaces inside them.
      syntax: "=SWITCH(value, match 1, result 1, match 2, result 2, ..., fallback): one value, then pairs."
      required-function: Nothing here is counted or compared by size, only a code matched against a short list.
      reference: Read the code from A2 rather than typing W-01.
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
    accept:
      - =SWITCH(A2,"W-01","Widget","G-02","Gadget","S-03","Screw","Unknown")
      - =SWITCH(A2,"S-03","Screw","G-02","Gadget","W-01","Widget","Unknown")
      - =switch(a2,"W-01","Widget","G-02","Gadget","S-03","Screw","Unknown")
      - =SWITCH($A$2,"W-01","Widget","G-02","Gadget","S-03","Screw","Unknown")
    reject:
      - { formula: '=SWITCH(A2,"W-01","Gadget","G-02","Widget","Unknown")', rule: value }
      - { formula: '=SWITCH(A2,"W-01","Widget ","G-02","Gadget","Unknown")', rule: value }
      - { formula: '=IF(A2="W-01","Gadget","Widget")', rule: required-function }
      - { formula: '=SWITCH(A3,"W-01","Widget","G-02","Gadget","Unknown")', rule: value }
      - { formula: '=SWITCH(A2,"W-01","Widget","G-02","Gadget","Unknown")/0', rule: value }
      - { formula: '=SWITCH(A2 "W-01","Widget")', rule: syntax }
      - { formula: '=SWITCH(A2,"W-01","Widget","G-02","Gadget","Unknown")', rule: fragile }
      - { formula: '=switch(a2,"W-01","Widget","G-02","Gadget","Unknown")', rule: fragile }
      - { formula: '=SWITCH($A$2,"W-01","Widget","G-02","Gadget","Unknown")', rule: fragile }
      - { formula: '=SWITCH($A2,"W-01","Widget","G-02","Gadget","Unknown")', rule: fragile }
      - { formula: '=SWITCH(A$2,"W-01","Widget","G-02","Gadget","Unknown")', rule: fragile }
      - { formula: '=SWITCH(A2,"G-02","Gadget","W-01","Widget","Unknown")', rule: fragile }
    variants:
      - { set: { A2: S-03 }, expected: Screw }
      - { set: { A2: G-02 }, expected: Gadget }
  - prompt: "In D3, turn the tier number in B3 into its name: 1 Bronze, 2 Silver, 3 Gold."
    rows:
      - [Code, Tier, Item, Answer]
      - [W-01, 2, Widget, null]
      - [G-02, 3, Gadget, null]
      - [S-03, 1, Screw, null]
      - [Tier names, null, null, null]
    answerCell: D3
    expected: Gold
    answer: =SWITCH(B3,1,"Bronze",2,"Silver",3,"Gold","None")
    requiredFunctions: [SWITCH]
    hints:
      nudge: The tiers are numbers, so the matches are numbers too.
      rule: SWITCH compares the value with each match in turn and returns the result paired with it. A number matches only a number, so numeric matches need no quotes.
    misses:
      value: B3 holds 3, so the third pair returns Gold.
      syntax: "Check the brackets, commas and quote marks. SWITCH follows the pattern `=SWITCH(expression, value1, result1, [value2, result2], ..., [default])`."
      required-function: Three tiers are three pairs, which avoids a lookup range for three rows.
      reference: Match the tier in B3, a number, not the code beside it.
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
    accept:
      - =SWITCH(B3,1,"Bronze",2,"Silver",3,"Gold","None")
      - =switch(b3,1,"Bronze",2,"Silver",3,"Gold","None")
      - =SWITCH($B$3,1,"Bronze",2,"Silver",3,"Gold","None")
      - =SWITCH($B3,1,"Bronze",2,"Silver",3,"Gold","None")
      - =SWITCH(B$3,1,"Bronze",2,"Silver",3,"Gold","None")
      - =SWITCH(B3,1,"Bronze",2,"Silver",3,"Gold","Unknown")
    reject:
      - { formula: '=SWITCH(B3,1,"Bronze",2,"Silver",3,"Bronze","None")', rule: value }
      - { formula: '=SWITCH(B3,"1","Bronze","2","Silver","3","Gold","None")', rule: value }
      - { formula: '=IF(B3=3,"Bronze","Gold")', rule: required-function }
      - { formula: '=SWITCH(A3,1,"Bronze",2,"Silver",3,"Gold","None")', rule: value }
      - { formula: '=SWITCH(B3,1,"Bronze",2,"Silver",3,"Gold","None")/0', rule: value }
      - { formula: '=SWITCH(B3,1,"Bronze" 2,"Silver")', rule: syntax }
    variants:
      - { set: { B3: 2 }, expected: Silver }
      - { set: { B3: 1 }, expected: Bronze }
notes:
  summary: SWITCH takes one value, then pairs of a match and the result to give back. It compares the value with each match in turn and returns the result beside the first exact one.
  syntax: SWITCH(expression, value1, result1, value2, result2, ..., default)
  example: '`=SWITCH(A1,1,"Low",2,"High","Other")` with 2 in A1 gives High.'
  commonErrors:
    - No pair matched and no default was supplied, which is what a text match against a number produces.
    - A text result was used in arithmetic, or a pair is missing its result.
    - SWITCH is absent from the version of Excel in use, or the name is mistyped.
