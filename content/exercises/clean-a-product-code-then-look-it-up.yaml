id: clean-a-product-code-then-look-it-up
slug: clean-a-product-code-then-look-it-up
level: 3
title: Clean a product code, then look it up
topic: interview-data-analyst
updated: 2026-11-15
checkedInExcel: null
screens:
  - prompt: The imported codes have stray spaces and mixed case. In B2, clean the code in A2 so it has no spaces at either end and is all capitals.
    rows:
      - [Imported code, Clean code]
      - ["  ab-1027 ", null]
      - [cd-2210, null]
      - ["Ef-3301  ", null]
    answerCell: B2
    expected: AB-1027
    answer: =UPPER(TRIM(A2))
    requiredFunctions: [TRIM, UPPER]
    hints:
      nudge: Two jobs, one inside the other. Strip the spaces, then change the case.
      rule: TRIM removes spaces at the start and end. UPPER turns every letter into a capital. Either can go inside the other.
    misses:
      value: Without its spaces and in capitals, the code reads AB-1027.
      syntax: Check the brackets. Each function needs its own pair, one inside the other.
      required-function: The code needs both TRIM for the spaces and UPPER for the case.
      reference: Point at the imported code in A2.
    accept:
      - =UPPER(TRIM(A2))
      - =upper(trim(a2))
      - =TRIM(UPPER(A2))
      - =UPPER(TRIM($A2))
    reject:
      - { formula: "=TRIM(A2)", rule: required-function }
      - { formula: "=UPPER(A2)", rule: required-function }
      - { formula: "=LOWER(TRIM(A2))", rule: required-function }
      - { formula: "=UPPER(TRIM(A3))", rule: value }
      - { formula: "=UPPER(TRIM(A2)", rule: syntax }
  - prompt: The price list is in D and E. In B2, look up the price for the imported code in A2.
    rows:
      - [Imported code, Price, null, Code, List price]
      - ["  ab-1027 ", null, null, AB-1027, 12.4]
      - [cd-2210, null, null, CD-2210, 8.75]
      - ["Ef-3301  ", null, null, EF-3301, 15]
    answerCell: B2
    expected: 12.4
    answer: =XLOOKUP(TRIM(A2),$D$2:$D$4,$E$2:$E$4)
    requiredFunctions: [TRIM]
    hints:
      nudge: The lookup fails on the raw code because of its spaces. Clean it inside the lookup.
      rule: XLOOKUP ignores the case of letters, but not spaces. TRIM inside XLOOKUP looks up the clean code.
    misses:
      value: The clean code AB-1027 is on the first row of the price list, at 12.4.
      syntax: "Check the brackets and commas. The pattern is `=XLOOKUP(TRIM(code), codes, prices)`."
      required-function: The spaces stop the match, so the code needs TRIM before it is looked up.
      reference: Look up A2 in D2:D4 and return from E2:E4.
    accept:
      - =XLOOKUP(TRIM(A2),$D$2:$D$4,$E$2:$E$4)
      - =xlookup(trim(a2),d2:d4,e2:e4)
      - =XLOOKUP(UPPER(TRIM(A2)),$D$2:$D$4,$E$2:$E$4)
      - =VLOOKUP(TRIM(A2),$D$2:$E$4,2,FALSE)
      - =INDEX($E$2:$E$4,MATCH(TRIM(A2),$D$2:$D$4,0))
    reject:
      - { formula: "=XLOOKUP(A2,D2:D4,E2:E4)", rule: required-function }
      - { formula: "=XLOOKUP(TRIM(A2),D2:D4,D2:D4)", rule: value }
      - { formula: "=XLOOKUP(TRIM(A3),D2:D4,E2:E4)", rule: value }
      - { formula: "=VLOOKUP(TRIM(A2),D2:E4,1,FALSE)", rule: value }
      - { formula: "=XLOOKUP(TRIM(A2),D2:D4,E2:E4", rule: syntax }
notes:
  summary: Imported data often carries stray spaces and mixed case. Cleaning the key first is what makes a lookup across two systems find its match.
  syntax: UPPER(TRIM(code)), XLOOKUP(TRIM(code),codes,prices)
  example: '`=UPPER(TRIM(" ab-1 "))` gives AB-1.'
  commonErrors:
    - A space at the end of a code is invisible on screen and still stops a match.
    - TRIM removes extra spaces but leaves the case as it was.
    - Returning the code column instead of the price column gives back the code.
