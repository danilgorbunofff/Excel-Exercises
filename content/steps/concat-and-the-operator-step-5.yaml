id: concat-and-the-operator-step-5
slug: concat-and-the-operator-step-5
level: 3
title: Build a work email address
updated: 2026-11-25
checkedInExcel: 2026-11-25
parent: concat-and-the-operator
step: 5
screens:
  - prompt: In C2, what is this person's work email? It is the first letter of the first name, then the last name, all in lower case, then @acme.com.
    rows:
      - [First, Last, Email]
      - [Grace, Hopper, null]
    answerCell: C2
    expected: ghopper@acme.com
    variants:
      - set: { A2: Alan, B2: Turing }
        expected: aturing@acme.com
      - set: { A2: katherine, B2: JOHNSON }
        expected: kjohnson@acme.com
    answer: =LOWER(LEFT(A2,1)&B2)&"@acme.com"
    requiredFunctions: []
    hints:
      nudge: Take one letter of the first name, add the last name, lower-case it, then add the domain.
      rule: LEFT(A2,1)&B2 gives GHopper; LOWER turns it into ghopper; &"@acme.com" adds the domain.
    misses:
      value: The email is ghopper@acme.com.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =LOWER(LEFT(A2,1)&B2)&"@acme.com"
      - =LOWER(LEFT(A2,1)&B2&"@acme.com")
      - =CONCAT(LOWER(LEFT(A2,1)),LOWER(B2),"@acme.com")
    reject:
      - formula: =LEFT(A2,1)&B2&"@acme.com"
        rule: value
      - formula: =LOWER(A2&B2)&"@acme.com"
        rule: value
      - formula: ="ghopper@acme.com"
        rule: reference
      - formula: =LOWER(LEFT(A2,1)&B2)&"@acme.com",
        rule: syntax
