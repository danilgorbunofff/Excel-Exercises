id: averageif-drill-1
slug: averageif-drill-1
level: 1
title: Average sales for one region
updated: 2026-11-19
checkedInExcel: 2026-11-19
function: AVERAGEIF
screens:
  - prompt: In B9, use AVERAGEIF to find the average sales in B2:B8 for rows where the region in A2:A8 is "East".
    rows:
      - [Region, Sales]
      - [East, 400]
      - [West, 250]
      - [East, 310]
      - [North, 520]
      - [East, 190]
      - [West, 330]
      - [North, 450]
      - [East average, null]
    answerCell: B9
    expected: 300
    variants:
      - set: {A3: East}
        expected: 287.5
      - set: {B2: 100}
        expected: 200
      - set: {A8: East}
        expected: 337.5
    answer: =AVERAGEIF(A2:A8,"East",B2:B8)
    requiredFunctions:
      - AVERAGEIF
    hints:
      nudge: AVERAGEIF takes the range to test, the criteria, then the range to average.
      rule: AVERAGEIF(A2:A8,"East",B2:B8) averages the sales of the East rows only.
    misses:
      value: The three East rows average 300.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for AVERAGEIF.
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
    accept:
      - =AVERAGEIF(A2:A8,"East",B2:B8)
    reject:
      - formula: =AVERAGEIF(A2:A8,"West",B2:B8)
        rule: value
      - formula: =AVERAGE(B2:B8)
        rule: required-function
      - formula: =300
        rule: required-function
      - formula: =AVERAGEIF(A2:A8,"East",B2:B8
        rule: syntax
