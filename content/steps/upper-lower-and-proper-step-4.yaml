screens:
  - prompt: "In C2, write the name passport style: the first name in A2 with a capital first letter, a space, then the surname in B2 all in capitals. Use PROPER and UPPER."
    rows:
      - [First, Surname, Passport style]
      - [mARY, jackson, null]
    answerCell: C2
    expected: Mary JACKSON
    variants:
      - set: { A2: ALAN, B2: Turing }
        expected: Alan TURING
      - set: { B2: o'neil }
        expected: Mary O'NEIL
    answer: =PROPER(A2)&" "&UPPER(B2)
    requiredFunctions:
      - PROPER
      - UPPER
    hints:
      nudge: Fix each part on its own, then join them with a space between.
      rule: PROPER gives a word a capital first letter, and UPPER makes every letter a capital. Join the two with & and a space in quotes.
    misses:
      value: C2 should read Mary JACKSON.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for PROPER and UPPER.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =PROPER(A2)&" "&UPPER(B2)
      - =CONCAT(PROPER(A2)," ",UPPER(B2))
      - =TEXTJOIN(" ",TRUE,PROPER(A2),UPPER(B2))
      - =PROPER(A2)&" "&UPPER(PROPER(B2))
    reject:
      - formula: =UPPER(A2)&" "&UPPER(B2)
        rule: required-function
      - formula: =PROPER(A2)&UPPER(B2)
        rule: value
      - formula: =PROPER(A2&" "&B2)
        rule: required-function
      - formula: ="Mary JACKSON"
        rule: required-function
      - formula: =PROPER(A2)&" "&UPPER(B2
        rule: syntax
