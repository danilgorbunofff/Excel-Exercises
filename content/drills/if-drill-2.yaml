id: if-drill-2
slug: if-drill-2
level: 1
title: A bonus over a target
updated: 2026-11-17
checkedInExcel: 2026-11-17
function: IF
screens:
  - prompt: In C2, use IF to give a bonus of 5% of the sales in B2 when they are over 10000, and 0 otherwise.
    rows:
      - [Rep, Sales, Bonus]
      - [Ann, 12000, null]
    answerCell: C2
    expected: 600
    variants:
      - { set: { B2: 9000 }, expected: 0 }
      - { set: { B2: 15000 }, expected: 750 }
      - { set: { B2: 10000 }, expected: 0 }
      - { set: { B2: 10001 }, expected: 500.05 }
    answer: =IF(B2>10000,B2*0.05,0)
    requiredFunctions:
      - IF
    hints:
      nudge: The true result can be a calculation, such as B2*0.05.
      rule: IF(B2>10000,B2*0.05,0) pays 5% of all the sales once they pass the target, and 0 otherwise.
    misses:
      value: 12000 is over the target, so the bonus is 600.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for IF.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =IF(B2>10000,B2*0.05,0)
      - =IF(B2>10000,B2*5%,0)
      - =IF(B2<=10000,0,B2*0.05)
    reject:
      - formula: =B2*0.05
        rule: required-function
      - formula: =IF(B2>10000,0.05,0)
        rule: value
      - formula: =600
        rule: required-function
      - formula: =IF(B2>10000,B2*0.05,0
        rule: syntax
