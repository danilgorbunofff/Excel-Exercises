screens:
  - prompt: "In D2, work out each person's share of the bill: the bill in B2 divided by the people in C2. Round it up to the cent so the bill is always covered. Use ROUNDUP."
    rows:
      - [Dinner, Bill, People, Each pays]
      - [Team lunch, 187.45, 6, null]
    answerCell: D2
    expected: 31.25
    variants:
      - set: { C2: 7 }
        expected: 26.78
    answer: =ROUNDUP(B2/C2,2)
    requiredFunctions:
      - ROUNDUP
    hints:
      nudge: Divide first, then round up to 2 decimals.
      rule: ROUNDUP(B2/C2,2) rounds the share up to the next cent, so six shares never fall short of the bill.
    misses:
      value: Each person pays 31.25.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for ROUNDUP.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =ROUNDUP(B2/C2,2)
      - =ROUNDUP(B2/C2,2)+0
    reject:
      - formula: =ROUND(B2/C2,2)
        rule: required-function
      - formula: =ROUNDUP(B2/C2,0)
        rule: value
      - formula: =31.25
