id: concat-drill-2
slug: concat-drill-2
level: 1
title: Full name with a space
updated: 2026-11-17
checkedInExcel: 2026-11-17
function: CONCAT
screens:
  - prompt: In C2, use CONCAT to join the first name in A2, a space and the surname in B2.
    rows:
      - [First, Last, Result]
      - [Rosa, Diaz, null]
    answerCell: C2
    expected: Rosa Diaz
    variants:
      - set: { A2: Al, B2: Brook }
        expected: Al Brook
    answer: =CONCAT(A2," ",B2)
    requiredFunctions:
      - CONCAT
    hints:
      nudge: Put " " between the two names.
      rule: "CONCAT takes three arguments here: the first name, a space in quotes, then the surname."
    misses:
      value: With a space between them, the name reads Rosa Diaz.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for CONCAT.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =CONCAT(A2," ",B2)
      - =LET(v,A2,CONCAT(v," ",B2))
    reject:
      - formula: =CONCAT(A2,B2)
        rule: value
      - formula: =A2&" "&B2
        rule: required-function
      - formula: ="Rosa Diaz"
        rule: required-function
      - formula: =CONCAT(A2," ",B2
        rule: syntax
