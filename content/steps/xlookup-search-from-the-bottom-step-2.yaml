step: 2
screens:
  - prompt: In E2, return the latest status logged for the ticket in E1, searching from the bottom. Use XLOOKUP.
    rows:
      - [Ticket, Status, null, Ticket, T-7]
      - [T-7, Opened, null, Latest, null]
      - [T-8, Opened, null, null, null]
      - [T-7, In progress, null, null, null]
      - [T-9, Opened, null, null, null]
      - [T-8, Closed, null, null, null]
      - [T-7, Waiting, null, null, null]
    answerCell: E2
    expected: Waiting
    variants:
      - set: { E1: T-8 }
        expected: Closed
    answer: =XLOOKUP(E1,A2:A7,B2:B7,,0,-1)
    requiredFunctions:
      - XLOOKUP
    hints:
      nudge: The sixth part of XLOOKUP, -1, searches from the last row up.
      rule: Leave the fourth part empty, give 0 for an exact match as the fifth and -1 as the sixth, so XLOOKUP searches from the last row up.
    misses:
      value: T-7's latest status is Waiting.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for XLOOKUP.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =XLOOKUP(E1,A2:A7,B2:B7,,0,-1)
      - =XLOOKUP(E1,A2:A7,B2:B7,"",0,-1)
    reject:
      - formula: =XLOOKUP(E1,A2:A7,B2:B7)
        rule: value
      - formula: ="Waiting"
        rule: required-function
      - formula: =XLOOKUP(E1,A2:A7,B2:B7,,0,-1
        rule: syntax
