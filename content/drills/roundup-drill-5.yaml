id: roundup-drill-5
slug: roundup-drill-5
level: 2
title: Trucks for a week of loads
updated: 2026-11-17
checkedInExcel: 2026-11-17
function: ROUNDUP
screens:
  - prompt: In B9, use ROUNDUP and SUM to find how many trucks carry the loads in B2:B6 when each truck takes the tonnes in B8.
    rows:
      - [Day, Tonnes]
      - [Mon, 12]
      - [Tue, 9]
      - [Wed, 15]
      - [Thu, 7]
      - [Fri, 11]
      - [null, null]
      - [Per truck, 10]
      - [Trucks, null]
    answerCell: B9
    expected: 6
    variants:
      - set: { B3: 6 }
        expected: 6
      - set: { B8: 18 }
        expected: 3
    answer: =ROUNDUP(SUM(B2:B6)/B8,0)
    requiredFunctions:
      - ROUNDUP
      - SUM
    hints:
      nudge: Add the loads, divide by the truck size, then round up.
      rule: ROUNDUP(SUM(range)/size,0) gives whole trucks.
    misses:
      value: 54 tonnes at 10 a truck need 6 trucks.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for ROUNDUP and SUM.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =ROUNDUP(SUM(B2:B6)/B8,0)
    reject:
      - formula: =ROUND(SUM(B2:B6)/B8,0)
        rule: required-function
      - formula: =ROUNDUP(SUM(B2:B5)/B8,0)
        rule: value
      - formula: =6
        rule: required-function
      - formula: =ROUNDUP(SUM(B2:B6)/B8,0
        rule: syntax
