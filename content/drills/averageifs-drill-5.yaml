id: averageifs-drill-5
slug: averageifs-drill-5
level: 2
title: Rounded average for one region
updated: 2026-11-17
checkedInExcel: 2026-11-17
function: AVERAGEIFS
screens:
  - prompt: In B9, use ROUND and AVERAGEIFS to find the average East sales in B2:B8, rounded to one decimal place.
    rows:
      - [Region, Sales]
      - [East, 400]
      - [West, 250]
      - [East, 310]
      - [North, 520]
      - [East, 195]
      - [West, 330]
      - [North, 450]
      - [East average, null]
    answerCell: B9
    expected: 301.7
    variants:
      - set: { B2: 401 }
        expected: 302
      - set: { A3: East }
        expected: 288.8
    answer: =ROUND(AVERAGEIFS(B2:B8,A2:A8,"East"),1)
    requiredFunctions:
      - AVERAGEIFS
      - ROUND
    hints:
      nudge: Put the AVERAGEIFS inside ROUND, and round to 1 decimal place.
      rule: ROUND(AVERAGEIFS(...),1) rounds the average to one decimal place.
    misses:
      value: The East average is 301.67, which rounds to 301.7.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for AVERAGEIFS and ROUND.
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
    accept:
      - =ROUND(AVERAGEIFS(B2:B8,A2:A8,"East"),1)
    reject:
      - formula: =AVERAGEIFS(B2:B8,A2:A8,"East")
        rule: required-function
      - formula: =ROUND(AVERAGEIFS(B2:B8,A2:A8,"East"),0)
        rule: value
      - formula: =301.7
        rule: required-function
      - formula: =ROUND(AVERAGEIFS(B2:B8,A2:A8,"East"),1
        rule: syntax
