id: switch-drill-4
slug: switch-drill-4
level: 2
title: Grades with SWITCH and TRUE
updated: 2026-11-17
checkedInExcel: 2026-11-17
function: SWITCH
screens:
  - prompt: In C2, use SWITCH with TRUE to give "A" for 80 or more, "B" for 60 or more, and "C" otherwise.
    rows:
      - [Student, Score, Grade]
      - [Ann, 64, null]
    answerCell: C2
    expected: B
    variants:
      - { set: { B2: 90 }, expected: A }
      - { set: { B2: 30 }, expected: C }
      - { set: { B2: 80 }, expected: A }
      - { set: { B2: 59 }, expected: C }
      - { set: { B2: 60 }, expected: B }
      - { set: { B2: 79 }, expected: B }
    answer: =SWITCH(TRUE,B2>=80,"A",B2>=60,"B","C")
    requiredFunctions:
      - SWITCH
    hints:
      nudge: SWITCH(TRUE,...) returns the result of the first test that is TRUE.
      rule: With TRUE as the first argument, each value is a test. Put the highest band first.
    misses:
      value: 64 is under 80 but at least 60, so the grade is B.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for SWITCH.
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
    accept:
      - =SWITCH(TRUE,B2>=80,"A",B2>=60,"B","C")
    reject:
      - formula: =IFS(B2>=80,"A",B2>=60,"B",TRUE,"C")
        rule: required-function
      - formula: =SWITCH(TRUE,B2>=60,"B",B2>=80,"A","C")
        rule: fragile
      - formula: ="B"
        rule: required-function
      - formula: =SWITCH(TRUE,B2>=80,"A",B2>=60,"B","C"
        rule: syntax
