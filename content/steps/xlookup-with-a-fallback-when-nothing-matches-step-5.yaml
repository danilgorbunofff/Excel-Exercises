screens:
  - prompt: In E6, what does the order in D2 to E4 cost? Column D holds SKUs and column E quantities. A SKU not in the price list counts as 0.
    rows:
      - [SKU, Price, null, SKU, Qty]
      - [TX-101, 19.99, null, TX-102, 4]
      - [TX-102, 14, null, TX-109, 2]
      - [TX-103, 9.5, null, TX-101, 1]
      - [TX-104, 32, null, null, null]
      - [null, null, null, Total, null]
    answerCell: E6
    expected: 75.99
    variants:
      - { set: { D3: TX-104 }, expected: 139.99 }
      - { set: { E2: 6 }, expected: 103.99 }
      - { set: { D2: TX-109, A2: TX-102 }, expected: 0 }
    answer: =XLOOKUP(D2,A2:A5,B2:B5,0)*E2+XLOOKUP(D3,A2:A5,B2:B5,0)*E3+XLOOKUP(D4,A2:A5,B2:B5,0)*E4
    requiredFunctions: []
    hints:
      nudge: Look up each SKU with a fallback of 0, multiply by its quantity, and add.
      rule: "The fallback 0 stops one unknown SKU from turning the whole total into #N/A."
    misses:
      value: The order costs 75.99.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =XLOOKUP(D2,A2:A5,B2:B5,0)*E2+XLOOKUP(D3,A2:A5,B2:B5,0)*E3+XLOOKUP(D4,A2:A5,B2:B5,0)*E4
      - =SUMPRODUCT(XLOOKUP(D2:D4,A2:A5,B2:B5,0),E2:E4)
    reject:
      - formula: =XLOOKUP(D2,A2:A5,B2:B5,0)*E2
        rule: value
      - formula: =XLOOKUP(D2,A2:A5,B2:B5)*E2+XLOOKUP(D3,A2:A5,B2:B5)*E3+XLOOKUP(D4,A2:A5,B2:B5)*E4
        rule: value
      - formula: =75.99
        rule: reference
      - formula: =XLOOKUP(D2,A2:A5,B2:B5,0)*E2+XLOOKUP(D3,A2:A5,B2:B5,0)*E3+XLOOKUP(D4,A2:A5,B2:B5,0)*E4,
        rule: syntax
