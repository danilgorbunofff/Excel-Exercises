id: mode-the-most-common-value-step-2
slug: mode-the-most-common-value-step-2
level: 1
title: The most common score along a row
updated: 2026-11-25
checkedInExcel: 2026-11-25
parent: mode-the-most-common-value
step: 2
screens:
  - prompt: In I2, find the rating given most often, from B2 to H2. Use MODE.
    rows:
      - [Day, Mon, Tue, Wed, Thu, Fri, Sat, Sun, Most common]
      - [Rating, 4, 5, 4, 3, 4, 5, 2, null]
    answerCell: I2
    expected: 4
    variants:
      - set: { B2: 5, D2: 5 }
        expected: 5
    answer: =MODE(B2:H2)
    requiredFunctions:
      - MODE
    hints:
      nudge: MODE works along a row too.
      rule: MODE(B2:H2) gives the rating that appears most often in the week.
    misses:
      value: The most common rating is 4.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for MODE.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =MODE(B2:H2)
      - =mode(b2:h2)
    reject:
      - formula: =MAX(B2:H2)
        rule: required-function
      - formula: =4
        rule: required-function
      - formula: =MODE(B2:H2
        rule: syntax
