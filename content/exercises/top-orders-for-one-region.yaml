    answer: '=TAKE(SORT(FILTER(C2:D19,B2:B19="East"),2,-1),3)'
    hints:
      nudge: "Three steps: keep the East rows, order them by amount, keep the top three."
      rule: "Nest the steps from the inside out: FILTER the rows, SORT the result by its second column with -1, then TAKE the first three rows."
    misses:
      value: The largest East orders are Cy for 1300, Cy for 540 and Gus for 380.
      syntax: "Build it from the inside: `FILTER(...)`, then `SORT(that,2,-1)`, then `TAKE(that,3)`."
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - '=TAKE(SORT(FILTER(C2:D19,B2:B19="East"),2,-1),3)'
      - '=TAKE(SORTBY(FILTER(C2:D19,B2:B19="East"),FILTER(D2:D19,B2:B19="East"),-1),3)'
      - '=take(sort(filter(c2:d19,b2:b19="east"),2,-1),3)'
      - '=TAKE(SORT(FILTER($C$2:$D$19,$B$2:$B$19="East"),2,-1),3)'
      - '=FILTER(TAKE(SORT(FILTER(C2:D19,B2:B19="East"),2,-1),3),SEQUENCE(3)>0)'
    reject:
