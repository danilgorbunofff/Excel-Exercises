id: sumifs-two-conditions-at-once
slug: sumifs-two-conditions-at-once
level: 2
title: "SUMIFS: two conditions at once"
topic: conditions
updated: 2026-11-16
checkedInExcel: 2026-11-16
screens:
  - prompt: In C7, total the North amounts Ada sold with a function that takes two conditions.
    rows:
      - [Region, Rep, Amount]
      - [North, Ada, 320]
      - [South, Ben, 250]
      - [North, Cleo, 180]
      - [West, Dev, 300]
      - [North, Ada, 400]
      - ["North, Ada total", null, null]
    answerCell: C7
    expected: 720
    answer: =SUMIFS(C2:C6,A2:A6,"North",B2:B6,"Ada")
    requiredFunctions: [SUMIFS]
    hints:
      nudge: One function can take the amounts to add, then a condition on the region and another on the rep.
      rule: SUMIFS takes the range to add first, then pairs of range and condition. It adds a row only when every condition holds.
    misses:
      value: Ada's North sales are 320 in row 2 and 400 in row 6, so the total is 720. Nothing else matches both conditions.
      syntax: "Check the brackets, commas and quote marks. SUMIFS follows the pattern `=SUMIFS(sum_range, criteria_range1, criteria1, ...)`."
      required-function: Use SUMIFS. SUMIF takes one condition, and SUMIFS takes several, with the sum range first.
      reference: Point at the region and rep columns in the grid rather than typing the names into the formula.
    accept:
      - =SUMIFS(C2:C6,A2:A6,"North",B2:B6,"Ada")
      - =sumifs(c2:c6,a2:a6,"north",b2:b6,"ada")
      - =SUMIFS($C$2:$C$6,$A$2:$A$6,"North",$B$2:$B$6,"Ada")
      - =SUMIFS(C2:C6,A2:A6,"North",B2:B6,"Ada")+0
      - =SUMIFS(C2:C6,A2:A6,"North",B2:B6,"Ada")*1
      - =SUMIFS(C$2:C$6,A$2:A$6,"North",B$2:B$6,"Ada")
    reject:
      - { formula: '=SUMIF(A2:A6,"North",C2:C6)', rule: required-function }
      - { formula: '=SUMIFS(C2:C6,A2:A6,"North")', rule: value }
      - { formula: '=SUMIFS(C2:C6,A2:A6,"North",B2:B6,"Cleo")', rule: value }
      - { formula: '=SUMIFS(C3:C6,A3:A6,"North",B3:B6,"Ada")', rule: value }
      - { formula: '=SUMIFS(C2:C6,A2:A6,"North",B2:B6,"Ada")/0', rule: value }
      - { formula: '=SUMIFS(C2:C6,A2:A6,"North",B2:B6 "Ada")', rule: syntax }
      - { formula: =SUMPRODUCT((A2:A6="North")*(B2:B6="Ada")*C2:C6), rule: required-function }
  - prompt: In C7, total the shipped orders that came to more than 200.
    rows:
      - [Product, Status, Amount]
      - [Widget, Shipped, 320]
      - [Gadget, Pending, 250]
      - [Widget, Shipped, 180]
      - [Gadget, Shipped, 300]
      - [Widget, Pending, 400]
      - [Shipped over 200, null, null]
    answerCell: C7
    expected: 620
    answer: =SUMIFS(C2:C6,B2:B6,"Shipped",C2:C6,">200")
    requiredFunctions: [SUMIFS]
    hints:
      nudge: The amount column is both the range to add and the range tested against 200.
      rule: SUMIFS can test the same column it adds. A comparison condition goes in double quotes, with the sign before the number.
    misses:
      value: Only two shipped orders clear 200, at 320 and 300, which total 620.
      syntax: "Check the brackets, commas and quote marks. SUMIFS follows the pattern `=SUMIFS(sum_range, criteria_range1, criteria1, ...)`."
      required-function: SUMIF takes one condition. Use SUMIFS, which takes both the status and the amount test.
      reference: Point the second condition at the amount column so the threshold is compared against real cells.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =SUMIFS(C2:C6,B2:B6,"Shipped",C2:C6,">200")
      - =sumifs(c2:c6,b2:b6,"shipped",c2:c6,">200")
      - =SUMIFS($C$2:$C$6,$B$2:$B$6,"Shipped",$C$2:$C$6,">200")
      - =SUMIFS(C2:C6,B2:B6,"Shipped",C2:C6,">200")+0
      - =SUMIFS(C2:C6,B2:B6,"Shipped",C2:C6,">200")*1
      - =SUMIFS(C$2:C$6,B$2:B$6,"Shipped",C$2:C$6,">200")
    reject:
      - { formula: '=SUMIF(B2:B6,"Shipped",C2:C6)', rule: required-function }
      - { formula: '=SUMIFS(C2:C6,B2:B6,"Shipped")', rule: value }
      - { formula: '=SUMIFS(C2:C6,B2:B6,"Pending",C2:C6,">200")', rule: value }
      - { formula: '=SUMIFS(C2:C6,B2:B6,"Shipped",C2:C6,"<200")', rule: value }
      - { formula: '=SUMIFS(C3:C6,B3:B6,"Shipped",C3:C6,">200")', rule: value }
      - { formula: '=SUMIFS(C2:C6,B2:B6,"Shipped",C2:C6,">200")/0', rule: value }
      - { formula: '=SUMIFS(C2:C6,B2:B6,"Shipped" C2:C6,">200")', rule: syntax }
    variants:
      - { set: { C2: 200 }, expected: 300 }
notes:
  summary: SUMIFS adds the cells in one range whose rows meet every condition you set. It takes the range to add first, then pairs of range and condition.
  syntax: SUMIFS(sum_range, criteria_range1, criteria1, [criteria_range2, criteria2], ...)
  example: '`=SUMIFS(C1:C3,A1:A3,"North",B1:B3,"Ada")` with North Ada 10, North Ben 20 and North Ada 5 gives 15.'
  commonErrors:
    - A criteria range of a different size from the sum range returns #VALUE!. Every range in the call needs the same number of rows and columns.
    - "The function is typed as SUMIF, which takes its arguments in another order: range, condition, sum range."
    - SUMIFS joins conditions with AND. Two tests that exclude each other, such as Shipped and Open on one column, never both hold for one row, so the answer is 0.
