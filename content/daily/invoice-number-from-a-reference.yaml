id: invoice-number-from-a-reference
slug: invoice-number-from-a-reference
level: 2
tier: 5
title: Invoice number from a reference
updated: 2026-11-16
checkedInExcel: 2026-11-16
screens:
  - prompt: In B2, take the four-digit number between the two dashes in the reference in A2.
    rows:
      - [Reference, Number]
      - [INV-2041-B, null]
    answerCell: B2
    expected: "2041"
    answer: '=MID(A2,FIND("-",A2)+1,4)'
    hints:
      nudge: Find the first dash, then take four characters after it.
      rule: MID(text, start, length). FIND gives the position of the dash, so the number starts one place later.
    misses:
      value: The number between the dashes is 2041.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
    accept:
      - '=MID(A2,FIND("-",A2)+1,4)'
      - '=mid(a2,find("-",a2)+1,4)'
      - '=MID(A2,SEARCH("-",A2)+1,4)'
      - "=MID(A2,5,4)"
    reject:
      - formula: =MID(A2,FIND("-",A2),4)
        rule: value
      - formula: =RIGHT(A2,4)
        rule: value
      - formula: =MID(A2,FIND("-",A2)+1,4
        rule: syntax
      - formula: ="2041"
        rule: reference
