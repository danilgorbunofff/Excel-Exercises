    answer: "=COUNTA(UNIQUE(B2:B13))"
    hints:
      nudge: Make a list with each customer once, then count it.
      rule: UNIQUE returns each value once, ignoring case. COUNTA or ROWS counts the list it returns.
    misses:
      value: "There are 7 different customers: Acme, Brio, Cobb, Dart, Elm, Fern and Gale."
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - "=COUNTA(UNIQUE(B2:B13))"
      - "=counta(unique(b2:b13))"
      - "=ROWS(UNIQUE(B2:B13))"
