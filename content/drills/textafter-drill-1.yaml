id: textafter-drill-1
slug: textafter-drill-1
level: 1
title: The domain of an email
updated: 2026-11-17
checkedInExcel: 2026-11-17
function: TEXTAFTER
screens:
  - prompt: In B2, use TEXTAFTER to take the part of the email in A2 after "@".
    rows:
      - [Email, Result]
      - [rosa.diaz@example.com, null]
    answerCell: B2
    expected: example.com
    variants:
      - set: { A2: al@shop.org }
        expected: shop.org
    answer: =TEXTAFTER(A2,"@")
    requiredFunctions:
      - TEXTAFTER
    hints:
      nudge: TEXTAFTER takes the text, then the delimiter.
      rule: TEXTAFTER(A2,"@") returns everything after the at sign.
    misses:
      value: After the at sign is example.com.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for TEXTAFTER.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =TEXTAFTER(A2,"@")
    reject:
      - formula: =TEXTBEFORE(A2,"@")
        rule: required-function
      - formula: =TEXTAFTER(A2,".")
        rule: value
      - formula: ="example.com"
        rule: required-function
      - formula: =TEXTAFTER(A2,"@"
        rule: syntax
