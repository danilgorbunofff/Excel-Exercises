id: and-drill-5
slug: and-drill-5
level: 2
title: Pass both parts or resit
updated: 2026-11-17
checkedInExcel: 2026-11-17
function: AND
screens:
  - prompt: In D2, use IF and AND to show "Pass" when both B2 and C2 are 50 or more, and "Resit" otherwise.
    rows:
      - [Student, Theory, Practical, Result]
      - [Ann, 64, 48, null]
    answerCell: D2
    expected: Resit
    variants:
      - { set: { C2: 55 }, expected: Pass }
      - { set: { B2: 40 }, expected: Resit }
      - { set: { B2: 50, C2: 50 }, expected: Pass }
      - { set: { B2: 49, C2: 50 }, expected: Resit }
      - { set: { C2: 49 }, expected: Resit }
    answer: =IF(AND(B2>=50,C2>=50),"Pass","Resit")
    requiredFunctions:
      - AND
      - IF
    hints:
      nudge: Both marks must reach 50, so the test is an AND.
      rule: IF(AND(B2>=50,C2>=50),pass,resit) passes only when both parts do.
    misses:
      value: The practical mark is 48, under 50, so the result is Resit.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for AND and IF.
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
    accept:
      - =IF(AND(B2>=50,C2>=50),"Pass","Resit")
    reject:
      - formula: =IF(B2>=50,"Pass","Resit")
        rule: required-function
      - formula: =IF(AND(B2>=50,C2>=50),"Resit","Pass")
        rule: value
      - formula: ="Resit"
        rule: required-function
      - formula: =IF(AND(B2>=50,C2>=50),"Pass","Resit"
        rule: syntax
