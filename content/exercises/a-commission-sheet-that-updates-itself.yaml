screens:
  - prompt: In C2, pay the first seller their sales times the tier rate those sales reach.
    rows:
      - [Seller, Sales, Commission]
      - [Ana, 4200, null]
      - [Bo, 1800, null]
      - [Cy, 9000, null]
      - [null, null, null]
      - [Tier, Rate, null]
      - [0, 0.02, null]
      - [2000, 0.03, null]
      - [4000, 0.05, null]
    answerCell: C2
    expected: 210
    answer: =ROUND(B2*VLOOKUP(B2,$A$7:$B$9,2,TRUE),2)
    requiredFunctions: [VLOOKUP]
    hints:
      nudge: Look up the rate the sales figure reaches in the tier table, then multiply the sales by it.
      rule: VLOOKUP with TRUE as its last argument finds the largest tier floor that is not above the value and returns the rate beside it. The floors must be sorted from smallest to largest.
    misses:
      value: 4200 sits in the five per cent band, and five per cent of 4200 is 210.
      syntax: "Check the brackets, commas and quote marks. ROUND follows the pattern `=ROUND(number, num_digits)`."
      required-function: The rate comes from the table below the data, so read it there.
      reference: Start from the sales figure in B2.
    accept:
      - =ROUND(B2*VLOOKUP(B2,$A$7:$B$9,2,TRUE),2)
      - =round(b2*vlookup(b2,$a$7:$b$9,2,true),2)
      - =VLOOKUP(B2,$A$7:$B$9,2,TRUE)*B2
      - =VLOOKUP(B2,$A$7:$B$9,2,1)*B2
      - =B2*VLOOKUP($B$2,$A$7:$B$9,2,1)
      - =ROUND( B2 * VLOOKUP( B2 , $A$7:$B$9 , 2 , TRUE ) , 2 )
    reject:
      - { formula: =B2*0.05, rule: required-function }
      - { formula: "=B2*VLOOKUP(B2,$A$7:$B$9,1,TRUE)", rule: value }
      - { formula: "=ROUND(B2*VLOOKUP(B2,$A$7:$B$9,2,TRUE),2)*0.1", rule: value }
      - { formula: "=B2*VLOOKUP(B2,$A$7:$B$9,2,FALSE)", rule: value }
      - { formula: "=ROUND(B3*VLOOKUP(B3,$A$7:$B$9,2,TRUE),2)", rule: value }
      - { formula: "=ROUND(B2*VLOOKUP B2,$A$7:$B$9,2,TRUE),2", rule: syntax }
  - prompt: In C2, report the rate the first seller's sales figure has reached as a decimal.
    rows:
      - [Seller, Sales, Rate]
      - [Ana, 4200, null]
      - [Bo, 1800, null]
      - [Cy, 9000, null]
      - [null, null, null]
      - [Tier, Rate, null]
      - [0, 0.02, null]
      - [2000, 0.03, null]
      - [4000, 0.05, null]
    answerCell: C2
    expected: 0.05
    answer: =VLOOKUP(B2,$A$7:$B$9,2,TRUE)
    requiredFunctions: [VLOOKUP]
    hints:
      nudge: The rate sits in the second column of the tier table, beside the floor the sales have passed.
      rule: VLOOKUP takes the value to find, the table, the column number to return and the match type. TRUE matches the largest floor at or below the value.
    misses:
      value: 4200 is past the 4000 floor, so the band pays 0.05.
      syntax: Check the brackets, commas and quote marks. VLOOKUP follows the pattern `=VLOOKUP(lookup_value, table_array, col_index_num, [range_lookup])`.
      required-function: Column two holds the rates; column one holds the tier floors.
      reference: The sales figure is in B2.
    accept:
      - =VLOOKUP(B2,$A$7:$B$9,2,TRUE)
      - =vlookup(b2,$a$7:$b$9,2,true)
      - =VLOOKUP($B$2,$A$7:$B$9,2,TRUE)
      - =VLOOKUP(B$2,$A$7:$B$9,2,1)
      - =VLOOKUP( B2 , $A$7:$B$9 , 2 , TRUE )
      - =VLOOKUP(B2,$A$7:$B$9,2,1)
    reject:
      - { formula: =B2*0.05, rule: required-function }
      - { formula: "=VLOOKUP(B2,$A$7:$B$9,1,TRUE)", rule: value }
      - { formula: "=VLOOKUP(B3,$A$7:$B$9,2,TRUE)", rule: value }
      - { formula: "=VLOOKUP(B2,$A$7:$B$9,2,FALSE)", rule: value }
      - { formula: "=VLOOKUP(B2,$A$7:$B$9,3,TRUE)", rule: value }
      - { formula: "=VLOOKUP B2,$A$7:$B$9,2,TRUE", rule: syntax }
notes:
  summary: VLOOKUP with TRUE as its fourth argument does an approximate match. It stops at the largest tier floor the value has reached and returns the rate beside it, so the floors must be sorted.
  syntax: sales*VLOOKUP(sales,tiers,2,TRUE) reads the rate the sales figure has reached
  example: "`=VLOOKUP(2500,A1:B3,2,TRUE)` with floors 0, 2000 and 4000 in A1:A3 and rates 0.02, 0.03 and 0.05 in B1:B3 gives 0.03."
  commonErrors:
    - The fourth argument is FALSE, so VLOOKUP looks for a row equal to 4200 and finds none.
    - The column number points past the second column of the rate table.
    - The tier floors are out of order, so TRUE stops at the wrong floor and reads the wrong rate.
