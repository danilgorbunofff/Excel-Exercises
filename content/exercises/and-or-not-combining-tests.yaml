notes:
  summary: AND, OR and NOT take logical tests and return a single TRUE or FALSE. AND needs every argument to hold and OR needs one, while NOT flips the value it is given.
  syntax: AND(test1, test2, ...) needs every test; =OR(...) needs one; =NOT(test) flips it
  example: "`=AND(A1>0,A2>0)` with 5 and -2 gives FALSE, while `=OR(A1>0,A2>0)` gives TRUE."
  commonErrors:
    - A text value is typed where a logical test belongs, so AND returns `#VALUE!`.
    - A function name is mistyped, and Excel returns `#NAME?`.
    - A formula holding a single comparison looks complete but skips the second condition, so a short item still passes.
