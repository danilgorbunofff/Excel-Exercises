id: floor-drill-4
slug: floor-drill-4
level: 2
title: FLOOR on a negative number
updated: 2026-11-17
checkedInExcel: 2026-11-17
function: FLOOR
screens:
  - prompt: In C2, use FLOOR to round the change in B2 down to a multiple of 1. Note which way a negative number moves.
    rows:
      - [Week, Change, Rounded]
      - [W1, -2.5, null]
    answerCell: C2
    expected: -3
    variants:
      - set: { B2: 2.5 }
        expected: 2
      - set: { B2: -0.2 }
        expected: -1
    answer: =FLOOR(B2,1)
    requiredFunctions:
      - FLOOR
    hints:
      nudge: FLOOR moves down the number line, even for a negative number.
      rule: FLOOR always moves to the smaller multiple, which for a negative number is further from zero.
    misses:
      value: -2.5 goes down the number line, to -3.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for FLOOR.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =FLOOR(B2,1)
    reject:
      - formula: =ROUNDDOWN(B2,0)
        rule: required-function
      - formula: =FLOOR(B2,2)
        rule: value
      - formula: =-3
        rule: required-function
      - formula: =FLOOR(B2,1
        rule: syntax
