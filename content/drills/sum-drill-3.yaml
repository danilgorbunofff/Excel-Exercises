id: sum-drill-3
slug: sum-drill-3
level: 1
title: Total a row across quarters
updated: 2026-11-17
checkedInExcel: 2026-11-17
function: SUM
screens:
  - prompt: In F2, use SUM to add North's 4 quarters in B2:E2.
    rows:
      - [Region, Q1, Q2, Q3, Q4, Year]
      - [North, 210, 185, 240, 260, null]
      - [South, 190, 205, 230, 215, null]
    answerCell: F2
    expected: 895
    variants:
      - set: { C2: 300 }
        expected: 1010
    answer: =SUM(B2:E2)
    requiredFunctions:
      - SUM
    hints:
      nudge: This time the range runs along a row.
      rule: A row range works like a column range. Give SUM the first and last quarter's cells with a colon between them, and it adds the 4 cells.
    misses:
      value: North's year is 895. Add only row 2, from B to E.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for SUM.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =SUM(B2:E2)
    reject:
      - formula: =SUM(B2:D2)
        rule: value
      - formula: =SUM(B2:E3)
        rule: value
      - formula: =895
        rule: required-function
      - formula: =SUM(B2:E2
        rule: syntax
