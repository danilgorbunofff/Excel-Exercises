        expected: grace@navy.mil
    answer: =LOWER(A2)
    requiredFunctions:
      - LOWER
    hints:
      nudge: LOWER changes every letter to lower case.
      rule: LOWER changes every letter to lower case and leaves numbers and symbols as they are.
    misses:
      value: The tidy email is ada.lovelace@engines.co.uk.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for LOWER.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =LOWER(A2)
      - =lower(a2)
      - "=LOWER(LOWER(A2))"
      - '=LOWER(A2)&""'
      - '=LOWER(A2)&""'
    reject:
      - formula: =PROPER(A2)
        rule: required-function
      - formula: ="ada.lovelace@engines.co.uk"
