id: trial-balance-lookup-and-check
slug: trial-balance-lookup-and-check
level: 3
title: Trial balance lookup and check
topic: interview-accounting
pro: true
updated: 2026-11-15
checkedInExcel: null
screens:
  - prompt: The chart of accounts is in F and G. In D2, show the account name for the code in A2.
    rows:
      - [Code, Debit, Credit, Name, null, Chart code, Chart name]
      - [4000, 0, 86000, null, null, 1200, Trade debtors]
      - [1200, 24500, 0, null, null, 2100, Trade creditors]
      - [5000, 51300, 0, null, null, 4000, Sales]
      - [2100, 0, 18200, null, null, 5000, Cost of sales]
      - [1000, 28400, 0, null, null, 1000, Bank]
    answerCell: D2
    expected: Sales
    answer: =XLOOKUP(A2,$F$2:$F$6,$G$2:$G$6)
    hints:
      nudge: Find the code from A2 in the chart code column, then read the name beside it.
      rule: XLOOKUP takes the value to find, the column to search and the column to return. Lock the chart ranges so the formula fills down.
    misses:
      value: Code 4000 sits on the third row of the chart, beside Sales.
      syntax: "Check the brackets and commas. XLOOKUP follows the pattern `=XLOOKUP(lookup_value, lookup_array, return_array)`."
      reference: Look up A2 in F2:F6 and return from G2:G6.
    accept:
      - =XLOOKUP(A2,$F$2:$F$6,$G$2:$G$6)
      - =xlookup(a2,f2:f6,g2:g6)
      - =VLOOKUP(A2,$F$2:$G$6,2,FALSE)
      - =INDEX($G$2:$G$6,MATCH(A2,$F$2:$F$6,0))
    reject:
      - { formula: "=XLOOKUP(A2,G2:G6,F2:F6)", rule: value }
      - { formula: "=XLOOKUP(A3,F2:F6,G2:G6)", rule: value }
      - { formula: "=XLOOKUP(A2,F2:F6,F2:F6)", rule: value }
      - { formula: "=VLOOKUP(A2,F2:G6,1,FALSE)", rule: value }
      - { formula: "=XLOOKUP(A2,F2:F6,G2:G6", rule: syntax }
  - prompt: In D2, show Balanced when total debits equal total credits and Check when they do not.
    rows:
      - [Code, Debit, Credit, Check]
      - [4000, 0, 86000, null]
      - [1200, 24500, 0, null]
      - [5000, 51300, 0, null]
      - [2100, 0, 18200, null]
      - [1000, 28400, 0, null]
    answerCell: D2
    expected: Balanced
    answer: =IF(SUM(B2:B6)=SUM(C2:C6),"Balanced","Check")
    requiredFunctions: [IF, SUM]
    hints:
      nudge: Total each column, then compare the two totals inside an IF.
      rule: IF returns its second argument when the test is true and its third when it is false. The test is the debit total equals the credit total.
    misses:
      value: Debits are 24500, 51300 and 28400, which is 104200. Credits are 86000 and 18200, also 104200, so the balance holds.
      syntax: "Check the brackets, commas and quote marks. IF follows the pattern `=IF(logical_test, value_if_true, value_if_false)`."
      required-function: The answer is a word, so the comparison of the two SUM totals sits inside an IF.
      reference: The debits run down B2:B6 and the credits down C2:C6.
    accept:
      - =IF(SUM(B2:B6)=SUM(C2:C6),"Balanced","Check")
      - =if(sum(b2:b6)=sum(c2:c6),"Balanced","Check")
      - =IF(SUM(B2:B6)<>SUM(C2:C6),"Check","Balanced")
      - =IF(SUM(B2:B6)-SUM(C2:C6)=0,"Balanced","Check")
    reject:
      - { formula: '=IF(SUM(B2:B5)=SUM(C2:C6),"Balanced","Check")', rule: value }
      - { formula: '=IF(SUM(B2:B6)<>SUM(C2:C6),"Balanced","Check")', rule: value }
      - { formula: '=IF(SUM(B2:B6)=SUM(C2:C6),"Check","Balanced")', rule: value }
      - { formula: "=SUM(B2:B6)-SUM(C2:C6)", rule: required-function }
      - { formula: '=IF(SUM(B2:B6)=SUM(C2:C6),"Balanced","Check"', rule: syntax }
notes:
  summary: A trial balance lists every account with its debit or credit. The names come from the chart of accounts, and the two columns must add up to the same total.
  syntax: XLOOKUP(code,chart_codes,chart_names) and IF(SUM(debits)=SUM(credits),"Balanced","Check")
  example: '`=IF(SUM(A1:A3)=SUM(B1:B3),"Balanced","Check")` gives Balanced when both columns add up to the same total.'
  commonErrors:
    - Swapping the search and return columns looks up a name in the code column.
    - A range one row short leaves out an account and the check fails.
    - Codes stored as text in one table and numbers in the other do not match.
