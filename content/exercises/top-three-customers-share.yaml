screens:
  - prompt: In E2, show what share of revenue comes from the three biggest customers, as a percentage rounded to one decimal place.
    rows:
      - [Customer, Revenue, null, null, null]
      - [Arden, 42000, null, null, null]
      - [Brook, 18500, null, null, null]
      - [Calder, 67300, null, null, null]
      - [Dene, 9200, null, null, null]
      - [Esk, 31800, null, null, null]
      - [Frome, 54100, null, null, null]
      - [Garry, 12600, null, null, null]
      - [Hull, 23400, null, null, null]
      - [Isis, 7900, null, null, null]
      - [Jed, 15200, null, null, null]
    answerCell: E2
    expected: 57.9
    variants:
      - { set: { B8: 70000 }, expected: 56.4 }
      - { set: { B4: 30000 }, expected: 52.3 }
      - { set: { B11: 67300 }, expected: 56.5 }
    answer: "=ROUND(SUM(TAKE(SORT(B2:B11,1,-1),3))/SUM(B2:B11)*100,1)"
    hints:
      nudge: Add the three largest revenues, then divide by the total.
      rule: LARGE(range, k) gives the k-th largest value, or SORT with TAKE gives the top rows. Divide their sum by the whole and multiply by 100.
    misses:
      value: The top three bring 163400 of 282000, which is 57.9 per cent.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
    accept:
      - "=ROUND(SUM(TAKE(SORT(B2:B11,1,-1),3))/SUM(B2:B11)*100,1)"
      - "=round(sum(take(sort(b2:b11,1,-1),3))/sum(b2:b11)*100,1)"
      - "=ROUND((LARGE(B2:B11,1)+LARGE(B2:B11,2)+LARGE(B2:B11,3))/SUM(B2:B11)*100,1)"
      - "=ROUND(SUMPRODUCT((B2:B11>=LARGE(B2:B11,3))*B2:B11)/SUM(B2:B11)*100,1)"
    reject:
      - { formula: "=ROUND(MAX(B2:B11)/SUM(B2:B11)*100,1)", rule: value }
      - { formula: "=ROUND((B4+B7+B2)/SUM(B2:B11)*100,1)", rule: fragile }
      - { formula: "=ROUND(SUM(TAKE(SORT(B2:B11,1,-1),3))/SUM(B2:B11)*100,1", rule: syntax }
      - { formula: "=57.9", rule: reference }
notes:
  summary: Customer concentration is the share of revenue from the biggest few customers. LARGE, or SORT with TAKE, finds them however the list is ordered.
  syntax: "SUM(TAKE(SORT(revenue,1,-1),3)) / SUM(revenue)"
  example: "`=LARGE(B2:B11,1)+LARGE(B2:B11,2)+LARGE(B2:B11,3)` adds the top three."
  commonErrors:
    - Adding the three cells you can see breaks when the figures change.
    - Dividing by the top three instead of the whole gives 100.
    - SORT needs -1 to put the largest first.
