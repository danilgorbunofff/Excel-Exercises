id: largest-sale
slug: largest-sale
level: 1
title: Find the largest sale
topic: totals
updated: 2026-11-16
checkedInExcel: 2026-11-16
screens:
  - prompt: In B7, find the largest sale. Use MAX.
    rows:
      - [Rep, Sale]
      - [Ivy, 1250]
      - [Raj, 980]
      - [Mo, 860]
      - [Lena, 1175]
      - [Tom, 1430]
      - [Largest, null]
    answerCell: B7
    expected: 1430
    answer: =MAX(B2:B6)
    requiredFunctions: [MAX]
    hints:
      nudge: One function returns the biggest number in a range.
      rule: MAX returns the largest number in a range. MIN returns the smallest.
    misses:
      syntax: Write the range as the first cell, a colon, then the last cell.
      required-function: This exercise asks for MAX. MIN returns the smallest sale.
      reference: Point at the sales in B2:B6 rather than typing them, and stop the range above B7.
      value: Check that the range includes every sale, down to B6.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =MAX(B2:B6)
      - =max(B2:B6)
      - =MAX(B6,B2:B5)
    reject:
      - { formula: "=MAX(B2:B6", rule: syntax }
      - { formula: "=MIN(B2:B6)", rule: required-function }
      - { formula: "=MAX(1250,980,860,1175,1430)", rule: reference }
      - { formula: "=MAX(B2:B7)", rule: reference }
      - { formula: "=MAX(B2:B5)", rule: value }
    variants:
      - { set: { B2: 1713 }, expected: 1713 }
notes:
  summary: MAX returns the largest number in its arguments. It skips text and empty cells in a range.
  syntax: MAX(number1, [number2], ...)
  example: "`=MAX(A1:A3)` with 4, 9 and 2 gives 9."
  commonErrors:
    - A range that stops short can miss the largest value.
