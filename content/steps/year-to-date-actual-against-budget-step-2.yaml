        expected: 124500
    answer: =SUMIF(A2:A13,"<="&D2,B2:B13)
    requiredFunctions:
      - SUMIF
    hints:
      nudge: 'Build the test from D2: "<="&D2.'
      rule: SUMIF(A2:A13,"<="&D2,B2:B13) follows the months closed as the year goes on.
    misses:
      value: The actual to date is 168600.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for SUMIF.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =SUMIF(A2:A13,"<="&D2,B2:B13)
      - =SUMIF($A$2:$A$13,"<="&$D$2,$B$2:$B$13)
    reject:
