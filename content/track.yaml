# The one order of exercises. The catalogue, the numbering, the Next button
# and any free set all read this list. Nothing else orders exercises.
# Draft order by prerequisite: each topic uses only what earlier topics teach.
# The owner sets the final order by moving lines in this file.
topics:
  - slug: references
    title: Cells and arithmetic
    summary: Point at cells, then add, subtract, multiply and use brackets.
    group: essentials
    learn:
      - Point a formula at a cell by its address
      - Add, subtract and multiply values from different cells
      - Use brackets to control the order of a calculation
      - Work out a price after a percentage discount
  - slug: totals
    title: SUM, AVERAGE, MIN and MAX
    summary: Total a column, and find its average, largest and smallest values.
    group: essentials
    learn:
      - Add up a whole column with one function
      - Find the average of a range
      - Pick out the largest and smallest values
      - Write a range as first cell, colon, last cell
  - slug: counting
    title: COUNT, COUNTA and COUNTBLANK
    summary: Count numbers, filled cells and empty cells.
    group: skill
    learn:
      - Count the cells that hold numbers
      - Count every filled cell, text included
      - Count the empty cells in a range
      - Turn a count into a share of the total
  - slug: logic
    title: IF, AND and OR
    summary: Show a result that depends on a test.
    group: skill
    learn:
      - Show one result or another with IF
      - Test two conditions at once with AND
      - Accept either of two conditions with OR
      - Return text or numbers from a test
  - slug: conditions
    title: COUNTIF, SUMIF and SUMIFS
    summary: Count and add only the rows that match a condition.
    group: skill
    learn:
      - Count the rows that match one condition
      - Count values above a limit
      - Add only the rows for one region
      - Add the rows that meet two conditions
  - slug: rounding
    title: ROUND, ROUNDUP and MROUND
    summary: Round money and quantities the way the task asks for.
    group: skill
    learn:
      - Round a price to two decimal places
      - Round always up or always down
      - Round to the nearest multiple, such as 5
      - Round down to a whole pack or crate
  - slug: statistics
    title: LARGE, SMALL, MEDIAN, MODE and RANK
    summary: Pick the second highest, the middle, the most common and a rank.
    group: skill
    learn:
      - Find the second highest or lowest value
      - Find the middle value of a list
      - Find the value that comes up most often
      - Rank a value without sorting the list
  - slug: lookups
    title: XLOOKUP, VLOOKUP, INDEX and MATCH
    summary: Find a value in a table from a code or a name.
    group: skill
    learn:
      - Find a price from a product code with XLOOKUP
      - Read a value from a table with VLOOKUP
      - Look up a band with an approximate match
      - Combine INDEX and MATCH for a flexible lookup
  - slug: index-match
    title: INDEX and MATCH
    summary: Find a position, read a cell by row and column, then combine the two.
    group: skill
    learn:
      - Find the position of a value with MATCH
      - Read a value at a row and column with INDEX
      - Combine INDEX and MATCH for any lookup
      - Look up by row and column at once
  - slug: text-search
    title: LEFT, MID, FIND and SEARCH
    summary: Cut text by position, and find where a piece of text starts.
    group: skill
    learn:
      - Take characters from the start, middle or end
      - Count the characters in a cell
      - Find where a piece of text starts
      - Split a code at a delimiter
  - slug: text-change
    title: CONCAT, TEXTJOIN and SUBSTITUTE
    summary: Join text, change its case and swap one piece for another.
    group: skill
    learn:
      - Join cells with CONCAT or the & operator
      - Join a range and skip the blanks
      - Change text to upper, lower or proper case
      - Replace one piece of text with another
  - slug: errors
    title: IFERROR, IFNA and error values
    summary: Read what an error means, and show your own text instead.
    group: skill
    learn:
      - Show your own text when a formula fails
      - Catch only a missing match with IFNA
      - Tell #N/A, #VALUE! and #REF! apart
      - Choose which error to catch
  - slug: dates
    title: DATE, DAYS and DATEDIF
    summary: Build dates from parts and count the time between two dates.
    group: skill
    learn:
      - Build a date from a year, month and day
      - Count the days between two dates
      - Count whole months or years between dates
      - Add days to a date
  - slug: subtotals
    title: SUMPRODUCT, SUBTOTAL and AGGREGATE
    summary: Multiply and add in one step, and pick a total by its code.
    group: skill
    learn:
      - Multiply pairs of values and add the results
      - Pick a total or a count by its code
      - Total a range while skipping errors
      - Check one total against another
  - slug: dynamic-arrays
    title: FILTER, UNIQUE, SORT and LET
    summary: Return a whole list at once, sort it, and name the steps of a long formula.
    group: skill
    learn:
      - Keep the rows that pass one or two tests with FILTER
      - List each value once with UNIQUE and count the list
      - Sort a report and keep the top rows
      - Name the steps of a formula with LET
  - slug: models
    title: Small working sheets
    summary: Commission, payroll, stock and a month end checklist, each built from formulas.
    group: skill
    learn:
      - Work out commission from a rate table
      - Total headcount and payroll
      - Flag the items that need reordering
      - Track which month end tasks are done
  - slug: capstone
    title: Capstone tasks
    summary: Longer tasks that use the functions from every other track.
    group: skill
    learn:
      - Build a sales summary from raw rows
      - Pull answers from three tables
      - Clean up an imported list
      - Find and fix broken formulas
  - slug: interview-finance-analyst
    title: Finance analyst interview
    summary: Growth, margin, variance and weighted cost, the way a finance analyst test asks for them.
    group: interview
    assessment: finance
    learn:
      - Work out growth from one year to the next
      - Turn revenue and cost into a margin
      - Flag a variance that breaks a limit in either direction
      - Weight a cost by quantity and find a top customer's share
  - slug: interview-fpa
    title: FP&A interview
    summary: Year to date, run rate, roll ups and headcount cost, as in a planning and analysis test.
    group: interview
    assessment: finance
    learn:
      - Add up the months to date
      - Project a full year from the run rate
      - Roll costs up by department and type
      - Cost a headcount plan and compare a quarter with budget
  - slug: interview-accounting
    title: Accounting interview
    summary: Overdue days, ageing, reconciliation, accruals and a trial balance check.
    group: interview
    assessment: finance
    learn:
      - Count the days an invoice is overdue
      - Sort balances into ageing bands
      - Match a ledger to a bank statement
      - Accrue part of a month and check a trial balance
  - slug: interview-data-analyst
    title: Operations and data analyst interview
    summary: Late orders, lookups across tables, rates, stock cover and messy codes.
    group: interview
    assessment: data-analyst
    learn:
      - Count the orders that shipped late
      - Pull a value from a second table by its key
      - Work out an on time rate for one carrier
      - Clean a code before you look it up
  - slug: interview-admin
    title: Office and admin assistant interview
    summary: Tidy names, room bookings, a colleague's extension, addresses and petty cash, as in an office skills test.
    group: interview
    assessment: beginner
    learn:
      - Tidy a pasted name with TRIM and PROPER
      - Count the bookings for one room
      - Look up a colleague's extension
      - Join an address and keep track of petty cash
  - slug: interview-sales
    title: Sales and marketing analyst interview
    summary: Conversion, targets, return on ad spend, customer concentration and revenue by region and month.
    group: interview
    assessment: intermediate
    learn:
      - Work out a conversion rate
      - Check a rep against target
      - Find the campaign with the best return on spend
      - Measure how much revenue the top customers bring
