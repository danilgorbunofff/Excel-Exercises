id: mode-the-most-common-value
slug: mode-the-most-common-value
level: 2
title: "MODE: the most common value"
topic: statistics
updated: 2026-11-16
checkedInExcel: 2026-11-16
screens:
  - prompt: In C2, find the ticket size that occurs most often.
    rows:
      - [Ticket, Size, Most common]
      - [T-1, 3, null]
      - [T-2, 5, null]
      - [T-3, 3, null]
      - [T-4, 7, null]
      - [T-5, 3, null]
      - [T-6, 5, null]
    answerCell: C2
    expected: 3
    answer: =MODE(B2:B7)
    requiredFunctions: [MODE]
    hints:
      nudge: "You want the size that repeats most, not the middle or the largest."
      rule: "MODE returns the value that occurs most often in a range. The result is always one of the values in the list."
    misses:
      value: Three tickets are size 3 and two are size 5, so the most common size is 3.
      syntax: "Check the brackets, commas and quote marks. MODE follows the pattern `=MODE(number1, [number2], ...)`."
      required-function: The task asks for the most frequent size, not the middle or the largest.
      reference: Read the sizes from B2:B7, so a changed size updates the answer.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =MODE(B2:B7)
      - =mode(b2:b7)
      - =MODE($B$2:$B$7)
      - =MODE(B2:B7)+0
      - =MODE(B2:B7)*1
      - =MODE(B$2:B$7)
    reject:
      - { formula: =MEDIAN(B2:B7), rule: required-function }
      - { formula: =MAX(B2:B7), rule: required-function }
      - { formula: =MODE(B2:B7)*2, rule: value }
      - { formula: =MODE(B2:B7)/0, rule: value }
      - { formula: =MODE(B2:B7, rule: syntax }
    variants:
      - { set: { B2: 10 }, expected: 5 }
  - prompt: In C2, find the most common box count. It is not the middle of the sorted list.
    rows:
      - [Store, Boxes, Most common]
      - [S-1, 2, null]
      - [S-2, 9, null]
      - [S-3, 2, null]
      - [S-4, 4, null]
      - [S-5, 7, null]
      - [S-6, 2, null]
      - [S-7, 9, null]
    answerCell: C2
    expected: 2
    answer: =MODE(B2:B8)
    requiredFunctions: [MODE]
    hints:
      nudge: "Look for the count that appears most often, not the one in the middle."
      rule: "MODE counts repeats and returns the most frequent value. MEDIAN sorts and returns the middle one, so the two can differ."
    misses:
      value: "Sorted, the seven counts run 2, 2, 2, 4, 7, 9 and 9: the median is 4 and the mode is 2."
      syntax: "Check the brackets, commas and quote marks. MODE follows the pattern `=MODE(number1, [number2], ...)`."
      required-function: MODE counts repeats, so it can return 2 while the median of the same column sits at 4.
      reference: Read the box counts from B2:B8 instead of typing them.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =MODE(B2:B8)
      - =mode(b2:b8)
      - =MODE($B$2:$B$8)
      - =MODE(B2:B8)+0
      - =MODE(B2:B8)*1
      - =MODE(B$2:B$8)
    reject:
      - { formula: =MEDIAN(B2:B8), rule: required-function }
      - { formula: =MODE(B2:B8)*3, rule: value }
      - { formula: =MODE(B2:B8)/0, rule: value }
      - { formula: =MODE(B2:B8, rule: syntax }
      - { formula: =MODE(B2:B8)-1, rule: value }
    variants:
      - { set: { B2: 3 }, expected: 9 }
notes:
  summary: MODE looks for the value that occurs most often and gives back one of the values on the sheet, not a figure built from them. That makes it the summary for numbers that stand for categories, such as shoe sizes and pack counts.
  syntax: MODE(range)
  example: "`=MODE(A1:A5)` with 6, 2, 6, 9 and 6 gives 6."
  commonErrors:
    - "When no value repeats, MODE returns `#N/A`."
    - 'A word typed as an argument, as in `=MODE("S")`, returns `#VALUE!`. In a range, the same word is ignored.'
    - Two sizes share the highest count, and MODE reports whichever it met first, so the number moves when the rows are reordered.
