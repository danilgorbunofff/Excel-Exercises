screens:
  - prompt: In B2, report the position of the hyphen in the code in A2. Use FIND.
    rows:
      - [Code, Position]
      - [AN-1042, null]
      - [BO-2299, null]
      - [CY-3140, null]
    answerCell: B2
    expected: 3
    answer: =FIND("-",A2)
    requiredFunctions: [FIND]
    hints:
      nudge: You want a position, and a code should be matched with its case exactly as typed.
      rule: FIND takes the text to look for, then the text to search, and returns where it starts, counting from 1. FIND treats capitals and small letters as different.
    misses:
      value: "A, N, then the hyphen: third place."
      syntax: "Check the brackets, commas and quote marks. FIND follows the pattern `=FIND(find_text, within_text, [start_num])`."
      required-function: This screen asks for FIND, which matches case. SEARCH ignores case.
      reference: The code is in A2.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =FIND("-",A2)
      - =find("-",a2)
      - =FIND("-",$A$2)
      - =FIND("-",A$2)
      - =FIND( "-" , A2 )
      - =FIND("-",A2,1)
      - =FIND("-",A2)+0
    reject:
      - { formula: '=SEARCH("-",A2)', rule: required-function }
      - { formula: =LEN(A2), rule: required-function }
