      - { set: { B3: 150000 }, expected: 150000 }
      - { set: { B5: 210000 }, expected: 210000 }
    answer: =LARGE(B2:B5,2)
    requiredFunctions:
      - LARGE
    hints:
      nudge: LARGE with 2 gives the second-highest.
      rule: LARGE(B2:B5,2) skips the top customer.
    misses:
      value: The second-highest revenue is 120000.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for LARGE.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =LARGE(B2:B5,2)
      - =LARGE($B$2:$B$5,2)
    reject:
      - formula: =MAX(B2:B5)
        rule: required-function
      - formula: =120000
