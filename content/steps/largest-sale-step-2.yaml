      - [Orders, 38, 42, 35, 51, 47, 44, null]
    answerCell: H2
    expected: 51
    variants:
      - { set: { C2: 60 }, expected: 60 }
      - { set: { G2: 60 }, expected: 60 }
    answer: =MAX(B2:G2)
    requiredFunctions:
      - MAX
    hints:
      nudge: MAX works along a row the same way as down a column.
      rule: MAX gives the largest number in a range, across a row as well as down a column.
    misses:
      value: The busiest day has 51 orders. Check that the range runs from B2 to G2.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for MAX.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =MAX(B2:G2)
      - =max(b2:g2)
    reject:
      - formula: =MAX(B2:D2)
        rule: value
      - formula: =51
