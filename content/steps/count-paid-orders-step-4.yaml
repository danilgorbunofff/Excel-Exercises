    answerCell: B10
    expected: 10
    variants:
      - set: { D2: 80 }
        expected: 11
    answer: =COUNT(B2:B8,D2:D8)
    requiredFunctions:
      - COUNT
    hints:
      nudge: COUNT takes more than one range, separated by commas.
      rule: COUNT(B2:B8,D2:D8) counts the amounts in both months and skips the pending ones.
    misses:
      value: There are 10 paid orders across both months. Include both columns.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for COUNT.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =COUNT(B2:B8,D2:D8)
      - =COUNT(B2:D8)
      - =COUNT(B2:B8)+COUNT(D2:D8)
    reject:
