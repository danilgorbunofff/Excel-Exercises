id: multiply-price-by-quantity-step-4
slug: multiply-price-by-quantity-step-4
level: 2
title: Total of a two-line order
updated: 2026-11-25
checkedInExcel: 2026-11-25
parent: multiply-price-by-quantity
step: 4
screens:
  - prompt: "In C5, work out the order total: the first line's price times its quantity, plus the second line's price times its quantity."
    rows:
      - [Product, Price, Quantity]
      - [Pens, 1.2, 25]
      - [Pads, 3.5, 12]
      - [null, null, null]
      - [Order total, null, null]
    answerCell: C5
    expected: 72
    variants:
      - set: { C3: 20 }
        expected: 100
    answer: =B2*C2+B3*C3
    requiredFunctions: []
    hints:
      nudge: Work out each line's total, then add the two.
      rule: Excel multiplies before it adds, so B2*C2+B3*C3 needs no brackets.
    misses:
      value: The order comes to 72. Multiply each line, then add.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =B2*C2+B3*C3
      - =(B2*C2)+(B3*C3)
      - =SUMPRODUCT(B2:B3,C2:C3)
    reject:
      - formula: =(B2+B3)*(C2+C3)
        rule: value
      - formula: =B2*C2+B3
        rule: value
      - formula: =72
        rule: reference
      - formula: =B2*C2+B3*C3,
        rule: syntax
