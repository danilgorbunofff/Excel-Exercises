id: bank-reconciliation-match
slug: bank-reconciliation-match
level: 3
title: Bank reconciliation match
topic: interview-accounting
updated: 2026-11-16
checkedInExcel: 2026-11-16
screens:
  - prompt: In C6, show Matched when the bank statement has a line with the same reference and the same amount as the ledger line, and Missing when it does not.
    rows:
      - [Ledger ref, Ledger amount, Match, null, Bank ref, Bank amount]
      - [CHQ 2207, 450, null, null, CHQ 2207, 450]
      - [CHQ 2208, 1200, null, null, DD 5513, 89.5]
      - [DD 5513, 89.5, null, null, CHQ 2210, 310]
      - [CHQ 2209, 760, null, null, CHQ 2208, 1200]
      - [CHQ 2210, 300, null, null, null, null]
    answerCell: C6
    expected: Missing
    variants:
      - set: { F4: 300 }
        expected: "Matched"
    answer: =IF(COUNTIFS($E$2:$E$5,A6,$F$2:$F$5,B6)>0,"Matched","Missing")
    hints:
      nudge: The bank has a CHQ 2210, but check the amount as well as the reference.
      rule: COUNTIFS counts the bank lines where both the reference and the amount match. IF turns a count above 0 into Matched.
    misses:
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
      value: The bank shows CHQ 2210 for 310, but the ledger has 300. The reference matches and the amount does not, so it is Missing.
      syntax: 'Check the brackets, commas and quote marks. The pattern is `=IF(COUNTIFS(refs, ref, amounts, amount)>0, "Matched", "Missing")`.'
      reference: Compare A6 and B6 with the bank columns E2:E5 and F2:F5.
    accept:
      - =IF(COUNTIFS($E$2:$E$5,A6,$F$2:$F$5,B6)>0,"Matched","Missing")
      - =if(countifs($e$2:$e$5,a6,$f$2:$f$5,b6)>0,"Matched","Missing")
      - =IF(COUNTIFS(E2:E5,A6,F2:F5,B6)=0,"Missing","Matched")
      - =IF(COUNTIFS(F2:F5,B6,E2:E5,A6),"Matched","Missing")
    reject:
      - formula: =IF(COUNTIF(E2:E5,A6)>0,"Matched","Missing")
        rule: value
      - formula: =IF(COUNTIFS(E2:E5,A6,F2:F5,B6)>0,"Missing","Matched")
        rule: value
      - formula: =IF(COUNTIFS(E2:E5,A4,F2:F5,B4)>0,"Matched","Missing")
        rule: value
      - formula: =COUNTIFS(E2:E5,A6,F2:F5,B6)
        rule: value
      - formula: =IF(COUNTIFS(E2:E5,A6,F2:F5,B6)>0,"Matched","Missing"
        rule: syntax
  - prompt: The match results are now in column C. In D2, total the ledger amounts that are missing from the bank.
    rows:
      - [Ledger ref, Ledger amount, Match, Unmatched total, Bank ref, Bank amount]
      - [CHQ 2207, 450, Matched, null, CHQ 2207, 450]
      - [CHQ 2208, 1200, Matched, null, DD 5513, 89.5]
      - [DD 5513, 89.5, Matched, null, CHQ 2210, 310]
      - [CHQ 2209, 760, Missing, null, CHQ 2208, 1200]
      - [CHQ 2210, 300, Missing, null, null, null]
    answerCell: D2
    expected: 1060
    variants:
      - set: { B5: 1041 }
        expected: 1341
      - set: { C2: "Missing" }
        expected: 1510
    answer: =SUMIF(C2:C6,"Missing",B2:B6)
    hints:
      nudge: Add the ledger amounts only on the rows marked Missing.
      rule: SUMIF tests the match column and adds the ledger amounts beside it.
    misses:
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
      value: CHQ 2209 for 760 and CHQ 2210 for 300 are missing, which is 1060 to explain.
      syntax: "Check the brackets, commas and quote marks. SUMIF follows the pattern `=SUMIF(range, criteria, sum_range)`."
      reference: The match results run down C2:C6 and the ledger amounts down B2:B6.
    accept:
      - =SUMIF(C2:C6,"Missing",B2:B6)
      - =sumif(c2:c6,"missing",b2:b6)
      - =SUMIFS(B2:B6,C2:C6,"Missing")
      - =SUMIF($C$2:$C$6,"Missing",$B$2:$B$6)
    reject:
      - { formula: '=SUMIF(C2:C6,"Matched",B2:B6)', rule: value }
      - { formula: '=COUNTIF(C2:C6,"Missing")', rule: value }
      - { formula: "=SUM(B2:B6)-SUM(F2:F5)", rule: value }
      - { formula: '=SUMIF(C2:C6,"Missing")', rule: value }
      - { formula: "=760+300", rule: reference }
      - { formula: '=SUMIF(C2:C6,"Missing",B2:B6', rule: syntax }
notes:
  summary: A bank reconciliation checks each ledger line against the statement. Matching on the reference alone misses a line booked at the wrong amount, so both must agree.
  syntax: IF(COUNTIFS(bank_refs,ref,bank_amounts,amount)>0,"Matched","Missing")
  example: '`=COUNTIFS(A1:A3,"CHQ 1",B1:B3,50)` counts the lines with that reference and that amount.'
  commonErrors:
    - COUNTIF on the reference alone calls a line Matched even when the amount differs.
    - The difference between the two totals hides which lines are out.
    - A reference typed with an extra space on one side does not match.
