id: datedif-days-months-or-years-between-step-2
slug: datedif-days-months-or-years-between-step-2
level: 1
title: Complete months apart
updated: 2026-11-25
checkedInExcel: 2026-11-25
parent: datedif-days-months-or-years-between
step: 2
screens:
  - prompt: In D2, find the complete months from the start date in B2 to the review date in C2. Use DATEDIF with "M".
    rows:
      - [Employee, Started, Review date, Months]
      - [Ada Lovelace, 44562, 45352, null]
    answerCell: D2
    expected: 26
    variants:
      - set: { B2: 44197 }
        expected: 38
    answer: =DATEDIF(B2,C2,"M")
    requiredFunctions:
      - DATEDIF
    hints:
      nudge: '"M" counts complete months, ignoring the days left over.'
      rule: DATEDIF takes the start date, the end date, then the unit in quotes. "M" gives whole months.
    misses:
      value: Ada has served 26 complete months.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for DATEDIF.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =DATEDIF(B2,C2,"M")
      - =DATEDIF(B2,C2,"Y")*12+DATEDIF(B2,C2,"YM")
      - =DATEDIF($B$2,$C$2,"M")
    reject:
      - formula: =DATEDIF(B2,C2,"Y")
        rule: value
      - formula: =DATEDIF(B2,C2,"YM")
        rule: value
      - formula: =(C2-B2)/30
        rule: required-function
      - formula: =26
        rule: required-function
      - formula: =DATEDIF(B2,C2,"M"
        rule: syntax
