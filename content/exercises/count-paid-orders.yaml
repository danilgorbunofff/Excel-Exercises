id: count-paid-orders
slug: count-paid-orders
level: 1
title: Count the paid orders
topic: counting
updated: 2026-11-11
checkedInExcel: 2026-11-16
screens:
  - prompt: Unpaid orders show the word pending instead of an amount. In B8, count the paid orders.
    rows:
      - [Order, Amount]
      - [A-101, 120]
      - [A-102, pending]
      - [A-103, 75]
      - [A-104, 210]
      - [A-105, pending]
      - [A-106, 40]
      - [Paid orders, null]
    answerCell: B8
    expected: 4
    answer: =COUNT(B2:B7)
    requiredFunctions: [COUNT]
    hints:
      nudge: One function counts only the cells that hold numbers.
      rule: COUNT counts cells that hold numbers and skips text. COUNTA counts every cell that is not empty.
    misses:
      syntax: Write the range as the first cell, a colon, then the last cell.
      required-function: Use COUNT. It counts only the cells with an amount.
      reference: Point at the amounts in B2 to B7, not at B8.
      value: Check the range. COUNT needs the amounts in B2 to B7, and the order codes are text.
    accept:
      - =COUNT(B2:B7)
      - =count(b2:b7)
      - =COUNT(A2:B7)
    reject:
      - { formula: "=COUNT(B2:B7", rule: syntax }
      - { formula: "=COUNTA(B2:B7)", rule: required-function }
      - { formula: "=COUNT(B2:B8)", rule: reference }
      - { formula: "=COUNT(A2:A7)", rule: value }
      - { formula: "=COUNT(B2:B6)", rule: value }
notes:
  summary: COUNT counts the cells that hold numbers. Text, empty cells and errors are not counted.
  syntax: COUNT(value1, [value2], ...)
  example: "`=COUNT(A1:A4)` with 5, n/a, 8 and an empty cell gives 2."
  commonErrors:
    - Using COUNT on a column of names, which gives 0 because names are text.
