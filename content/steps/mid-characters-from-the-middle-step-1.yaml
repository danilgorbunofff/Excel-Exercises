id: mid-characters-from-the-middle-step-1
slug: mid-characters-from-the-middle-step-1
level: 1
title: Month from a date written as text
updated: 2026-11-25
checkedInExcel: 2026-11-25
parent: mid-characters-from-the-middle
step: 1
screens:
  - prompt: A2 holds a date as text, year-month-day. In B2, take the 2 characters of the month, starting at character 6. Use MID.
    rows:
      - [Date text, Month]
      - ["2026-03-15", null]
    answerCell: B2
    expected: "03"
    variants:
      - set: { A2: "2025-11-02" }
        expected: "11"
    answer: =MID(A2,6,2)
    requiredFunctions:
      - MID
    hints:
      nudge: MID takes the text, where to start, and how many characters.
      rule: MID(A2,6,2) starts at character 6 and takes 2.
    misses:
      value: The month is 03.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for MID.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =MID(A2,6,2)
      - =mid(a2,6,2)
    reject:
      - formula: =MID(A2,5,2)
        rule: value
      - formula: =LEFT(A2,4)
        rule: required-function
      - formula: ="03"
        rule: required-function
      - formula: =MID(A2,6,2
        rule: syntax
