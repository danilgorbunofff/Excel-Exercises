    answer: =SUM(--ISNA(MATCH(D2:D9,A2:A6,0)))
    requiredFunctions: []
    hints:
      nudge: "Match every ordered code at once and count the #N/A results."
      rule: "MATCH works on all the ordered codes at once, giving a position or `#N/A` for each. ISNA marks the missing ones; -- makes them 1, and SUM counts them."
    misses:
