        rule: value
      - formula: =TAKE(FILTER(C2:D19,B2:B19="East"),3)
        rule: value
      - formula: =SORT(FILTER(C2:D19,B2:B19="East"),2,-1)
        rule: value
      - formula: =TAKE(SORT(C2:D19,2,-1),3)
        rule: value
notes:
  summary: "Dynamic-array functions nest: the result of one is the input of the next. Filter first, then sort, then take the top rows."
  syntax: "TAKE(SORT(FILTER(array, include), sort_index, -1), rows)"
  example: '`=TAKE(SORT(FILTER(A2:B9,C2:C9="Paid"),2,-1),5)` lists the five largest paid invoices.'
  commonErrors:
    - Taking the top rows before sorting returns the first rows, not the largest.
    - The sort column counts within the filtered array, so the amount is column 2 of C:D.
    - If fewer rows pass the filter than TAKE asks for, TAKE returns the rows there are.
