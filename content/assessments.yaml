# Mock assessments, taken in order against the clock, with no hints and the
# results at the end. The free sample uses practice exercises. Every other set
# needs PRO and uses held-out tasks from content/mocks/, which appear nowhere
# else, so a certificate tests work the learner has not practised. A task is an
# id (its first screen) or { exercise, screen } for a later screen.
sets:
  - slug: sample
    title: Sample assessment
    summary: Six short tasks, one per core skill, to find your weak spot and see how a timed assessment works.
    minutes: 10
    sample: true
    # One task per skill, easiest first, so the score per function names a weak spot.
    tasks:
      - sum-a-column
      - pass-or-fail
      - find-a-price
      - { exercise: len-left-and-right-count-and-cut, screen: 1 }
      - days-and-simple-date-maths
      - year-to-date-actual-against-budget

  - slug: beginner
    title: Beginner
    summary: Totals, averages, counts, a first IF and simple percentages, for a first Excel test.
    minutes: 25
    tasks:
      - meeting-room-hours
      - average-basket-size
      - longest-training-run
      - lowest-supplier-bid
      - forms-returned
      - scores-still-missing
      - cost-of-the-tickets
      - share-of-budget-spent
      - late-or-on-time
      - average-customer-rating

  - slug: intermediate
    title: Intermediate
    summary: Conditional counts and totals, lookups with a fallback, bands and text, as in a general Excel test.
    minutes: 35
    tasks:
      - orders-of-250-or-more
      - online-sales-total
      - remote-staff-in-sales
      - price-for-a-part-number
      - manager-or-unknown
      - employee-number-for-a-name
      - discount-for-an-order-size
      - risk-level-from-a-score
      - product-family-from-a-code
      - pallets-needed

  - slug: office-essentials
    title: Office essentials
    summary: Totals, averages, conditional counts, a first IF and a first lookup, as in an office skills test.
    minutes: 30
    tasks:
      - invoice-total-from-lines
      - average-call-time
      - vat-on-a-net-price
      - count-completed-tasks
      - spend-for-one-department
      - holiday-days-left
      - pass-or-resit
      - phone-extension-for-a-name
      - mileage-claim
      - percent-of-target-reached

  - slug: data-analyst
    title: Data analyst
    summary: Conditional counts, lookups, ranking, text and dynamic arrays, as in an analyst screening test.
    minutes: 40
    tasks:
      - open-orders-in-one-region
      - average-sale-without-zeros
      - best-selling-product
      - middle-order-value
      - month-from-a-batch-code
      - region-or-not-listed
      - active-customers-count
      - east-orders-largest-first
      - share-of-big-tickets
      - rank-of-one-store

  - slug: finance
    title: Finance
    summary: Margins, run rates, variances, tax bands and weighted costs, as in a finance or accounting test.
    minutes: 40
    tasks:
      - gross-margin-percent
      - year-to-date-sales
      - annual-run-rate
      - variance-needs-review
      - straight-line-depreciation
      - weighted-unit-cost
      - tax-rate-band
      - cost-by-department-and-type
      - accrual-for-part-of-a-period
      - savings-after-compound-growth
