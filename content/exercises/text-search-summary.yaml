notes:
  summary: FIND gives the position of a separator, so MID can start reading just after it. In COUNTIF, SUMIF and AVERAGEIFS criteria, a star matches any run of characters.
  syntax: MID(text,FIND("-",text)+1,4) finds the separator then slices after it; criteria take patterns
  example: '`=MID("AB-9071",FIND("-","AB-9071")+1,2)` gives 90.'
  commonErrors:
    - FIND cannot see the hyphen in the code, so the MID call receives no start position.
    - No row matches the pattern, so AVERAGEIFS has no numbers to average.
    - Dropping the plus one returns -104, which is four characters starting at the hyphen.
