notes:
  summary: SUMIF totals one column for the rows that match a label, so the revenue and the cost of one region each come from one call. The margin is their difference over revenue, and IFERROR shows a blank when there is no revenue.
  syntax: IFERROR(ROUND((SUMIF(regions,"North",revenue)-SUMIF(regions,"North",cost))/SUMIF(regions,"North",revenue)*100,1),"")
  example: '`=IFERROR(ROUND((B1-C1)/B1*100,1),"")` with 400 in B1 and 300 in C1 gives 25, and with B1 empty it gives a blank.'
  commonErrors:
    - A region with no revenue divides by zero, so the cell shows `#DIV/0!` until IFERROR catches it.
    - North is typed without quotes, so Excel reads it as a name and returns `#NAME?`.
    - Rounding the ratio to one decimal before multiplying by 100 gives 40 instead of 44.8.
