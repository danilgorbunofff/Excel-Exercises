screens:
  - prompt: In D2, put the postcode in C2 into capitals. Use UPPER.
    rows:
      - [Office, Region, Postcode, Tidy]
      - [York, North, yo1 7hu, null]
    answerCell: D2
    expected: YO1 7HU
    variants:
      - set: { C2: ne1 4xf }
        expected: NE1 4XF
    answer: =UPPER(C2)
    requiredFunctions:
      - UPPER
    hints:
      nudge: UPPER changes every letter to a capital.
      rule: UPPER changes every letter to a capital; digits and spaces stay as they are.
    misses:
      value: The postcode reads YO1 7HU.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for UPPER.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =UPPER(C2)
      - =upper(c2)
      - '=UPPER(C2)&""'
      - "=UPPER(UPPER(C2))"
    reject:
      - formula: =PROPER(C2)
        rule: required-function
      - formula: ="YO1 7HU"
        rule: required-function
      - formula: =UPPER(C2
        rule: syntax
