id: mround-and-floor-round-to-a-multiple-step-4
slug: mround-and-floor-round-to-a-multiple-step-4
level: 2
title: Round a price to 5 cents
updated: 2026-11-25
checkedInExcel: 2026-11-25
parent: mround-and-floor-round-to-a-multiple
step: 4
screens:
  - prompt: Cash prices end in 0 or 5 cents. In C2, round the price in B2 to the nearest 0.05. Use MROUND.
    rows:
      - [Item, Price, Cash price]
      - [Coffee, 2.47, null]
    answerCell: C2
    expected: 2.45
    variants:
      - set: { B2: 2.42 }
        expected: 2.4
    answer: =MROUND(B2,0.05)
    requiredFunctions:
      - MROUND
    hints:
      nudge: The multiple can be a decimal, such as 0.05.
      rule: "The multiple can be a decimal: 0.05 gives the nearest 5 cents."
    misses:
      value: 2.47 rounds to 2.45 for cash.
      syntax: Check the brackets, commas and quotes.
      required-function: This task asks for MROUND.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =MROUND(B2,0.05)
      - =MROUND(B2,5%)
    reject:
      - formula: =ROUND(B2,1)
        rule: required-function
      - formula: =MROUND(B2,0.1)
        rule: value
      - formula: =2.45
        rule: required-function
      - formula: =MROUND(B2,0.05
        rule: syntax
