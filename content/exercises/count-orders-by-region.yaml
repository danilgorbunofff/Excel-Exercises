id: count-orders-by-region
slug: count-orders-by-region
level: 1
title: Count orders from one region
topic: conditions
updated: 2026-11-16
checkedInExcel: 2026-11-16
screens:
  - prompt: In B8, count the orders from the North region. Use COUNTIF.
    rows:
      - [Order, Region]
      - [1001, North]
      - [1002, South]
      - [1003, North]
      - [1004, East]
      - [1005, West]
      - [1006, North]
      - [North orders, null]
    answerCell: B8
    expected: 3
    answer: '=COUNTIF(B2:B7,"North")'
    requiredFunctions: [COUNTIF]
    hints:
      nudge: One function counts only the cells that match a condition.
      rule: COUNTIF takes a range, then what to look for. Text to look for goes in double quotes, and case does not matter.
    misses:
      syntax: Put the text to look for in double quotes, as in `"North"`.
      required-function: Use COUNTIF, so the count updates when an order changes.
      reference: Point at the regions in B2 to B7, not at B8.
      value: Check the range and the spelling of the region. COUNTIF counts whole matches only.
    accept:
      - '=COUNTIF(B2:B7,"North")'
      - '=COUNTIF(B2:B7,"north")'
      - '=countif(b2:b7,"North")'
    reject:
      - { formula: "=COUNTIF(B2:B7,North)", rule: syntax }
      - { formula: "=COUNTA(B2:B7)", rule: required-function }
      - { formula: '=COUNTIF(B2:B8,"North")', rule: reference }
      - { formula: '=COUNTIF(B2:B7,"Nort")', rule: value }
      - { formula: '=COUNTIF(A2:A7,"North")', rule: value }
notes:
  summary: COUNTIF counts the cells in a range that match one condition. Text matches ignore case.
  syntax: COUNTIF(range, criteria)
  example: '`=COUNTIF(A1:A10,"Paid")` counts the cells in A1 to A10 that say Paid.'
  commonErrors:
    - Text criteria without double quotes.
    - A misspelt criterion, which matches nothing and gives 0.
