      - { set: { B2: 6.5, B9: 10 }, expected: 8.333333333333334 }
      - { set: { B2: 12 }, expected: 8.333333333333334 }
    answer: =(SUM(B2:B9)-MAX(B2:B9)-MIN(B2:B9))/(COUNT(B2:B9)-2)
