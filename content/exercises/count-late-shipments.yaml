id: count-late-shipments
slug: count-late-shipments
level: 2
title: Count late shipments
topic: interview-data-analyst
updated: 2026-11-16
checkedInExcel: 2026-11-16
screens:
  - prompt: Column D holds shipped minus promised, in days. In E2, count the orders that shipped late. Use COUNTIF.
    rows:
      - [Order, Promised, Shipped, Days late, Answer]
      - [SO-301, 46020, 46020, 0, null]
      - [SO-302, 46021, 46024, 3, null]
      - [SO-303, 46023, 46022, -1, null]
      - [SO-304, 46025, 46027, 2, null]
      - [SO-305, 46026, 46026, 0, null]
      - [SO-306, 46027, 46034, 7, null]
    answerCell: E2
    expected: 3
    answer: =COUNTIF(D2:D7,">0")
    requiredFunctions: [COUNTIF]
    hints:
      nudge: An order is late when it shipped at least one day after its promise.
      rule: COUNTIF counts the cells that meet a condition. A comparison goes inside the quotes, in front of the number.
    misses:
      value: SO-302, SO-304 and SO-306 shipped late. A zero is on time and minus 1 is early.
      syntax: "Check the brackets, commas and quote marks. COUNTIF follows the pattern `=COUNTIF(range, criteria)`."
      required-function: COUNT counts every number, early and on time included. COUNTIF counts only the late ones.
      reference: The days late run down D2:D7.
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
    accept:
      - =COUNTIF(D2:D7,">0")
      - =countif(d2:d7,">0")
      - =COUNTIF($D$2:$D$7,">0")
      - =COUNTIF(D2:D7,">=1")
    reject:
      - { formula: '=COUNTIF(D2:D7,">=0")', rule: value }
      - { formula: '=COUNTIF(D2:D7,"<0")', rule: value }
      - { formula: '=COUNTIF(C2:C7,">0")', rule: value }
      - { formula: "=COUNT(D2:D7)", rule: required-function }
      - { formula: '=COUNTIF(D2:D7,">0"', rule: syntax }
    variants:
      - { set: { D2: 3 }, expected: 4 }
  - prompt: In E2, show the share of all orders that shipped late. Use COUNTIF.
    rows:
      - [Order, Promised, Shipped, Days late, Answer]
      - [SO-301, 46020, 46020, 0, null]
      - [SO-302, 46021, 46024, 3, null]
      - [SO-303, 46023, 46022, -1, null]
      - [SO-304, 46025, 46027, 2, null]
      - [SO-305, 46026, 46026, 0, null]
      - [SO-306, 46027, 46034, 7, null]
    answerCell: E2
    expected: 0.5
    answer: =COUNTIF(D2:D7,">0")/COUNTA(A2:A7)
    requiredFunctions: [COUNTIF]
    hints:
      nudge: Divide the late orders by all the orders.
      rule: COUNTIF gives the late orders. COUNTA of the order column, or COUNT of the days column, gives every order.
    misses:
      value: 3 late orders out of 6 is 0.5, or half.
      syntax: Check the brackets. COUNTIF and the count below it each need their own pair.
      required-function: Let COUNTIF count the late orders, so the share updates when the data changes.
      reference: Point at the data rather than typing the counts.
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
    accept:
      - =COUNTIF(D2:D7,">0")/COUNTA(A2:A7)
      - =countif(d2:d7,">0")/counta(a2:a7)
      - =COUNTIF(D2:D7,">0")/COUNT(D2:D7)
      - =COUNTIF($D$2:$D$7,">0")/COUNTA($A$2:$A$7)
    reject:
      - { formula: '=COUNTIF(D2:D7,">0")', rule: value }
      - { formula: '=COUNTIF(D2:D7,">0")/COUNTIF(D2:D7,"<=0")', rule: value }
      - { formula: '=COUNTIF(D2:D7,">0")/SUM(D2:D7)', rule: value }
      - { formula: '=COUNTIF(D2:D7,">0")/COUNTA(A1:A7)', rule: value }
      - { formula: '=COUNTIF(D2:D7,">0"/COUNTA(A2:A7)', rule: syntax }
    variants:
      - { set: { D2: 3 }, expected: 0.6666666666666666 }
  - prompt: In E2, work out the average days late, counting only the orders that were late. Use AVERAGEIF.
    rows:
      - [Order, Promised, Shipped, Days late, Answer]
      - [SO-301, 46020, 46020, 0, null]
      - [SO-302, 46021, 46024, 3, null]
      - [SO-303, 46023, 46022, -1, null]
      - [SO-304, 46025, 46027, 2, null]
      - [SO-305, 46026, 46026, 0, null]
      - [SO-306, 46027, 46034, 7, null]
    answerCell: E2
    expected: 4
    answer: =AVERAGEIF(D2:D7,">0")
    requiredFunctions: [AVERAGEIF]
    hints:
      nudge: Average the days, but only where the days are above zero.
      rule: AVERAGEIF takes a range and a condition, and averages only the cells that meet it.
    misses:
      value: The late orders were 3, 2 and 7 days late. That is 12 days over 3 orders, an average of 4.
      syntax: "Check the brackets, commas and quote marks. AVERAGEIF follows the pattern `=AVERAGEIF(range, criteria)`."
      required-function: A plain AVERAGE pulls in the on time and early orders, which drags the figure down.
      reference: The days late run down D2:D7.
      fragile: The data can change, so the formula has to work the result out from the cells, not from values you can see.
    accept:
      - =AVERAGEIF(D2:D7,">0")
      - =averageif(d2:d7,">0")
      - =AVERAGEIF($D$2:$D$7,">0")
      - =AVERAGEIF(D2:D7,">0",D2:D7)
    reject:
      - { formula: "=AVERAGE(D2:D7)", rule: required-function }
      - { formula: '=AVERAGEIF(D2:D7,">=0")', rule: value }
      - { formula: '=AVERAGEIF(D2:D7,"<0")', rule: value }
      - { formula: '=AVERAGEIF(C2:C7,">0")', rule: value }
      - { formula: '=AVERAGEIF(D2:D7,">0"', rule: syntax }
    variants:
      - { set: { D2: 3 }, expected: 3.75 }
notes:
  summary: Late shipments are counted from a days late column, where above zero is late, zero is on time and below zero is early. The count, the share and the average lateness are the usual first questions.
  syntax: COUNTIF(days,">0"), COUNTIF(days,">0")/COUNTA(orders), AVERAGEIF(days,">0")
  example: '`=AVERAGEIF(A1:A4,">0")` with 0, 2, 4 and minus 1 in A1:A4 gives 3.'
  commonErrors:
    - Greater than or equal to 0 counts the on time orders as late.
    - COUNTA from row 1 counts the header as an order.
    - A plain AVERAGE includes the early and on time orders.
