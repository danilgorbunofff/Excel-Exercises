id: average-drill-1
slug: average-drill-1
level: 1
title: Average five test scores
updated: 2026-11-17
checkedInExcel: 2026-11-17
function: AVERAGE
screens:
  - prompt: In B7, use AVERAGE to find the mean score in B2:B6.
    rows:
      - [Student, Score]
      - [Ana, 72]
      - [Bo, 85]
      - [Cai, 64]
      - [Dee, 91]
      - [Eli, 78]
      - [Average, null]
    answerCell: B7
    expected: 78
    variants:
      - set: { B4: 90 }
        expected: 83.2
    answer: =AVERAGE(B2:B6)
    requiredFunctions:
      - AVERAGE
    hints:
      nudge: One function adds the numbers and divides by how many there are.
      rule: AVERAGE(range) gives the mean of the numbers in the range.
    misses:
      value: The five scores average 78.
      syntax: Check the brackets, commas and quotes.
      required-function: This drill asks for AVERAGE.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =AVERAGE(B2:B6)
      - =average(b2:b6)
    reject:
      - formula: =SUM(B2:B6)/5
        rule: required-function
      - formula: =AVERAGE(B2:B5)
        rule: fragile
      - formula: =AVERAGE(B2:B6)/2
        rule: value
      - formula: =78
        rule: required-function
      - formula: =AVERAGE(B2:B6
        rule: syntax
