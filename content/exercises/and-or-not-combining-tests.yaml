      - [Bolt, 18]
      - [Nut, 22]
      - [Washer, 25]
      - [Screw, 30]
      - [Clip, 24]
      - [Pin, 31]
      - [Total, 150]
      - [Either test, null]
    answerCell: B9
    expected: true
    variants:
      - { set: { B2: 25 }, expected: false }
      - { set: { B2: 25, B8: 210 }, expected: true }
      - { set: { B2: 20, B8: 200 }, expected: false }
