id: index-a-value-at-a-row-and-column-step-4
slug: index-a-value-at-a-row-and-column-step-4
level: 2
title: A whole row from the grid
updated: 2026-11-25
checkedInExcel: 2026-11-25
parent: index-a-value-at-a-row-and-column
step: 4
screens:
  - prompt: In B8, return all four quarters for the region at the row number in B7, filling B8 to E8. Use INDEX with 0 as the column.
    rows:
      - [Region, Q1, Q2, Q3, Q4]
      - [North, 120, 140, 160, 150]
      - [South, 90, 110, 130, 145]
      - [East, 105, 95, 120, 135]
      - [West, 75, 95, 115, 100]
      - [null, null, null, null, null]
      - [Row, 3, null, null, null]
      - [Quarters, null, null, null, null]
    answerCell: B8
    expected:
      - [105, 95, 120, 135]
    variants:
      - { set: { B7: 1 }, expected: [[120, 140, 160, 150]] }
      - { set: { B7: 4 }, expected: [[75, 95, 115, 100]] }
    answer: =INDEX(B2:E5,B7,0)
    requiredFunctions:
      - INDEX
    hints:
      nudge: A column number of 0 asks INDEX for the whole row.
      rule: A column number of 0 asks INDEX for the whole row, which spills across the cells to the right.
    misses:
      value: B8 to E8 should show the four quarters of the region in row 3.
      syntax: Check the brackets, commas and quotes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =INDEX(B2:E5,B7,0)
      - =INDEX(B2:E5,B7,)
    reject:
      - formula: =INDEX(B2:E5,B7,1)
        rule: value
      - formula: =INDEX(B2:E5,B7,0
        rule: syntax
