    answer: =RANK(XLOOKUP(E1,A2:A16,B2:B16),B2:B16)
    requiredFunctions: []
    hints:
      nudge: First find the rep's sales from the name, then rank that number in the list.
      rule: XLOOKUP(E1,A2:A16,B2:B16) finds the sales for the name in E1; RANK places them in B2:B16.
    misses:
      value: The rep in E1 is in place 4.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =RANK(XLOOKUP(E1,A2:A16,B2:B16),B2:B16)
      - =RANK(INDEX(B2:B16,MATCH(E1,A2:A16,0)),B2:B16)
      - =COUNTIF(B2:B16,">"&VLOOKUP(E1,A2:B16,2,FALSE))+1
    reject:
