notes:
  summary: TEXTBEFORE and TEXTAFTER split a cell on a delimiter, one function per side. You name the delimiter as a piece of text, so no position number appears anywhere in the formula.
  syntax: TEXTBEFORE(text,"-") keeps what precedes the delimiter; =TEXTAFTER keeps what follows
  example: '`=TEXTBEFORE("inv-77","-")` gives inv and `=TEXTAFTER("inv-77","-")` gives 77 as text.'
  commonErrors:
    - The cell holds no copy of the delimiter, which leaves no place to split.
    - The workbook was built in an Excel version older than the one that added these functions.
    - The two functions differ by one word, and the wrong one returns the other half of the code.
