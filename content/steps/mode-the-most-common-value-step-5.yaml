screens:
  - prompt: In F2, what order quantity comes up most often among the orders marked Done? Ignore the others.
    rows:
      - [Order, Qty, Status, null, null, "Most common, done"]
      - [O-01, 4, Done, null, null, null]
      - [O-02, 2, Open, null, null, null]
      - [O-03, 6, Done, null, null, null]
      - [O-04, 2, Open, null, null, null]
      - [O-05, 4, Done, null, null, null]
      - [O-06, 2, Cancelled, null, null, null]
      - [O-07, 6, Done, null, null, null]
      - [O-08, 4, Done, null, null, null]
      - [O-09, 2, Open, null, null, null]
      - [O-10, 8, Done, null, null, null]
      - [O-11, 2, Done, null, null, null]
      - [O-12, 6, Open, null, null, null]
      - [O-13, 4, Done, null, null, null]
      - [O-14, 2, Cancelled, null, null, null]
      - [O-15, 6, Done, null, null, null]
    answerCell: F2
    expected: 4
    answer: =MODE(IF(C2:C16="Done",B2:B16))
    requiredFunctions: []
    hints:
      nudge: Keep only the Done rows first, then find the most common quantity.
      rule: IF with a test on the whole status column keeps the quantities of Done orders and gives FALSE for the rest. MODE skips the FALSE values.
    misses:
      value: Among completed orders, the most common quantity is 4.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =MODE(FILTER(B2:B16,C2:C16="Done"))
      - =MODE(IF(C2:C16="Done",B2:B16))
    reject:
      - formula: =MODE(B2:B16)
        rule: value
      - formula: =4
        rule: reference
      - formula: =4
        rule: reference
      - formula: =MODE(FILTER(B2:B16,C2:C16="Done")
        rule: syntax
    variants:
      - set: { C2: Open, C6: Open }
        expected: 6
      - set: { C9: Open, C14: Open }
        expected: 6
