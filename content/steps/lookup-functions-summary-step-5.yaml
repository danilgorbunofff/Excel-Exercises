    answer: =XLOOKUP(MAX(C2:C9),C2:C9,A2:A9)
    requiredFunctions: []
    hints:
      nudge: Find the biggest count, then the product on its row.
      rule: MAX(C2:C9) gives the largest count; XLOOKUP finds it and returns the product to its left.
    misses:
      value: The product with the most on hand is the Hinge.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =XLOOKUP(MAX(C2:C9),C2:C9,A2:A9)
      - =INDEX(A2:A9,MATCH(MAX(C2:C9),C2:C9,0))
    reject:
      - formula: =MAX(C2:C9)
        rule: value
      - formula: ="Hinge"
        rule: reference
      - formula: ="Hinge"
