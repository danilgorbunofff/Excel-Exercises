id: subtract-costs-step-3
slug: subtract-costs-step-3
level: 2
title: Stock left at the end of the week
updated: 2026-11-25
checkedInExcel: 2026-11-25
parent: subtract-costs
step: 3
screens:
  - prompt: "In E2, work out the stock left: the opening stock in B2, plus the delivery in C2, minus the units sold in D2."
    rows:
      - [Item, Opening, Delivered, Sold, Left]
      - [Printer paper, 140, 200, 265, null]
    answerCell: E2
    expected: 75
    variants:
      - set: { C2: 150 }
        expected: 25
    answer: =B2+C2-D2
    requiredFunctions: []
    hints:
      nudge: Deliveries add to the stock and sales take it away.
      rule: Stock left is the opening stock, plus what came in, minus what went out.
    misses:
      value: The stock left is 75. Add the delivery and take away the sales.
      syntax: Check the brackets, commas and quotes.
      reference: Point at the cells, so the result follows the data when it changes.
      fragile: The data can change, so the formula must calculate the result from the cells. A typed value, or a formula that is right by chance, will not follow the change.
    accept:
      - =B2+C2-D2
      - =C2+B2-D2
      - =B2-D2+C2
    reject:
      - formula: =B2-C2-D2
        rule: value
      - formula: =B2-D2
        rule: value
      - formula: =75
        rule: reference
      - formula: =B2+C2-D2,
        rule: syntax
